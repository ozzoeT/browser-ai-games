<style>
  :root { --ink:#fff; --mute:#c6d3e6; --acc:#ffd23a; --hot:#ff4d6d; --mint:#5fffd7; --glass:rgba(14,18,40,.66); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 8px #0009; }
  .tl { position: absolute; left: 20px; top: max(14px, env(safe-area-inset-top)); }
  .tl small, .tr small { display: block; font-size: 11px; letter-spacing: 3px; color: var(--mute); font-weight: 700; }
  #score { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.05; }
  #combo { font-size: 15px; font-weight: 800; color: var(--acc); letter-spacing: 1px; min-height: 20px; }
  .tc { position: absolute; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; }
  #world { font-size: 13px; letter-spacing: 4px; font-weight: 800; }
  #next { font-size: 13px; color: var(--mute); margin-top: 4px; font-weight: 700; letter-spacing: 1px; }
  .tr { position: absolute; right: 20px; top: max(14px, env(safe-area-inset-top)); text-align: right; display: flex; gap: 12px; align-items: flex-start; }
  .spd b { font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .hp { width: 150px; height: 10px; border-radius: 6px; background: #ffffff26; overflow: hidden; margin-top: 6px; }
  .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5fffd7, #a6ff6a); border-radius: 6px; transition: width .2s; }
  .hp.low i { background: linear-gradient(90deg, #ff4d6d, #ff9a5a); }
  .boost { width: 150px; height: 5px; border-radius: 4px; background: #ffffff1c; overflow: hidden; margin-top: 5px; }
  .boost i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3fd8ff, #c48bff); }
  .ib { pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; background: var(--glass); border: 1px solid #ffffff30; font-size: 18px; backdrop-filter: blur(10px); }
  #pop { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-weight: 900; font-size: 44px; letter-spacing: 1px;
    text-shadow: 0 3px 0 #0006, 0 0 30px currentColor; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.2,1.8,.4,1); }
  #pop.on { opacity: 1; transform: scale(1); }

  #toast { position: fixed; left: 0; right: 0; top: 19%; text-align: center; pointer-events: none; font-size: 18px; font-weight: 800; letter-spacing: 3px; opacity: 0; transition: opacity .25s; text-shadow: 0 2px 10px #000a; }
  #assist { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; pointer-events: none; font-size: 18px; font-weight: 900; letter-spacing: 3px; color: var(--acc); opacity: 0; text-shadow: 0 2px 10px #000a; }
  #hurt { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,70,90,.55)); opacity: 0; }

  #touch { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none; }
  #touch .g { display: flex; gap: 10px; }
  #touch button { pointer-events: auto; width: 76px; height: 76px; border-radius: 22px; background: rgba(14,18,40,.55); border: 1px solid #ffffff40; font-size: 28px; font-weight: 900; touch-action: none; }
  #touch button.on { background: rgba(255,210,58,.45); }

  #screen { position: fixed; inset: 0; display: flex; align-items: center; padding: 6vw; overflow-y: auto;
    background: linear-gradient(90deg, rgba(10,12,30,.82), rgba(10,12,30,.25) 60%, transparent); }
  #screen:empty { display: none; }
  .panel { max-width: 520px; }
  .eyebrow { font-size: 12px; letter-spacing: 4px; color: var(--mint); font-weight: 800; }

  h1 em { font-style: normal; background: linear-gradient(90deg, #ffd23a, #ff4d6d 55%, #c48bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: 46px; letter-spacing: -1px; margin: 10px 0; }
  .lead { color: var(--mute); font-size: 16px; line-height: 1.6; margin: 10px 0 18px; }
  .cars { display: flex; gap: 10px; margin: 16px 0; }

  .car:hover { transform: translateY(-2px); }
  .car.sel { border-color: var(--acc); background: #ffd23a1c; }
  .car i { display: block; width: 46px; height: 22px; border-radius: 14px 18px 8px 8px; margin: 2px auto 8px; box-shadow: inset 0 -5px 0 #0003, 0 3px 10px #0005; }

  .stats div b { font-size: 34px; font-variant-numeric: tabular-nums; }

  @keyframes pulse { to { transform: scale(1.08); } }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 40px; text-align: center; font-size: 20px; background: #0d1020; }

    #score { font-size: 30px; } .spd b { font-size: 28px; } .hp, .boost { width: 96px; } #world { font-size: 10px; letter-spacing: 2px; } #next { font-size: 11px; }
    .tc { top: 100px; } #pop { font-size: 32px; } #screen { padding: 22px; align-items: flex-start; padding-top: 10vh; background: rgba(10,12,30,.7); }

<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="hurt"></div>
<div id="hud" class="hidden">
  <div class="tl"><small>SCORE</small><div id="score">0</div><div id="combo"></div></div>
  <div class="tc"><div id="world">SUNNY COAST</div><div id="next"></div></div>
  <div class="tr"><div><small>KM/H</small><div class="spd"><b id="spd">0</b></div><div class="hp" id="hpw"><i id="hpbar"></i></div><div class="boost"><i id="bbar"></i></div></div>
    <button class="ib" id="bSound" aria-label="Sound on or off">♪</button><button class="ib" id="bPause" aria-label="Pause">Ⅱ</button></div>

  <div class="g"><button id="tF" class="flip" aria-label="Flip">FLIP</button><button id="tJ" class="jump" aria-label="Jump">JUMP</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').style.display = 'flex'; $('err').textContent = 'Unable to load the 3D engine. Check your internet connection and reload the page.'; return; }

// ---------- helpers ----------
const PI = Math.PI, TAU = PI * 2, V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapC = (u, c) => { u = (u + c / 2) % c; if (u < 0) u += c; return u - c / 2; };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
function store(k, v) { try { localStorage.setItem('rollway.' + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem('rollway.' + k)); return v == null ? d : v; } catch (e) { return d; } }
const SET = Object.assign({ sound: true, car: 0 }, load('settings', {}));
let BEST = load('best', 0);
const TOUCHDEV = matchMedia('(pointer:coarse)').matches;
const CALM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const C = h => new THREE.Color(h);

// ---------- renderer ----------
const canvas = $('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('err').style.display = 'flex'; return; }
const DPR = Math.min(devicePixelRatio || 1, TOUCHDEV ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 100, 800);
scene.background = new THREE.Color(0x000000);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .1, 2600);

// Post: HDR scene (MSAA) -> bright pass -> 4-level blur (real bloom) -> grade. Same pipeline as Iron Line / Trickline (see game-visuals skill).
const POST = (() => {
  const low = /fx=low/.test(location.search) || (TOUCHDEV && Math.min(innerWidth, innerHeight) < 560);
  if (low || !renderer.capabilities.isWebGL2) return null;
  const rt = ms => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: !!ms, samples: ms ? 4 : 0 });
  const main = rt(true), LV = 4, bA = [], bB = []; for (let i = 0; i < LV; i++) { bA.push(rt()); bB.push(rt()); }
  const qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const SM = (u, fs) => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
  const bright = SM({ t: { value: null }, th: { value: 1.1 }, knee: { value: .3 } }, `uniform sampler2D t;uniform float th,knee;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));float s=clamp(l-th+knee,0.,2.*knee);s=s*s/(4.*knee+1e-4);gl_FragColor=vec4(c*max(s,l-th)/max(l,1e-4),1.);}`);
  const blur = SM({ t: { value: null }, dir: { value: new THREE.Vector2() } }, `uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.385).rgb+texture2D(t,vUv-dir*1.385).rgb)*.316;c+=(texture2D(t,vUv+dir*3.231).rgb+texture2D(t,vUv-dir*3.231).rgb)*.070;gl_FragColor=vec4(c,1.);}`);
  const comp = SM({ t: { value: main.texture }, b0: { value: bA[0].texture }, b1: { value: bA[1].texture }, b2: { value: bA[2].texture }, b3: { value: bA[3].texture }, px: { value: new THREE.Vector2() },
    bloom: { value: .55 }, expo: { value: 1.0 }, sat: { value: 1.1 }, vig: { value: .3 }, warm: { value: new THREE.Vector3(1.02, 1, .97) }, sharp: { value: .2 } },
  `uniform sampler2D t,b0,b1,b2,b3;uniform vec2 px;uniform float bloom,expo,sat,vig,sharp;uniform vec3 warm;varying vec2 vUv;
vec3 shoulder(vec3 c){vec3 x=max(c-.78,0.);return min(c,.78)+.22*(1.-exp(-x/.22));}
void main(){vec3 c=texture2D(t,vUv).rgb;
 vec3 nb=(texture2D(t,vUv+vec2(px.x,0.)).rgb+texture2D(t,vUv-vec2(px.x,0.)).rgb+texture2D(t,vUv+vec2(0.,px.y)).rgb+texture2D(t,vUv-vec2(0.,px.y)).rgb)*.25;
 c=max(c+(c-nb)*sharp,0.);
 vec3 b=texture2D(b0,vUv).rgb*.9+texture2D(b1,vUv).rgb*.75+texture2D(b2,vUv).rgb*.6+texture2D(b3,vUv).rgb*.5;
 c=(c+b*bloom)*expo*warm;float l=dot(c,vec3(.2126,.7152,.0722));c=max(mix(vec3(l),c,sat),0.);
 c=shoulder(c);vec2 d=vUv-.5;c*=1.-dot(d,d)*vig*1.8;
 gl_FragColor=vec4(c,1.);
#include <colorspace_fragment>
}`);
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(qs, qc); };
  const size = new THREE.Vector2();
  function resize() { renderer.getDrawingBufferSize(size); main.setSize(size.x, size.y); let w = size.x >> 1, h = size.y >> 1;
    for (let i = 0; i < LV; i++) { bA[i].setSize(Math.max(1, w), Math.max(1, h)); bB[i].setSize(Math.max(1, w), Math.max(1, h)); w >>= 1; h >>= 1; } comp.uniforms.px.value.set(1 / size.x, 1 / size.y); }
  resize();
  function render() {
    renderer.setRenderTarget(main); renderer.render(scene, cam);
    bright.uniforms.t.value = main.texture; pass(bright, bA[0]);
    for (let i = 0; i < LV; i++) { if (i > 0) { blur.uniforms.t.value = bA[i - 1].texture; blur.uniforms.dir.value.set(0, 0); pass(blur, bA[i]); }
      const w = bA[i].width, h = bA[i].height; blur.uniforms.t.value = bA[i].texture; blur.uniforms.dir.value.set(1 / w, 0); pass(blur, bB[i]);
      blur.uniforms.t.value = bB[i].texture; blur.uniforms.dir.value.set(0, 1 / h); pass(blur, bA[i]); }
    pass(comp, null);
  }
  return { render, resize, comp, bright, size };
})();

// "Toy studio" environment for the glossy car paint.
const ENV = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#bcd8ff'); g.addColorStop(.47, '#ffffff'); g.addColorStop(.53, '#9a948c'); g.addColorStop(1, '#3d3a38');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256); x.fillStyle = '#fff';
  [[90, 52, 58, 16], [290, 40, 86, 13], [440, 78, 40, 18], [200, 96, 28, 9]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, 0, TAU); x.fill(); });
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer); const r = pm.fromEquirectangular(t).texture; pm.dispose(); t.dispose(); return r;
})();

// ---------- lights & sky ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.5); scene.add(sun, sun.target);
const carLight = new THREE.PointLight(0xffffff, 0, 22, 2); scene.add(carLight);
const U = { time: { value: 0 } };
const NOISE = (() => {
  const S = 128, R = mulberry(17), g = new Float32Array(32 * 32); for (let i = 0; i < g.length; i++) g[i] = R();
  const sm = t => t * t * (3 - 2 * t), at = (a, b, p) => g[((a % p + p) % p) + ((b % p + p) % p) * 32];
  const n = (x, y, p) => { const xi = Math.floor(x), yi = Math.floor(y), u = sm(x - xi), v = sm(y - yi); return lerp(lerp(at(xi, yi, p), at(xi + 1, yi, p), u), lerp(at(xi, yi + 1, p), at(xi + 1, yi + 1, p), u), v); };
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { let v = 0, a = .55, f = 4; for (let o = 0; o < 4; o++) { v += n(x / S * f, y / S * f, f) * a; a *= .5; f *= 2; } const k = (y * S + x) * 4; d[k] = d[k + 1] = d[k + 2] = clamp(v * 255, 0, 255); d[k + 3] = 255; }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
})();
const skyU = { top: { value: C(0) }, hor: { value: C(0) }, low: { value: C(0) }, sunCol: { value: C(0) }, sunDir: { value: new V3(0, .2, -1).normalize() },
  uTime: U.time, uCloud: { value: NOISE }, uCover: { value: .4 }, uStars: { value: 0 }, uDisc: { value: 1 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform vec3 top,hor,low,sunCol,sunDir;uniform float uTime,uCover,uStars,uDisc;uniform sampler2D uCloud;varying vec3 vD;
float hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
void main(){vec3 d=normalize(vD);float y=max(d.y,0.);vec3 c=mix(hor,top,pow(y,.55));c=mix(c,low,smoothstep(0.,-.35,d.y));
 float s=max(dot(d,sunDir),0.);
 if(uStars>0.){vec3 q=floor(d*300.);float st=step(.9972,hs(q));c+=vec3(st)*uStars*smoothstep(.03,.35,d.y)*(.55+.45*sin(uTime*2.5+hs(q+1.)*40.));}
 vec2 uv=d.xz/(d.y+.16)*.32+vec2(uTime*.006,uTime*.002);float n=texture2D(uCloud,uv).r*.7+texture2D(uCloud,uv*2.3+.3).r*.3;
 float cl=smoothstep(.62-uCover*.3,.86-uCover*.3,n)*smoothstep(.0,.16,d.y);
 vec3 cc=mix(hor*1.05,vec3(1.),.55)*(.8+.25*smoothstep(.4,.9,n))+sunCol*pow(s,8.)*.7;c=mix(c,cc,cl*.8);
 c+=sunCol*(smoothstep(.9990,.9994,s)*5.*uDisc*(1.-cl*.7)+pow(s,40.)*.45+pow(s,5.)*.14);
 gl_FragColor=vec4(c,1.);
#include <colorspace_fragment>
}` }));
sky.frustumCulled = false; sky.renderOrder = -2; scene.add(sky);

// ---------- audio ----------
let AC = null, MASTER = null, NOISEBUF = null, ENGINE = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = SET.sound ? .5 : 0; MASTER.connect(AC.destination);
    NOISEBUF = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NOISEBUF.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ENGINE = makeEngine(); } catch (e) { AC = null; }

const STREAKS = Array.from({ length: 50 }, () => ({ a: rand(0, TAU), r: rand(0, 1), v: rand(.8, 1.6), l: rand(.06, .16) }));
let streakK = 0;
function drawFx(dt) {
  fxc.clearRect(0, 0, fx.width, fx.height);
  streakK = damp(streakK, CALM || G.mode !== 'play' ? 0 : clamp(P.boost, 0, 1) * .9 + clamp((P.v - 55) / 20, 0, .4), 4, dt); if (streakK < .02) return;
  const W = fx.width, H = fx.height, cx = W / 2, cy = H * .45, R = Math.hypot(W, H) * .6;
  fxc.globalCompositeOperation = 'lighter'; fxc.lineCap = 'round';
  for (const s of STREAKS) { s.r += s.v * dt * 1.4; if (s.r > 1.1) { s.r = rand(.35, .5); s.a = rand(0, TAU); }
    const r0 = s.r * R, r1 = (s.r + s.l) * R, ca = Math.cos(s.a), sa = Math.sin(s.a);
    fxc.strokeStyle = `rgba(220,250,255,${.32 * s.r * streakK})`; fxc.lineWidth = (1 + s.r * 2.5) * DPR;
    fxc.beginPath(); fxc.moveTo(cx + ca * r0, cy + sa * r0 * .62); fxc.lineTo(cx + ca * r1, cy + sa * r1 * .62); fxc.stroke(); }
  fxc.globalCompositeOperation = 'source-over';
}

// ---------- HUD ----------
let popTimer = 0, toastTimer = 0;
function pop(t, sub, col) { const el = $('pop'); el.innerHTML = t + (sub ? '<small>' + sub + '</small>' : ''); el.style.color = col || '#ffd23a'; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); popTimer = 1.5; }
function toast(t, col) { if (!t) return; const el = $('toast'); el.textContent = t; el.style.color = col || '#fff'; el.style.opacity = 1; toastTimer = 1.3; }
const hudCache = {};
const setT = (id, v) => { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } };
function updateHud(dt) {
  popTimer -= dt; if (popTimer < 0) $('pop').classList.remove('on'); toastTimer -= dt; if (toastTimer < 0) $('toast').style.opacity = 0;
  G.hurt = Math.max(0, G.hurt - dt * 1.6); $('hurt').style.opacity = (G.hurt * .9).toFixed(3);
  if (G.mode !== 'play' && G.mode !== 'pause') return;
  setT('score', Math.floor(P.score).toLocaleString('en-US'));
  setT('combo', P.combo > 1 ? 'COMBO ' + P.combo + (mult() > 1 ? '  ·  ×' + mult() : '') : '');
  setT('spd', String(Math.round(P.v * 3.6)));
  const seg = segAt(P.s); setT('world', seg.kind === 'tunnel' ? THEMES[seg.theme].name : WORLDS[seg.world].name);
  let nx = ''; if (seg.kind === 'road') { const d = seg.s1 - P.s; if (d < 700) nx = 'TUNNEL IN ' + Math.ceil(d / 10) * 10 + ' m'; else nx = 'LEVEL ' + (seg.level + 1); }
  else nx = 'NEXT: ' + WORLDS[seg.next].name + ' · ' + Math.ceil((seg.s1 - P.s) / 10) * 10 + ' m';
  setT('next', nx);
  const hp = Math.max(0, P.hp); $('hpbar').style.width = hp + '%'; $('hpw').classList.toggle('low', hp <= 40); $('bbar').style.width = clamp(P.boost / 1.7, 0, 1) * 100 + '%';
  const as = $('assist'); const r = frame(P.s).r; const show = P.assist > .05 && r !== Infinity && Math.abs(P.u) > 3; as.textContent = '⬇  EXIT AHEAD · BACK TO THE FLOOR  ⬇'; as.style.opacity = show ? .6 + .4 * Math.sin(G.time * 8) : 0;
}

// ---------- screens ----------
const SCR = $('screen');
function carCards() { return '<div class="cars">' + CARS.map((c, i) => `<button class="car${i === SET.car ? ' sel' : ''}" data-car="${i}"><i style="background:#${C(c.color).getHexString()}"></i><b>${c.name}</b><small>${c.tag}</small></button>`).join('') + '</div>'; }
function bindCars() { SCR.querySelectorAll('[data-car]').forEach(b => b.onclick = () => { SET.car = +b.dataset.car; store('settings', SET); buildCar(SET.car); SCR.querySelectorAll('[data-car]').forEach(x => x.classList.toggle('sel', x === b)); }); }
function showTitle() {
  G.mode = 'menu'; $('hud').classList.add('hidden'); $('touch').classList.add('hidden');
  SCR.innerHTML = `<div class="panel"><div class="eyebrow">SMOOTH CARS · FAST ROADS · UPSIDE-DOWN TUNNELS</div><h1>Roll<em>way</em></h1>
  <p class="lead">Race a glossy toy car down long roads full of ramps, boost pads and little obstacles. Then dive into the tunnels: steer up the walls, ride the ceiling and spin barrel rolls in the air!</p>
  ${carCards()}<button class="btn" id="go">DRIVE <span>→</span></button>
  <div class="keys"><b>←</b><b>→</b> steer · in the air: barrel roll &nbsp; <b>SPACE</b> jump &nbsp; <b>↑</b><b>↓</b> flips in the air<br>Grab the gems, hit the boost pads, jump the barriers · <b>P</b> pause · <b>M</b> sound</div>
  <div class="best">BEST ${Math.floor(BEST).toLocaleString('en-US')}</div></div>`;
  bindCars(); $('go').onclick = () => { audio(); startGame(); };
}
function startGame() {
  SCR.innerHTML = ''; resetWorld((Math.random() * 1e6) | 0); G.mode = 'play'; P.v = 30;
  $('hud').classList.remove('hidden'); if (TOUCHDEV) $('touch').classList.remove('hidden');
  pop(WORLDS[0].name, 'LEVEL 1', '#ffd23a'); audio();
}
function togglePause() {
  if (G.mode === 'play') { G.mode = 'pause'; SCR.innerHTML = `<div class="panel"><div class="eyebrow">PAUSED</div><h2>Take a breath</h2><p class="lead">The road will wait for you.</p>
    <button class="btn" id="res">RESUME <span>→</span></button><button class="btn sec" id="quit">MENU</button></div>`;
    $('res').onclick = togglePause; $('quit').onclick = () => { resetWorld(4242); showTitle(); }; }
  else if (G.mode === 'pause') { SCR.innerHTML = ''; G.mode = 'play'; }
}
function gameOver() {
  G.mode = 'over'; SFX.over(); const sc = Math.floor(P.score), rec = sc > BEST; if (rec) { BEST = sc; store('best', BEST); }
  setTimeout(() => { if (G.mode !== 'over') return; $('touch').classList.add('hidden'); $('hud').classList.add('hidden');
    SCR.innerHTML = `<div class="panel"><div class="eyebrow">OUT OF ENERGY</div><h2>What a ride!</h2>${rec ? '<div class="rec">NEW RECORD!</div>' : ''}
    <div class="stats"><div><small>SCORE</small><b>${sc.toLocaleString('en-US')}</b></div><div><small>DISTANCE</small><b>${(P.s / 1000).toFixed(2)} km</b></div><div><small>LEVEL</small><b>${P.level + 1}</b></div></div>
    <p class="lead">${P.gems} gems · ${P.tricks} tricks · best ${Math.floor(BEST).toLocaleString('en-US')}</p>
    <button class="btn" id="again">DRIVE AGAIN <span>→</span></button><button class="btn sec" id="menu">MENU</button></div>`;
    $('again').onclick = startGame; $('menu').onclick = () => { resetWorld(4242); showTitle(); }; }, 1100);
}
function toggleSound() { SET.sound = !SET.sound; store('settings', SET); audio(); if (MASTER) MASTER.gain.setTargetAtTime(SET.sound ? .5 : 0, AC.currentTime, .05); $('bSound').textContent = SET.sound ? '♪' : '×'; }
$('bSound').onclick = toggleSound; $('bPause').onclick = togglePause; $('bSound').textContent = SET.sound ? '♪' : '×';

// ---------- loop ----------
const STEP = 1 / 120; let acc = 0, last = performance.now();
function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.mode !== 'pause') { G.time += dt; U.time.value = G.time; acc += dt; let n = 0; while (acc >= STEP && n < 10) { acc -= STEP; tick(STEP); n++; } if (n >= 10) acc = 0;
    updateChunks(P.s, false); updateVisuals(dt); updateCam(dt); applyEnv(dt); }
  if (AC && ENGINE) ENGINE.set(clamp(P.v / 60, 0, 1.4) + (P.air ? .25 : 0), G.mode === 'play'); music();
  if (POST) POST.render(); else { renderer.setRenderTarget(null); renderer.render(scene, cam); }
  drawFx(dt); updateHud(dt);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); if (POST) POST.resize(); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; }
addEventListener('resize', resize);
buildCar(SET.car); resetWorld(4242); resize(); showTitle();
window.__rollway = { G, P, TR: () => TR, warp(s) { P.s = s; P.itemIdx = 0; updateChunks(P.s, true); }, step(n) { for (let i = 0; i < n; i++) tick(STEP); } };
requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
