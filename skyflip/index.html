<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').style.display = 'flex'; $('err').textContent = 'Unable to load the 3D engine. Check your internet connection and reload the page.'; return; }

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = t => { if (t == null || !isFinite(t)) return '–'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
function store(k, v) { try { localStorage.setItem('skyflip.' + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem('skyflip.' + k)); return v == null ? d : v; } catch (e) { return d; } }
const SET = Object.assign({ comfort: false, bob: true, fov: 82, sens: 1, invert: false, vol: 0.7 }, load('settings', {}));
const BEST = load('best', {});

// ---------- renderer ----------
const canvas = $('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('err').style.display = 'flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(SET.fov, 1, 0.05, 1600);
camera.rotation.order = 'YXZ';
const handScene = new THREE.Scene();
const handCam = new THREE.PerspectiveCamera(62, 1, 0.01, 10);
const fxc = $('fx'), fx = fxc.getContext('2d');
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);

  fxc.width = w; fxc.height = h;
}
window.addEventListener('resize', resize); resize();

// ---------- textures ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const R0 = rng(7);
const lit = [];
const facadeMap = canvasTex(256, 256, (g) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#ececf2'; for (let i = 0; i < 4; i++) g.fillRect(0, i * 64 + 58, 256, 6);
  for (let iy = 0; iy < 4; iy++) for (let ix = 0; ix < 4; ix++) {
    const x = ix * 64 + 13, y = iy * 64 + 10, w = 38, h = 42;
    g.fillStyle = '#c9ced8'; g.fillRect(x - 3, y - 3, w + 6, h + 6);
    const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, '#9fb6d3'); gr.addColorStop(.5, '#5f7696'); gr.addColorStop(1, '#475c7a');
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    g.fillStyle = '#ffffff40'; g.beginPath(); g.moveTo(x, y + h * .7); g.lineTo(x + w * .5, y); g.lineTo(x + w * .75, y); g.lineTo(x, y + h); g.fill();
    g.fillStyle = '#c9ced8'; g.fillRect(x + w / 2 - 1, y, 2, h);
    if (R0() < 0.38) lit.push([x, y, w, h]);
  }
});
const facadeLit = canvasTex(256, 256, (g) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  const cols = ['#ffcf7a', '#ffe7b0', '#ffb067', '#bfe6ff'];
  lit.forEach(([x, y, w, h], i) => { g.fillStyle = cols[i % 4]; g.fillRect(x, y, w, h); });
});
const roofTex = canvasTex(128, 128, (g) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3); }
  g.fillStyle = '#00000018'; g.fillRect(0, 0, 128, 3); g.fillRect(0, 0, 3, 128);
});
const runTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 14); g.fillRect(0, 242, 256, 14);
  g.lineWidth = 22; g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < 2; i++) { const x = 40 + i * 128; g.beginPath(); g.moveTo(x, 70); g.lineTo(x + 50, 128); g.lineTo(x, 186); g.stroke(); }
}, false);
const hazardTex = canvasTex(256, 64, (g) => {
  g.fillStyle = '#1b1b24'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#ffd400'; for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(i * 32, 64); g.lineTo(i * 32 + 16, 64); g.lineTo(i * 32 + 48, 0); g.lineTo(i * 32 + 32, 0); g.fill(); }
});
const glowTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(.35, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const beamTex = canvasTex(16, 256, (g) => {
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.7, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,.9)');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
});
const cloudTex = canvasTex(512, 512, (g) => {
  g.clearRect(0, 0, 512, 512); const r = rng(5);
  for (let i = 0; i < 140; i++) {
    const x = r() * 512, y = r() * 512, s = 20 + r() * 70, a = 0.12 + r() * 0.22;
    for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) {
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, s);
      gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr;
      g.fillRect(x + ox - s, y + oy - s, s * 2, s * 2);
    }
  }
});
const puffTex = canvasTex(256, 256, (g) => {
  const r = rng(9);
  for (let i = 0; i < 26; i++) {
    const a = r() * TAU, d = r() * 70, x = 128 + Math.cos(a) * d, y = 140 + Math.sin(a) * d * 0.5, s = 30 + r() * 40;
    const gr = g.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  }
});
const blobTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(.6, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
function signTex(text, accent = '#ffd84a') {
  return canvasTex(1024, 200, (g) => {
    g.fillStyle = 'rgba(14,16,36,.82)'; rrect(g, 8, 8, 1008, 184, 44); g.fill();
    g.strokeStyle = accent; g.lineWidth = 5; g.stroke();
    const parts = text.split(/(\[[^\]]+\])/).filter(Boolean);
    let fs = 62, total;
    const measure = () => { g.font = `900 ${fs}px "Trebuchet MS", "Segoe UI", sans-serif`; total = 0;
      for (const p of parts) total += p[0] === '[' ? g.measureText(p.slice(1, -1)).width + 44 : g.measureText(p).width; };
    measure(); while (total > 930 && fs > 26) { fs -= 3; measure(); }
    let x = 512 - total / 2; g.textBaseline = 'middle';
    for (const p of parts) {
      if (p[0] === '[') { const t = p.slice(1, -1), w = g.measureText(t).width + 28;
        g.fillStyle = '#7a5a08'; rrect(g, x + 4, 100 - fs * .62 + 6, w, fs * 1.24, 14); g.fill();
        g.fillStyle = accent; rrect(g, x + 4, 100 - fs * .62, w, fs * 1.24, 14); g.fill();
        g.fillStyle = '#1d1400'; g.fillText(t, x + 18, 102); x += w + 16; }
      else { g.fillStyle = '#fff'; g.fillText(p, x, 102); x += g.measureText(p).width; }
    }
  });
}

// ---------- palettes ----------
const PAL = {
  sunrise: { top: '#3f86e0', hor: '#ffd0b0', bot: '#fbe8dc', sun: '#fff0c8', sunEl: 13, sunAz: 200, stars: 0,
    walls: ['#f4d9c6', '#eac4b5', '#dcc0d6', '#f7e6c9', '#cfe0ef'], roof: '#f6eee6', trim: '#ff8c6b', lit: 0.0,
    hemiS: '#cfe2ff', hemiG: '#ffcfb5', hemi: 1.9, sunC: '#ffe6c8', sunI: 2.6, cloud: '#fff4ef', cloudBase: '#f3d8cf', far: '#d7b4c0', neon: '#38e1ff', fogN: 70, fogF: 430 },
