<script>
(() => {

const fmt = t => { if (t == null || !isFinite(t)) return '–'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
function store(k, v) { try { localStorage.setItem('trickline.' + k, JSON.stringify(v)); } catch (e) {} }

const SET = Object.assign({ vol: 0.7, calm: false }, load('settings', {}));
const BEST = load('best', {});
const TOUCHDEV = matchMedia('(pointer:coarse)').matches;
const C = h => new THREE.Color(h);

// ---------- renderer ----------
const canvas = $('gl');

catch (e) { $('err').style.display = 'flex'; return; }
const DPR = Math.min(devicePixelRatio || 1, TOUCHDEV ? 1.5 : 2);

const scene = new THREE.Scene();

// Post: HDR scene (MSAA) -> bright pass -> 4-level blur (real bloom) -> grade. Same pipeline as Iron Line (see game-visuals skill).

const POST = (() => {
  const low = /fx=low/.test(location.search) || (TOUCHDEV && Math.min(innerWidth, innerHeight) < 560);
  if (low || !renderer.capabilities.isWebGL2) return null;
  const rt = ms => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: !!ms, samples: ms ? 4 : 0 });

  const qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';

  const bright = SM({ t: { value: null }, th: { value: 1.1 }, knee: { value: .3 } }, `uniform sampler2D t;uniform float th,knee;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));float s=clamp(l-th+knee,0.,2.*knee);s=s*s/(4.*knee+1e-4);gl_FragColor=vec4(c*max(s,l-th)/max(l,1e-4),1.);}`);

void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.385).rgb+texture2D(t,vUv-dir*1.385).rgb)*.316;c+=(texture2D(t,vUv+dir*3.231).rgb+texture2D(t,vUv-dir*3.231).rgb)*.070;gl_FragColor=vec4(c,1.);}`);
  const comp = SM({ t: { value: main.texture }, b0: { value: bA[0].texture }, b1: { value: bA[1].texture }, b2: { value: bA[2].texture }, b3: { value: bA[3].texture }, px: { value: new THREE.Vector2() },
    bloom: { value: .55 }, expo: { value: 1.0 }, sat: { value: 1.1 }, vig: { value: .3 }, warm: { value: new THREE.Vector3(1.02, 1, .97) }, sharp: { value: .2 } },
  `uniform sampler2D t,b0,b1,b2,b3;uniform vec2 px;uniform float bloom,expo,sat,vig,sharp;uniform vec3 warm;varying vec2 vUv;
vec3 shoulder(vec3 c){vec3 x=max(c-.78,0.);return min(c,.78)+.22*(1.-exp(-x/.22));}
void main(){vec3 c=texture2D(t,vUv).rgb;
 vec3 nb=(texture2D(t,vUv+vec2(px.x,0.)).rgb+texture2D(t,vUv-vec2(px.x,0.)).rgb+texture2D(t,vUv+vec2(0.,px.y)).rgb+texture2D(t,vUv-vec2(0.,px.y)).rgb)*.25;
 c=max(c+(c-nb)*sharp,0.);
 vec3 b=texture2D(b0,vUv).rgb*.9+texture2D(b1,vUv).rgb*.75+texture2D(b2,vUv).rgb*.6+texture2D(b3,vUv).rgb*.5;

#include <colorspace_fragment>
}`);
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(qs, qc); };
  const size = new THREE.Vector2();
  function resize() { renderer.getDrawingBufferSize(size); main.setSize(size.x, size.y); let w = size.x >> 1, h = size.y >> 1;
    for (let i = 0; i < LV; i++) { bA[i].setSize(Math.max(1, w), Math.max(1, h)); bB[i].setSize(Math.max(1, w), Math.max(1, h)); w >>= 1; h >>= 1; } comp.uniforms.px.value.set(1 / size.x, 1 / size.y); }
  resize();
  function render(draw) {
    draw(main);
    bright.uniforms.t.value = main.texture; pass(bright, bA[0]);
    for (let i = 0; i < LV; i++) { if (i > 0) { blur.uniforms.t.value = bA[i - 1].texture; blur.uniforms.dir.value.set(0, 0); pass(blur, bA[i]); }
      const w = bA[i].width, h = bA[i].height; blur.uniforms.t.value = bA[i].texture; blur.uniforms.dir.value.set(1 / w, 0); pass(blur, bB[i]);
      blur.uniforms.t.value = bB[i].texture; blur.uniforms.dir.value.set(0, 1 / h); pass(blur, bA[i]); }
    pass(comp, null);
  }
  return { render, resize, comp, bright, size };
})();

// "Toy studio" environment: sky/floor gradient + soft white lamps, for the glossy toy look of bikes and riders.
const ENV = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#bcd8ff'); g.addColorStop(.47, '#ffffff'); g.addColorStop(.53, '#9a948c'); g.addColorStop(1, '#3d3a38');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256); x.fillStyle = '#fff';
  [[90, 52, 58, 16], [290, 40, 86, 13], [440, 78, 40, 18], [200, 96, 28, 9]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, 0, TAU); x.fill(); });
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer); const r = pm.fromEquirectangular(t).texture; pm.dispose(); t.dispose(); return r;
})();

// ---------- lights & sky ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
{ const s = sun.shadow.camera; s.left = -30; s.right = 30; s.top = 30; s.bottom = -30; s.near = 1; s.far = 220; }
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .03; scene.add(sun, sun.target);
const flashL = [new THREE.PointLight(0xffc070, 0, 14, 2), new THREE.PointLight(0xffc070, 0, 14, 2)]; flashL.forEach(l => scene.add(l));
const U = { time: { value: 0 } };
const NOISE = (() => { // tiling value noise for clouds
  const S = 128, R = mulberry(17), g = new Float32Array(32 * 32); for (let i = 0; i < g.length; i++) g[i] = R();

      sky.position.copy(cam.position); renderer.render(scene, cam); });
    if (target) { target.scissorTest = false; target.viewport.set(0, 0, POST.size.x, POST.size.y); target.scissor.copy(target.viewport); }
    else renderer.setScissorTest(false);
  };
  if (POST) POST.render(draw); else draw(null);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!LVL) return;
  if (G.mode !== 'pause') { U.time.value += dt; acc += dt; let k = 0; while (acc >= STEP && k < 8) { acc -= STEP; tick(STEP); k++; } if (k >= 8) acc = 0; }
  const al = clamp(acc / STEP, 0, 1);
  if (G.mode !== 'pause') updateVisuals(dt, al);
  const n = G.players, aspect = innerWidth / (innerHeight / n);
  if (!window.__trickline || !window.__trickline.hold) G.P.forEach((b, i) => updateCam(b, cams[i], G.mode === 'pause' ? 0 : dt, aspect));
  render(); drawFx(dt); if (G.mode !== 'menu') updateHud();
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); if (POST) POST.resize(); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; }
addEventListener('resize', resize);

// ---------- screens ----------
const SCR = $('screen');
function starsHtml(s, cls = '') { return `<span class="stars ${cls}">` + [0, 1, 2].map(i => `<span class="${s && s[i] ? 'on' : 'off'}">★</span>`).join('') + '</span>'; }
function show(html) { SCR.innerHTML = html; SCR.classList.remove('hidden'); const f = SCR.querySelector('button'); if (f && !TOUCHDEV) f.focus({ preventScroll: true }); }
function on(id, fn) { const e = $(id); if (e) e.onclick = () => { audio(); fn(); }; }
function showTitle() {
  if (G.mode !== 'menu') startDemo();
  show(`<a class="back" href="../index.html">← All games</a><div class="panel"><h1 class="title">TRICKLINE</h1><div class="sub">Ramps, trampolines, wall rides and rooftop gaps: one straight line, endless tricks!</div>
    <div class="btns"><button class="btn" id="b1">1 PLAYER</button>${TOUCHDEV ? '' : '<button class="btn" id="b2">2 PLAYERS</button>'}<div class="row"><button class="btn alt small" id="bh">HOW TO PLAY</button><button class="btn alt small" id="bs">SETTINGS</button></div></div></div>`);
  on('b1', () => showLevels(1)); on('b2', () => showLevels(2)); on('bh', showHow); on('bs', showSettings);
}
function showLevels(players) {
  show(`<div class="panel box"><h2 class="h">${players === 2 ? '2 PLAYERS · ' : ''}CHOOSE A RUN</h2><div class="levels">` + LEVELS.map((l, i) => { const b = BEST[l.id] || {};
    return `<button class="lv" data-i="${i}"><div class="sky" style="background:${WORLDS[l.world].card}"><b>${WORLDS[l.world].label}</b></div><div class="in"><h3>${l.name}</h3><p>${l.desc}</p>
      <div class="best">${starsHtml(b.stars)}<span>${b.time ? '⏱ ' + fmt(b.time) : 'Par ' + fmt(l.par)}</span></div></div></button>`; }).join('') +
    `</div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);
  SCR.querySelectorAll('.lv').forEach(e => e.onclick = () => { audio(); startLevel(+e.dataset.i, players); });
  on('bb', showTitle);
}
function showHow() {
  show(`<div class="panel box"><h2 class="h">HOW TO PLAY</h2><div class="cols">
    <div class="controls"><b style="grid-column:1/3;text-align:left">1 player · the bike rides by itself</b>
      <span><span class="k">A</span><span class="k">D</span></span><span>Steer · spin in the air</span>
      <span><span class="k">S</span></span><span>Brake · backflip in the air</span><span><span class="k">W</span></span><span>Frontflip in the air</span>
      <span><span class="k">SPACE</span></span><span>Jump (also off walls and rails) · hold in the air for a grab trick</span>
      <span><span class="k">E</span></span><span>Freerun flip: the rider leaps off and flips over the bike</span><span><span class="k">R</span></span><span>Back to checkpoint</span></div>
    <div class="controls"><b style="grid-column:1/3;text-align:left">2 players (split screen)</b>
      <span><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span></span><span>Player 1 · jump <span class="k">SPACE</span> · freerun <span class="k">E</span></span>
      <span><span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span></span><span>Player 2 · jump <span class="k">ENTER</span> · freerun <span class="k">R-SHIFT</span></span>
      <b style="grid-column:1/3;text-align:left;margin-top:8px">Tips</b><span style="grid-column:1/3;color:var(--mute);font-size:14px;line-height:1.5">Steer into a wall to ride along it, land on a rail from above to grind it.
      Land straight, with the wheels on the ground, and let go of grabs and freerun flips in time. Tricks in a row build a combo multiplier. Each run has 3 stars: beat the par time, reach the score goal, finish without crashing.</span></div>
    </div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);
  on('bb', showTitle);
}
function showSettings() {
  show(`<div class="panel box" style="max-width:520px"><h2 class="h">SETTINGS</h2><div class="set">
    <span>Volume</span><input type="range" id="sv" min="0" max="1" step=".05" value="${SET.vol}">
    <span>Calm mode<small>No screen shake or speed lines</small></span><button class="tog ${SET.calm ? 'on' : ''}" id="sc" aria-label="Calm mode"></button>
    </div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);
  $('sv').oninput = e => { SET.vol = +e.target.value; if (MASTER) MASTER.gain.value = SET.vol * .55; store('settings', SET); };
  on('sc', () => { SET.calm = !SET.calm; $('sc').classList.toggle('on', SET.calm); store('settings', SET); });
  on('bb', showTitle);
}
function showPause() {
  show(`<div class="panel box" style="max-width:420px"><h2 class="h">PAUSED</h2><div class="btns"><button class="btn" id="br">RESUME</button><button class="btn alt" id="bre">RESTART</button><button class="btn alt" id="bl">RUNS</button></div></div>`);
  on('br', resume); on('bre', () => startLevel(G.lvl, G.players)); on('bl', () => { clearEngines(); startDemo(); showLevels(G.players); });
}
function clearEngines() { for (const b of G.P) if (b.eng) { b.eng.stop(); b.eng = null; } }
function showResults() {
  if (G.mode === 'results') return;
  G.mode = 'results'; clearEngines(); const def = LEVELS[G.lvl];
  for (const b of G.P) bankChain(b);
  if (G.players === 1) {
    const b = G.P[0], st = [b.time != null && b.time <= def.par, b.score >= def.goal, b.crashes === 0], prev = BEST[def.id] || {};
    const recT = b.time != null && (!prev.time || b.time < prev.time), recS = !prev.score || b.score > prev.score;
    BEST[def.id] = { time: recT ? b.time : prev.time, score: Math.max(b.score, prev.score || 0), stars: [0, 1, 2].map(i => !!(st[i] || (prev.stars && prev.stars[i]))) }; store('best', BEST);
    const n = st.filter(Boolean).length;
    show(`<div class="panel box res" style="max-width:560px"><h2 class="h">${n === 3 ? 'AMAZING!' : n === 2 ? 'GREAT RUN!' : 'FINISHED!'}</h2>
      <div class="starsBig">${st.map((s, i) => `<span style="animation-delay:${.15 + i * .2}s;color:${s ? '#ffd23a' : '#ffffff30'};text-shadow:${s ? '0 0 16px #ffb300' : 'none'}">★</span>`).join('')}</div>
      <div class="why"><span class="${st[0] ? 'ok' : ''}">⏱ ${fmt(b.time)} / par ${fmt(def.par)}</span><span class="${st[1] ? 'ok' : ''}">★ ${b.score} / ${def.goal}</span><span class="${st[2] ? 'ok' : ''}">${b.crashes === 0 ? 'No crashes' : b.crashes + ' crash' + (b.crashes > 1 ? 'es' : '')}</span></div>
      ${recT && prev.time ? '<div class="rec">NEW BEST TIME</div> ' : ''}${recS && prev.score ? '<div class="rec">NEW HIGH SCORE</div>' : ''}
      <div class="row"><button class="btn small" id="bn">${G.lvl < LEVELS.length - 1 ? 'NEXT RUN →' : 'RUNS'}</button><button class="btn alt small" id="br">RETRY</button><button class="btn alt small" id="bl">RUNS</button></div></div>`);
  } else {
    const [a, c] = G.P;
    const win = a.done && c.done ? (Math.abs(a.time - c.time) < .05 ? -1 : a.time < c.time ? 0 : 1) : a.done ? 0 : c.done ? 1 : (a.score >= c.score ? 0 : 1);
    const card = p => `<div class="box" style="background:#ffffff12;box-shadow:inset 0 0 0 3px ${win === p.i ? '#ffd23a' : '#fff2'}"><div class="who" style="font-weight:900;letter-spacing:2px;color:#${C(PCOL[p.i].acc).getHexString()}">PLAYER ${p.i + 1}${win === p.i ? ' 🏆' : ''}</div>
      <div class="big2">${p.done ? fmt(p.time) : 'DNF'}</div><div>★ ${p.score} · ${p.crashes} crash${p.crashes === 1 ? '' : 'es'}</div></div>`;
    show(`<div class="panel box res" style="max-width:620px"><h2 class="h">${win < 0 ? 'A PERFECT TIE!' : 'PLAYER ' + (win + 1) + ' WINS!'}</h2><div class="duo">${card(a)}${card(c)}</div>
      <div class="note">The fastest rider wins. Score breaks the tie if nobody finishes.</div>
      <div class="row"><button class="btn small" id="br">REMATCH</button><button class="btn alt small" id="bn">${G.lvl < LEVELS.length - 1 ? 'NEXT RUN →' : 'RUNS'}</button><button class="btn alt small" id="bl">RUNS</button></div></div>`);
  }
  $('hud').classList.add('hidden'); $('touch').classList.add('hidden');
  on('br', () => startLevel(G.lvl, G.players)); on('bl', () => { startDemo(); showLevels(G.players); });
  on('bn', () => { if (G.lvl < LEVELS.length - 1) startLevel(G.lvl + 1, G.players); else { startDemo(); showLevels(G.players); } });
}

// ---------- boot ----------
if (TOUCHDEV) { buildTouch(); document.body.classList.add('touch'); }
resize(); startDemo(); showTitle();
requestAnimationFrame(t => { last = t; frame(t); });
// test hook (used by automated checks)
window.__trickline = { G, LEVELS, cams, hold: false, start: startLevel, bot(on = true) { G.P.forEach(b => b.bot = on); }, get LVL() { return LVL; }, top, setT(v) { U.time.value = v; },
  sim(sec) { for (let i = 0; i < sec * 120; i++) tick(STEP); updateVisuals(1 / 60, 1); if (!this.hold) G.P.forEach((b, i) => { for (let k = 0; k < 5; k++) updateCam(b, cams[i], 2, innerWidth / (innerHeight / G.players)); }); },
  info() { return G.P.map(b => ({ lc: b.lastCrash, x: +b.x.toFixed(1), y: +b.y.toFixed(1), s: +b.s.toFixed(1), state: b.state, crashes: b.crashes, cp: b.cp, score: b.score, time: b.time, mode: G.mode, t: +G.t.toFixed(1) })); } };
})();
</script>
