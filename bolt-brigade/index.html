const $=id=>document.getElementById(id);
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

function hash(n){n|=0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return (n>>>0)/4294967296;}

const fbm=(x,y)=>vnoise(x,y)*.5+vnoise(x*2.03+5.1,y*2.03)*.25+vnoise(x*4.1,y*4.1+3.3)*.125+vnoise(x*8.3+1.7,y*8.3)*.0625;

const R=(...h)=>h.map(hex);

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
// ================= SDF toolkit + pixel painter (from Deep Lens) =================
const len=Math.hypot;
const C=(cx,cy,r)=>(x,y)=>len(x-cx,y-cy)-r;
const E=(cx,cy,rx,ry,a=0)=>{const c=Math.cos(a),s=Math.sin(a),m=Math.min(rx,ry);return(x,y)=>{const dx=x-cx,dy=y-cy,u=dx*c+dy*s,v=-dx*s+dy*c;return(len(u/rx,v/ry)-1)*m;};};
const S=(ax,ay,bx,by,ra,rb=ra)=>{const vx=bx-ax,vy=by-ay,vv=vx*vx+vy*vy||1;return(x,y)=>{const px=x-ax,py=y-ay,h=clamp((px*vx+py*vy)/vv,0,1);return len(px-vx*h,py-vy*h)-(ra+(rb-ra)*h);};};
function polySDF(v,x,y){let d=Infinity,s=1;const n=v.length>>1;for(let i=0,j=n-1;i<n;j=i,i++){const vix=v[2*i],viy=v[2*i+1],ex=v[2*j]-vix,ey=v[2*j+1]-viy,wx=x-vix,wy=y-viy,h=clamp((wx*ex+wy*ey)/(ex*ex+ey*ey),0,1),bx=wx-ex*h,by=wy-ey*h;d=Math.min(d,bx*bx+by*by);const c1=y>=viy,c2=y<v[2*j+1],c3=ex*wy>ey*wx;if((c1&&c2&&c3)||(!c1&&!c2&&!c3))s=-s;}return s*Math.sqrt(d);}

const U=(...f)=>(x,y)=>{let d=Infinity;for(let i=0;i<f.length;i++){const v=f[i](x,y);if(v<d)d=v;}return d;};

   continue;}
  let best=-1,ba=0;
  for(const[dx,dy]of NB){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const j=yy*w+xx;if(src[j*4+3]>ba&&own[j]>=0){ba=src[j*4+3];best=own[j];}}
  if(best>=0){const p=parts[best],ol=p.ol??1;if(ol>0){const c=p.c[0];A[i*4]=c[0]*.5;A[i*4+1]=c[1]*.5;A[i*4+2]=c[2]*.5;A[i*4+3]=Math.min(255,ba*1.2)*ol;}}
 }

}

const mf=n=>440*Math.pow(2,(n-69)/12);
function seqTick(){if(!SEQ||!AC)return;const s=SEQ.s,dt=60/s.bpm/4;while(SEQ.next<AC.currentTime+.12){const st=SEQ.step,bar=Math.floor(st/16)%s.prog.length,b=st%16,r=s.root+s.prog[bar],t=SEQ.next-AC.currentTime,o={delay:Math.max(0,t),out:musG};
  if(b%2===0||b===7||b===15)tone(mf(r+(b%8===6?12:0)),dt*1.6,.16,{...o,type:'triangle'});
  if(b%4===0)tone(150,.12,.5,{...o,type:'sine',slide:.3});
  if(b===4||b===12)nz(.12,.18,{...o,type:'highpass',f:1500});
  if(b%2===1)nz(.03,.05,{...o,type:'highpass',f:7000});
  if(b%2===0){const li=(bar%2?8:0)+b/2,n=s.q[s.lead[li]%s.q.length];if(!(bar%4===3&&b>10))tone(mf(r+24+n),dt*1.8,.045,{...o,type:'square'});}
  SEQ.next+=dt;SEQ.step++;}}
