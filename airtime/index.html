    for (let i = 0; i < LV; i++) { bA[i].setSize(Math.max(1, w), Math.max(1, h)); bB[i].setSize(Math.max(1, w), Math.max(1, h)); w >>= 1; h >>= 1; } comp.uniforms.px.value.set(1 / size.x, 1 / size.y); }
  resize();

// "Toy studio" environment: sky/floor gradient + soft white lamps, for the glossy toy look of bikes and riders.

})();

// ---------- lights & sky ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1); scene.add(hemi);

{ const s = sun.shadow.camera; s.left = -26; s.right = 26; s.top = 20; s.bottom = -20; s.near = 1; s.far = 160; }

// speed lines + boost streaks on the 2D overlay
const fx = $('fx'), fxc = fx.getContext('2d');

  const W = fx.width, H = fx.height;
  G.P.forEach((b, i) => { b.streak = damp(b.streak || 0, b.boost > 0 && b.state === 'ride' ? 1 : 0, b.boost > 0 ? 8 : 2.5, dt); if (b.streak < .02) return;
    const y0 = G.players === 2 ? (i === 0 ? 0 : H / 2) : 0, hh = G.players === 2 ? H / 2 : H;
    fxc.save(); fxc.beginPath(); fxc.rect(0, y0, W, hh); fxc.clip(); fxc.globalCompositeOperation = 'lighter'; fxc.lineCap = 'round';
    for (const s of STREAKS) { s.x -= s.v * dt * (i === 0 ? 1 : 1.03); if (s.x < -s.l) { s.x = 1 + Math.random() * .2; s.y = Math.random(); }

}

function render() {
  const n = G.players, cw = innerWidth, chh = innerHeight;
  const views = n === 2 ? [{ y: .5, h: .5 }, { y: 0, h: .5 }] : [{ y: 0, h: 1 }];
  // shadow camera follows the action
  let sx = 0, sy = 0; for (const b of G.P) { sx += b.cam.x; sy += b.cam.y; } sx /= G.P.length || 1; sy /= G.P.length || 1;
  let spread = 0; if (n === 2) spread = Math.abs(G.P[0].cam.x - G.P[1].cam.x);
  const sc = sun.shadow.camera, half = clamp(24 + spread * .55, 24, 60); if (Math.abs(sc.right - half) > 1) { sc.left = -half; sc.right = half; sc.updateProjectionMatrix(); }

  { const tex = 2 * half / sun.shadow.mapSize.x; _d.copy(LVL.lightOff).normalize(); _a.set(0, 1, 0).cross(_d).normalize(); _b.copy(_d).cross(_a).normalize();
    const u = sx * _a.x + sy * _a.y, v = sx * _b.x + sy * _b.y, du = Math.round(u / tex) * tex - u, dv = Math.round(v / tex) * tex - v;
    sx += _a.x * du + _b.x * dv; sy += _a.y * du + _b.y * dv; const sz = _a.z * du + _b.z * dv;
    sun.target.position.set(sx, sy, sz); sun.position.set(sx, sy, sz).add(LVL.lightOff); }
  const draw = target => {
    views.forEach((v, i) => { const b = G.P[i], cam = cams[i];
      if (target) { const W = POST.size.x, H = POST.size.y; target.viewport.set(0, Math.round(v.y * H), W, Math.round(v.h * H)); target.scissor.copy(target.viewport); target.scissorTest = n === 2; renderer.setRenderTarget(target);
        FXA.mat.uniforms.scale.value = FXN.mat.uniforms.scale.value = v.h * H / (2 * Math.tan(cam.fov * PI / 360)); }
      else { renderer.setRenderTarget(null); renderer.setViewport(0, v.y * chh, cw, v.h * chh); renderer.setScissor(0, v.y * chh, cw, v.h * chh); renderer.setScissorTest(n === 2);
        FXA.mat.uniforms.scale.value = FXN.mat.uniforms.scale.value = v.h * chh * DPR / (2 * Math.tan(cam.fov * PI / 360)); }

    if (target) { target.scissorTest = false; target.viewport.set(0, 0, POST.size.x, POST.size.y); target.scissor.copy(target.viewport); }
    else renderer.setScissorTest(false);

}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!LVL) return;
  if (G.mode !== 'pause') { U.time.value += dt; acc += dt; let n = 0; while (acc >= STEP && n < 8) { acc -= STEP; tick(STEP); n++; } if (n >= 8) acc = 0; }
  // draw the bikes between the last two physics steps (physics runs at 120 Hz, the screen at any rate): no stutter
  const al = clamp(acc / STEP, 0, 1), saved = [];

    for (let k = 0; k < 4; k++) { const p = P[k], ox = s[k * 2], oy = s[k * 2 + 1]; cur.push(p.x, p.y, p.px, p.py);

    saved.push([P, cur]); }

  for (const [P, c] of saved) P.forEach((p, k) => { p.x = c[k * 4]; p.y = c[k * 4 + 1]; p.px = c[k * 4 + 2]; p.py = c[k * 4 + 3]; });

}
function resize() { renderer.setSize(innerWidth, innerHeight, false); if (POST) POST.resize(); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; }
addEventListener('resize', resize);

// ---------- screens ----------
const SCR = $('screen');
function starsHtml(s, cls = '') { return `<span class="stars ${cls}">` + [0, 1, 2].map(i => `<span class="${s && s[i] ? 'on' : 'off'}">★</span>`).join('') + '</span>'; }
function show(html) { SCR.innerHTML = html; SCR.classList.remove('hidden'); const f = SCR.querySelector('button'); if (f && !TOUCHDEV) f.focus({ preventScroll: true }); }
function on(id, fn) { const e = $(id); if (e) e.onclick = () => { audio(); fn(); }; }
function showTitle() {
  if (G.mode !== 'menu') startDemo();
  show(`<a class="back" href="../index.html">← All games</a><div class="panel"><h1 class="title">AIRTIME</h1><div class="sub">Jump, flip and land it on your toy dirt bike!</div>
    <div class="btns"><button class="btn" id="b1">1 PLAYER</button>${TOUCHDEV ? '' : '<button class="btn" id="b2">2 PLAYERS</button>'}<div class="row"><button class="btn alt small" id="bh">HOW TO PLAY</button><button class="btn alt small" id="bs">SETTINGS</button></div></div></div>`);
  on('b1', () => showLevels(1)); on('b2', () => showLevels(2)); on('bh', showHow); on('bs', showSettings);
}
function showLevels(players) {
  G.pickPlayers = players;
  show(`<div class="panel box"><h2 class="h">${players === 2 ? '2 PLAYERS · ' : ''}CHOOSE A TRACK</h2><div class="levels">` + LEVELS.map((l, i) => { const b = BEST[l.id] || {};
    return `<button class="lv" data-i="${i}"><div class="sky" style="background:${WORLDS[l.world].card}"><b>${WORLDS[l.world].label}</b></div><div class="in"><h3>${l.name}</h3><p>${l.desc}</p>
      <div class="best">${starsHtml(b.stars)}<span>${b.time ? '⏱ ' + fmt(b.time) : 'Par ' + fmt(l.par)}</span></div></div></button>`; }).join('') +
    `</div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);
  SCR.querySelectorAll('.lv').forEach(e => e.onclick = () => { audio(); startLevel(+e.dataset.i, players); });
  on('bb', showTitle);
}
function showHow() {
  show(`<div class="panel box"><h2 class="h">HOW TO PLAY</h2><div class="cols">
    <div class="controls"><b style="grid-column:1/3;text-align:left">1 player</b>
      <span><span class="k">W</span><span class="k">↑</span></span><span>Gas</span><span><span class="k">S</span><span class="k">↓</span></span><span>Brake / reverse</span>
      <span><span class="k">A</span><span class="k">←</span></span><span>Lean back · backflip in the air</span><span><span class="k">D</span><span class="k">→</span></span><span>Lean forward · frontflip</span>
      <span><span class="k">SPACE</span></span><span>Hold for a trick (press again for another)</span><span><span class="k">R</span></span><span>Back to checkpoint</span></div>
    <div class="controls"><b style="grid-column:1/3;text-align:left">2 players (split screen)</b>
      <span><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span></span><span>Player 1 · trick <span class="k">SPACE</span></span>
      <span><span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span></span><span>Player 2 · trick <span class="k">ENTER</span></span>
      <b style="grid-column:1/3;text-align:left;margin-top:8px">Tips</b><span style="grid-column:1/3;color:var(--mute);font-size:14px;line-height:1.5">Land with both wheels parallel to the ground to keep your combo and get a speed boost.
      Let go of the trick before landing! Chain tricks quickly to raise the multiplier. Each track has 3 stars: beat the par time, reach the score goal, finish without crashing.</span></div>
    </div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);
  on('bb', showTitle);
}
function showSettings() {
  show(`<div class="panel box" style="max-width:520px"><h2 class="h">SETTINGS</h2><div class="set">
    <span>Volume</span><input type="range" id="sv" min="0" max="1" step=".05" value="${SET.vol}">
    <span>Calm mode<small>No screen shake or speed lines</small></span><button class="tog ${SET.calm ? 'on' : ''}" id="sc" aria-label="Calm mode"></button>
    <span>Ghost<small>Race against your best run</small></span><button class="tog ${SET.ghost ? 'on' : ''}" id="sg" aria-label="Ghost"></button>
    </div><div class="row"><button class="btn alt small" id="bb">← BACK</button></div></div>`);

function showPause() {
  show(`<div class="panel box" style="max-width:420px"><h2 class="h">PAUSED</h2><div class="btns"><button class="btn" id="br">RESUME</button><button class="btn alt" id="bre">RESTART</button><button class="btn alt" id="bl">TRACKS</button></div></div>`);
  on('br', resume); on('bre', () => startLevel(G.lvl, G.players)); on('bl', () => { clearEngines(); showLevels(G.players); });
}
function clearEngines() { for (const b of G.P) if (b.eng) { b.eng.stop(); b.eng = null; } }
function showResults() {
  G.mode = 'results'; clearEngines(); const def = LEVELS[G.lvl];
  for (const b of G.P) if (!b.done) { bankChain(b); }
  if (G.players === 1) {
    const b = G.P[0], st = [b.time != null && b.time <= def.par, b.score >= def.goal, b.crashes === 0], prev = BEST[def.id] || {};

      <div class="why"><span class="${st[0] ? 'ok' : ''}">⏱ ${fmt(b.time)} / par ${fmt(def.par)}</span><span class="${st[1] ? 'ok' : ''}">★ ${b.score} / ${def.goal}</span><span class="${st[2] ? 'ok' : ''}">${b.crashes === 0 ? 'No crashes' : b.crashes + ' crash' + (b.crashes > 1 ? 'es' : '')}</span></div>
      ${recT && prev.time ? '<div class="rec">NEW BEST TIME</div> ' : ''}${recS && prev.score ? '<div class="rec">NEW HIGH SCORE</div>' : ''}

      ${recT ? '<div class="note">Your ghost is saved: race against it next time!</div>' : ''}</div>`);

    show(`<div class="panel box res" style="max-width:620px"><h2 class="h">${win < 0 ? 'A PERFECT TIE!' : 'PLAYER ' + (win + 1) + ' WINS!'}</h2><div class="duo">${card(a)}${card(c)}</div>
      <div class="row"><button class="btn small" id="br">REMATCH</button><button class="btn alt small" id="bn">${G.lvl < LEVELS.length - 1 ? 'NEXT TRACK →' : 'TRACKS'}</button><button class="btn alt small" id="bl">TRACKS</button></div></div>`);
    void sc;

  $('hud').classList.add('hidden'); $('touch').classList.add('hidden');
  on('br', () => startLevel(G.lvl, G.players)); on('bl', () => { startDemo(); showLevels(G.players); });
