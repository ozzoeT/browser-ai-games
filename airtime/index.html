    for (let i = 0; i < LV; i++) { bA[i].setSize(Math.max(1, w), Math.max(1, h)); bB[i].setSize(Math.max(1, w), Math.max(1, h)); w >>= 1; h >>= 1; } comp.uniforms.px.value.set(1 / size.x, 1 / size.y); }
  resize();

    draw(main);

// "Toy studio" environment: sky/floor gradient + soft white lamps, for the glossy toy look of bikes and riders.

})();

// ---------- lights & sky ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
{ const s = sun.shadow.camera; s.left = -26; s.right = 26; s.top = 20; s.bottom = -20; s.near = 1; s.far = 160; }
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .03; scene.add(sun, sun.target);

const U = { time: { value: 0 } };
const NOISE = (() => { // tiling value noise for clouds

  on('br', resume); on('bre', () => startLevel(G.lvl, G.players)); on('bl', () => { clearEngines(); showLevels(G.players); });
}
function clearEngines() { for (const b of G.P) if (b.eng) { b.eng.stop(); b.eng = null; } }
function showResults() {
  G.mode = 'results'; clearEngines(); const def = LEVELS[G.lvl];
  for (const b of G.P) if (!b.done) { bankChain(b); }
  if (G.players === 1) {
    const b = G.P[0], st = [b.time != null && b.time <= def.par, b.score >= def.goal, b.crashes <= CRASH_OK], prev = BEST[def.id] || {};
    const recT = b.time != null && (!prev.time || b.time < prev.time), recS = !prev.score || b.score > prev.score;
    BEST[def.id] = { time: recT ? b.time : prev.time, score: Math.max(b.score, prev.score || 0), stars: [0, 1, 2].map(i => !!(st[i] || (prev.stars && prev.stars[i]))) }; store('best', BEST);
    if (recT && b.rec.length > 20) store('ghost.' + def.id, { t: b.time, d: b.rec });
    const n = st.filter(Boolean).length;
    show(`<div class="panel box res" style="max-width:560px"><h2 class="h">${n === 3 ? 'AMAZING!' : n === 2 ? 'GREAT RIDE!' : 'FINISHED!'}</h2>
      <div class="starsBig">${st.map((s, i) => `<span style="animation-delay:${.15 + i * .2}s;color:${s ? '#ffd23a' : '#ffffff30'};text-shadow:${s ? '0 0 16px #ffb300' : 'none'}">★</span>`).join('')}</div>
      <div class="why"><span class="${st[0] ? 'ok' : ''}">⏱ ${fmt(b.time)} / par ${fmt(def.par)}</span><span class="${st[1] ? 'ok' : ''}">★ ${b.score} / ${def.goal}</span><span class="${st[2] ? 'ok' : ''}">${b.crashes === 0 ? 'No crashes' : b.crashes + ' crash' + (b.crashes > 1 ? 'es' : '')} / max ${CRASH_OK}</span></div>
      ${recT && prev.time ? '<div class="rec">NEW BEST TIME</div> ' : ''}${recS && prev.score ? '<div class="rec">NEW HIGH SCORE</div>' : ''}
      <div class="row"><button class="btn small" id="bn">${G.lvl < LEVELS.length - 1 ? 'NEXT TRACK →' : 'TRACKS'}</button><button class="btn alt small" id="br">RETRY</button><button class="btn alt small" id="bl">TRACKS</button></div>
      ${recT ? '<div class="note">Your ghost is saved: race against it next time!</div>' : ''}</div>`);
  } else {
    const [a, c] = G.P; const sc = p => (p.done ? 1e6 - p.time * 100 : 0) + p.score * .01;
    const win = a.done && c.done ? (Math.abs(a.time - c.time) < .05 ? -1 : a.time < c.time ? 0 : 1) : a.done ? 0 : c.done ? 1 : (a.score >= c.score ? 0 : 1);
    const card = p => `<div class="box" style="background:#ffffff12;box-shadow:inset 0 0 0 3px ${win === p.i ? '#ffd23a' : '#fff2'}"><div class="who" style="font-weight:900;letter-spacing:2px;color:#${C(PCOL[p.i].acc).getHexString()}">PLAYER ${p.i + 1}${win === p.i ? ' 🏆' : ''}</div>
      <div class="big2">${p.done ? fmt(p.time) : 'DNF'}</div><div>★ ${p.score} · ${p.crashes} crash${p.crashes === 1 ? '' : 'es'}</div></div>`;
    show(`<div class="panel box res" style="max-width:620px"><h2 class="h">${win < 0 ? 'A PERFECT TIE!' : 'PLAYER ' + (win + 1) + ' WINS!'}</h2><div class="duo">${card(a)}${card(c)}</div>
      <div class="row"><button class="btn small" id="br">REMATCH</button><button class="btn alt small" id="bn">${G.lvl < LEVELS.length - 1 ? 'NEXT TRACK →' : 'TRACKS'}</button><button class="btn alt small" id="bl">TRACKS</button></div></div>`);
    void sc;
  }
  $('hud').classList.add('hidden'); $('touch').classList.add('hidden');
  on('br', () => startLevel(G.lvl, G.players)); on('bl', () => { startDemo(); showLevels(G.players); });
  on('bn', () => { if (G.lvl < LEVELS.length - 1) startLevel(G.lvl + 1, G.players); else { startDemo(); showLevels(G.players); } });
}

// ---------- boot ----------
if (TOUCHDEV) { buildTouch(); document.body.classList.add('touch'); }
resize(); startDemo(); showTitle();
requestAnimationFrame(t => { last = t; frame(t); });
// test hook (used by automated checks)
window.__airtime = { G, LEVELS, start: startLevel, bot(on = true) { G.P.forEach(b => b.bot = on); }, get LVL() { return LVL; }, groundAt, setT(v) { U.time.value = v; },
  pose(name, k) { poseRig(G.P[0].rig, 'ride', name, k, 0); },
  sim(sec) { for (let i = 0; i < sec * 120; i++) tick(STEP); G.P.forEach((b, i) => { for (let k = 0; k < 5; k++) updateCam(b, cams[i], 2, innerWidth / (innerHeight / G.players)); }); },
  info() { return G.P.map(b => ({ x: +((b.R.x + b.F.x) / 2).toFixed(1), y: +((b.R.y + b.F.y) / 2).toFixed(1), state: b.state, crashes: b.crashes, cp: b.cp, score: b.score, time: b.time, mode: G.mode, t: +G.t.toFixed(1) })); } };
})();
</script>
</body>
