function polySDF(v,x,y){let d=Infinity,s=1;const n=v.length>>1;for(let i=0,j=n-1;i<n;j=i,i++){const vix=v[2*i],viy=v[2*i+1],ex=v[2*j]-vix,ey=v[2*j+1]-viy,wx=x-vix,wy=y-viy,h=clamp((wx*ex+wy*ey)/(ex*ex+ey*ey),0,1),bx=wx-ex*h,by=wy-ey*h;d=Math.min(d,bx*bx+by*by);const c1=y>=viy,c2=y<v[2*j+1],c3=ex*wy>ey*wx;if((c1&&c2&&c3)||(!c1&&!c2&&!c3))s=-s;}return s*Math.sqrt(d);}

// The pixel painter: rasterises shaded SDF parts into a small sprite with dithering,
// translucency, auto outline and inner contour lines. Emissive parts go to a second canvas.
const LV=(()=>{const v=[-.42,-.72,.55],l=Math.hypot(...v);return v.map(a=>a/l);})();
function raster(w,h,ox,oy,parts){
 const A=new Uint8ClampedArray(w*h*4), own=new Int16Array(w*h).fill(-1), n=parts.length;
 let Ed=null;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const X=x+.5-ox,Y=y+.5-oy,i=y*w+x;let r=0,g=0,b=0,al=0,er=0,eg=0,eb=0;
  for(let k=n-1;k>=0;k--){
   const p=parts[k],d=p.d(X,Y);if(!(d<0))continue;
   const gx=p.d(X+.5,Y)-p.d(X-.5,Y),gy=p.d(X,Y+.5)-p.d(X,Y-.5),gl=Math.hypot(gx,gy)||1;
   const q=clamp(-d/(p.t||3),0,1),sq=1-q,nx=gx/gl*sq,ny=gy/gl*sq,nz=q+.15,nl=Math.hypot(nx,ny,nz);
   let s=.15+.85*clamp((nx*LV[0]+ny*LV[1]+nz*LV[2])/nl,0,1);
   if(p.f)s=p.f(X,Y,s,d);if(s<0)continue;
   const rp=p.c,nc=rp.length;let idx=Math.floor(clamp(s,0,.999)*nc+(bay(x,y)-.5)*.85);idx=idx<0?0:idx>=nc?nc-1:idx;
   const c=rp[idx],pa=p.a??1,a=pa*(1-al);
   if(p.e){const e=typeof p.e==='function'?p.e(X,Y):p.e;if(e>0){const ec=typeof p.ec==='function'?p.ec(X,Y):(p.ec||c),v=e*(1-al);er+=ec[0]*v;eg+=ec[1]*v;eb+=ec[2]*v;}}
   r+=c[0]*a;g+=c[1]*a;b+=c[2]*a;al+=a;if(own[i]<0)own[i]=k;
   if(al>.985)break;
  }
  if(al>0){A[i*4]=r/al;A[i*4+1]=g/al;A[i*4+2]=b/al;A[i*4+3]=al*255;}
  if(er+eg+eb>0){if(!Ed)Ed=new Uint8ClampedArray(w*h*4);Ed[i*4]=er;Ed[i*4+1]=eg;Ed[i*4+2]=eb;Ed[i*4+3]=255;}
 }

 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const i=y*w+x;
  if(src[i*4+3]>0){const k=own[i],p=parts[k];if(!p||!p.line)continue;
   for(const[dx,dy]of NB){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const j=yy*w+xx,kj=own[j];
    if(src[j*4+3]>0&&kj>=0&&kj<k&&parts[kj].c!==p.c){const c=p.c[0];A[i*4]=c[0]*.85;A[i*4+1]=c[1]*.85;A[i*4+2]=c[2]*.85;break;}}
   continue;}
  let best=-1,ba=0;
  for(const[dx,dy]of NB){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const j=yy*w+xx;if(src[j*4+3]>ba&&own[j]>=0){ba=src[j*4+3];best=own[j];}}
  if(best>=0){const p=parts[best],ol=p.ol??1;if(ol>0){const c=p.c[0];A[i*4]=c[0]*.5;A[i*4+1]=c[1]*.5;A[i*4+2]=c[2]*.5;A[i*4+3]=Math.min(255,ba*1.2)*ol;}}
 }

 let ce=null;if(Ed){ce=mk(w,h);ce.getContext('2d').putImageData(new ImageData(Ed,w,h),0,0);}

function alphaBB(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}return[x0,y0,x1,y1];}
const GC=new Map();
function glowSpr(r,c){r=Math.max(2,Math.round(r));const key=r+'|'+c;let s=GC.get(key);if(s)return s;s=mk(2*r+1,2*r+1);const g=s.getContext('2d'),im=g.createImageData(2*r+1,2*r+1),D=im.data;
 for(let y=0;y<=2*r;y++)for(let x=0;x<=2*r;x++){const d=Math.hypot(x-r,y-r)/r;if(d>=1)continue;const v=(1-d)*(1-d),lv=Math.floor(v*5+bay(x,y))/5;if(lv<=0)continue;const i=(y*(2*r+1)+x)*4;D[i]=c[0]*lv;D[i+1]=c[1]*lv;D[i+2]=c[2]*lv;D[i+3]=255;}
 g.putImageData(im,0,0);s.r=r;GC.set(key,s);return s;}

const DK=[[0,150],[1200,1000],[2600,4000],[3600,6000],[4760,11000]];
function depthAt(y){if(y<=0)return Math.max(0,150+y*.7);for(let i=1;i<DK.length;i++)if(y<=DK[i][0]||i===DK.length-1){const a=DK[i-1],b=DK[i];return a[1]+(y-a[0])/(b[0]-a[0])*(b[1]-a[1]);}}
function yOfDepth(d){for(let i=1;i<DK.length;i++)if(d<=DK[i][1]||i===DK.length-1){const a=DK[i-1],b=DK[i];return a[0]+(d-a[1])/(b[1]-a[1])*(b[0]-a[0]);}}

function floorBase(x){let i=1;while(i<FK.length-1&&x>FK[i][0])i++;const a=FK[i-1],b=FK[i],u=clamp((x-a[0])/(b[0]-a[0]),0,1),s=u*u*(3-2*u);return a[1]+(b[1]-a[1])*s;}
const floorY=x=>floorBase(x)+(n1(x/170)-.5)*56+(n1(x/41+9)-.5)*14+(n1(x/9+3)-.5)*3;

// ================= spawning =================
function trySpawn(){const fx=floorY(diver.x),fd=depthAt(fx),nearFloor=fx-diver.y<240,cand=[];let tot=0;
 for(const sp of ALB){let ok;if(sp.layer==='floor'||sp.layer==='bottom')ok=nearFloor&&fd>=sp.dmin&&fd<=sp.dmax;else ok=depth>=sp.dmin&&depth<=sp.dmax;if(!ok)continue;
  const a=save.album[sp.id],w=(sp.rare?.3:1)*(!a?3:a.stars<3?1.5:.6);cand.push([sp,w]);tot+=w;}
 if(!cand.length)return false;let r=Math.random()*tot;for(const[sp,w]of cand){r-=w;if(r<=0){spawn(sp);return true;}}spawn(cand[0][0]);return true;}
function spawn(sp,quiet){buildSpecies(sp);const n=sp.count?ri(sp.count[0],sp.count[1]):1,side=Math.random()<.75?diver.face:-diver.face,list=sp.amb?amb:ents;

  if(sp.layer==='floor'||sp.layer==='bottom'){e.x=diver.x+side*(W*.45+sp.w)+k*rnd(10,26)*side;e.dir=Math.random()<.5?1:-1;e.y=floorY(e.x)-(sp.layer==='bottom'?rnd(18,40):0);}
  else{e.dir=-side;const sx=side>0?W+sp.w*.6+k*rnd(8,18):-sp.w*.6-k*rnd(8,18),fsy=floorY(cam.x+sx-W/2)-cam.y+H/2,top=H*.14,
    sy=clamp(H*rnd(.2,.72)+(k?rnd(-22,22):0),top,Math.max(top,Math.min(H*.75,fsy-sp.h*.55-10)));e.x=cam.x*e.p+sx-W/2;e.y=cam.y*e.p+sy-H/2;}
  list.push(e);}

function updEnts(dt){
 for(const list of[ents,amb])for(let i=list.length-1;i>=0;i--){const e=list[i],sp=e.sp;e.age+=dt;e.x+=e.dir*sp.speed*dt;
  if(sp.layer==='floor')e.y=floorY(e.x);else if(sp.layer==='bottom')e.y=lerp(e.y,floorY(e.x)-26,dt*.5);
  else{const sx=e.x-cam.x*e.p+W/2,sy=e.y-cam.y*e.p+H/2,fsy=floorY(cam.x+sx-W/2)-cam.y+H/2;if(sy+sp.h*.45>fsy-6)e.y-=14*dt;}
  e.m=sp.dur>0&&((e.age+e.ph)%sp.per)>sp.per-sp.dur;
  if(sp.layer==='floor'&&sp.id==='seapig'&&e.m&&Math.random()<dt*3)puffs.push({x:e.x+rnd(-8,8),y:e.y-1,vx:rnd(-4,4),vy:rnd(-5,-1),l:1.4,c:'#8a8a7c'});
  const sx=e.x-cam.x*e.p+W/2,off=Math.abs(sx-W/2)>W*1.6+sp.w||Math.abs(e.y-cam.y*e.p)>H*2.5;
  if(off||e.age>160)list.splice(i,1);}}

// ================= update =================
const MAXV=58;let lastHud='';
function update(dt){time+=dt;const now=performance.now();
 let ix=0,iy=0;
 if(state==='dive'){ix=(K.right?1:0)-(K.left?1:0);iy=(K.down?1:0)-(K.up?1:0);if(joy.on){ix+=joy.x;iy+=joy.y;}}
 const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}
 diver.vx+=(ix*MAXV-diver.vx)*Math.min(1,dt*1.5);diver.vy+=(iy*MAXV-diver.vy)*Math.min(1,dt*1.5);
 diver.x+=diver.vx*dt;diver.y+=diver.vy*dt;
 diver.x=clamp(diver.x,40,29600);if(diver.y<-30){diver.y=-30;diver.vy=Math.max(0,diver.vy);}
 const fy=floorY(diver.x);if(diver.y>fy-10){diver.y=fy-10;if(diver.vy>20)for(let k=0;k<5;k++)puffs.push({x:diver.x+rnd(-10,10),y:fy-1,vx:rnd(-8,8),vy:rnd(-7,-2),l:1.6,c:'#9a9a8a'});diver.vy=Math.min(diver.vy,0);}
 const spd=Math.hypot(diver.vx,diver.vy);
 diver.tilt=lerp(diver.tilt,spd>10?clamp(diver.vy/MAXV,-1,1)*.5:0,Math.min(1,dt*3));
 diver.kick+=dt*(1.6+spd*.09);
 const aimLive=taim.on||now-taim.t<2500||now-mouse.t<6000;
 if(!aimLive&&Math.abs(diver.vx)>4)diver.face=Math.sign(diver.vx);
 depth=depthAt(diver.y);
 // camera
 const pcx=cam.x,pcy=cam.y;
 cam.x+=(diver.x+diver.face*W*.1-cam.x)*Math.min(1,dt*1.8);cam.y+=(diver.y-cam.y)*Math.min(1,dt*1.8);
 const dcx=cam.x-pcx,dcy=cam.y-pcy;
 // zones
 if(state==='dive'){const z=zoneOf(depth);if(!diveZones.has(z)){diveZones.add(z);banner(ZONES[z].name,ZONES[z].sub);}
  if(z>save.reached){save.reached=z;persist();}if(depth>save.maxDepth+5){save.maxDepth=Math.round(depth);}}
 // spawns
 if(state!=='pause'){nextSpawn-=dt;if(nextSpawn<=0){if(!ents.length){trySpawn();nextSpawn=rnd(15,25);}else nextSpawn=3;}
  nextAmb-=dt;if(nextAmb<=0){nextAmb=rnd(14,26);const lan=amb.filter(e=>e.sp.id==='lantern').length;if(depth>200&&depth<2400&&!lan&&Math.random()<.7)for(let k=0;k<ri(6,10);k++)spawn(SPECIES.find(s=>s.id==='lantern'),1);
   else if(depth>400&&amb.length<3)spawn(SPECIES.find(s=>s.id==='tjelly'),1);}}
 updEnts(dt);
 // breathing bubbles
 diver.breath-=dt;if(diver.breath<=0){diver.breath=rnd(3.2,4.6);const hx=diver.x+diver.face*12;for(let k=0;k<ri(4,7);k++)bubbles.push({x:hx+rnd(-1,1),y:diver.y-2-k*2,vy:-rnd(14,22),w:rnd(0,6),l:rnd(2.2,3.5)});if(state==='dive')sndBubble();}
 for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.l-=dt;b.y+=b.vy*dt;b.x+=Math.sin(time*5+b.w)*6*dt;if(b.l<=0)bubbles.splice(i,1);}
 // glowing plankton trail in the dark
 if(depth>650&&spd>22&&Math.random()<dt*(spd/3))sparks.push({x:diver.x-diver.face*rnd(18,30),y:diver.y+rnd(-5,5),l:1,m:rnd(.6,1.2)});
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l-=dt/s.m;if(s.l<=0)sparks.splice(i,1);}
 for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=.98;if(p.l<=0)puffs.splice(i,1);}
 for(const f of snow){f.x-=dcx*f.p-Math.sin(time*.3+f.s)*2.2*dt*f.p;f.y-=dcy*f.p-3.2*dt*f.p;f.x=((f.x%W)+W)%W;f.y=((f.y%H)+H)%H;}
 flash=Math.max(0,flash-dt*3.2);shotCD-=dt;
 updAim(dt,now);
 // hud
 if(state==='dive'){const t=Math.round(depth).toLocaleString('en-US')+' m|'+ZONES[zoneOf(depth)].name+'|'+(2+13*Math.exp(-(depth-150)/450)).toFixed(0)+' °C';
  if(t!==lastHud){lastHud=t;const[a,b,c]=t.split('|');$('dm').textContent=a;$('zn').textContent=b;$('tp').textContent=c;}}
 audioDepth();}

function updAim(dt,now){const dsx=Math.round(diver.x)-Math.round(cam.x)+(W>>1),dsy=Math.round(diver.y)-Math.round(cam.y)+(H>>1);
 let tx,ty,auto=false;
 if(taim.on||now-taim.t<2500){tx=taim.x;ty=taim.y;}else if(now-mouse.t<6000){tx=mouse.x;ty=mouse.y;}
 else{auto=true;tx=dsx+diver.face*M*.45;ty=dsy+diver.vy*.5;}
 if(!auto&&Math.abs(tx-dsx)>8)diver.face=tx>dsx?1:-1;
 let best=null,bd=M*(auto?.42:.2);
 for(const e of ents)if(e.on&&e.fx!==undefined){const d=Math.hypot(e.fx-tx,e.fy-ty);if(d<bd){bd=d;best=e;}}
 if(best){const k=auto?.85:.35;tx=lerp(tx,best.fx,k);ty=lerp(ty,best.fy,k);}

 if(!fc.x){fc.x=tx;fc.y=ty;}fc.x+=(tx-fc.x)*Math.min(1,dt*9);fc.y+=(ty-fc.y)*Math.min(1,dt*9);}

 const bob=Math.sin(e.age*.7+e.bph)*(sp.bob||0),sx=Math.round(e.x-cam.x*e.p)+(W>>1),sy=Math.round(e.y+bob-cam.y*e.p)+(H>>1);
 const flip=e.dir<0&&!sp.sym,bb=sp.bb;
 e.sb=flip?[sx+sp.ox-bb[2]-1,sy-sp.oy+bb[1],sx+sp.ox-bb[0]-1,sy-sp.oy+bb[3]]:[sx-sp.ox+bb[0],sy-sp.oy+bb[1],sx-sp.ox+bb[2],sy-sp.oy+bb[3]];
 if(sp.focus){e.fx=sx+(flip?-sp.focus[0]:sp.focus[0]);e.fy=sy+sp.focus[1];}else{e.fx=(e.sb[0]+e.sb[2])/2;e.fy=(e.sb[1]+e.sb[3])/2;}
 e.on=e.sb[2]>=0&&e.sb[0]<W&&e.sb[3]>=0&&e.sb[1]<H;if(!e.on)return;

function drawRidges(){for(const[p,off,k]of[[.2,560,.28],[.4,300,.5]]){
 const c=WATER.map((v,i)=>Math.round(lerp(v,[12,20,32][i],k))),rim=c.map(v=>Math.round(v*1.25));
 const cs=`rgb(${c})`,rs=`rgb(${rim})`;let prev=null;
 for(let x=0;x<W;x++){const fx=cam.x+(x-W/2)/p,Fy=floorBase(fx)-off+(n1(fx/260+p*50)-.5)*260+(n1(fx/60+p*20)-.5)*30,sy=Math.round(H/2+p*(Fy-cam.y));
  if(sy>=H)continue;bx.fillStyle=cs;bx.fillRect(x,Math.max(0,sy),1,H-Math.max(0,sy));if(sy>=0){bx.fillStyle=rs;bx.fillRect(x,sy,1,1);}}}}
function drawTerrain(cx0,cy0){const wx0=cx0-(W>>1),wy0=cy0-(H>>1),tx0=Math.floor(wx0/TS),tx1=Math.floor((wx0+W)/TS),ty0=Math.floor(wy0/TS),ty1=Math.floor((wy0+H)/TS);let gen=0;

  if(t===undefined){if(gen++>5)continue;t=genTile(tx,ty);tiles.set(key,t);if(tiles.size>400)tiles.delete(tiles.keys().next().value);}
  if(t)bx.drawImage(t,tx*TS-wx0,ty*TS-wy0);}}

 for(let i=Math.floor(wx0/DC)-2;i<=Math.floor(wx1/DC)+2;i++){const d=decorCell(i);if(!d)continue;const sy=Math.round(d.y)-cy0+(H>>1);if(sy<-10||sy>H+50)continue;
  const s=decorSpr(d.type,d.vi,d.anim?Math.floor(time*1.1+d.ph)%4:0),sx=Math.round(d.x)-cx0+(W>>1);if(sx+s.w<0||sx-s.w>W)continue;

  if(d.type==='vent'&&state!=='pause'&&Math.random()<.5)puffs.push({x:d.x+rnd(-1,1),y:d.y-36,vx:rnd(-3,3),vy:-rnd(10,16),l:rnd(2.5,4),c:'#151413',s:2});}}

 const[tox,toy]=torchOrigin();let ta=Math.atan2(fc.y-toy,fc.x-tox);

const QL=6,LK=1.25/255;

 for(let y=0;y<H;y++){const ar=ambR[y],ag=ambG[y],ab=ambB[y],row=(y&3)<<2;
  for(let x=0;x<W;x++,i+=4){const lr=ar+L[i]*LK,lg=ag+L[i+1]*LK,lb=ab+L[i+2]*LK,k=lr>lg?(lr>lb?lr:lb):(lg>lb?lg:lb);
   let f=0;if(k>0)f=Math.floor(k*QL+B4[row|(x&3)])/QL/k;
   O[i]=A[i]*lr*f+Em[i];O[i+1]=A[i+1]*lg*f+Em[i+1];O[i+2]=A[i+2]*lb*f+Em[i+2];}}
 oc.putImageData(outImg,0,0);}
function drawUI(){if(state!=='dive')return;
 const x0=Math.round(fc.x-fw/2),y0=Math.round(fc.y-fh/2),x1=x0+fw-1,y1=y0+fh-1,L=Math.max(4,Math.round(M*.045));
 hot=false;for(const e of ents)if(e.on&&e.sb){const b=e.sb,iw=Math.min(x1,b[2])-Math.max(x0,b[0]),ih=Math.min(y1,b[3])-Math.max(y0,b[1]);if(iw>0&&ih>0&&iw*ih>.4*Math.min((b[2]-b[0])*(b[3]-b[1]),fw*fh)){hot=true;break;}}
 oc.fillStyle=shotCD>.55?'#ffffff':hot?'#ffd36a':'rgba(210,235,255,.55)';
 for(const[x,y,sx,sy]of[[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]){oc.fillRect(sx>0?x:x-L+1,y,L,1);oc.fillRect(x,sy>0?y:y-L+1,1,L);}
 const cx=Math.round(fc.x),cy=Math.round(fc.y);oc.fillRect(cx-2,cy,5,1);oc.fillRect(cx,cy-2,1,5);
 // edge marker for an animal that is off screen
 for(const e of ents){if(e.on||e.sb===undefined||e.age>40)continue;const dx=e.fx-W/2,dy=e.fy-H/2,k=Math.min((W/2-8)/Math.abs(dx||1),(H/2-8)/Math.abs(dy||1));if(k>=1)continue;
  const px=Math.round(W/2+dx*k),py=Math.round(H/2+dy*k);oc.fillStyle=`rgba(140,220,255,${.35+.3*Math.sin(time*3)})`;oc.fillRect(px-1,py-2,3,5);oc.fillRect(px-2,py-1,5,3);break;}}

// ================= photos =================
function shoot(){if(state!=='dive'||shotCD>0)return;shotCD=.75;flash=1;sndShutter();
 const res=score();pending={x:Math.round(fc.x-fw/2),y:Math.round(fc.y-fh/2),res};}
function score(){const x0=fc.x-fw/2,y0=fc.y-fh/2,x1=x0+fw,y1=y0+fh,fa=fw*fh;let best=null;
 for(const e of ents){if(!e.on||!e.sb)continue;if(e.p<1&&cam.y+e.fy-H/2>floorY(cam.x+e.fx-W/2))continue;const b=e.sb,ba=(b[2]-b[0]+1)*(b[3]-b[1]+1),iw=Math.max(0,Math.min(x1,b[2]+1)-Math.max(x0,b[0])),ih=Math.max(0,Math.min(y1,b[3]+1)-Math.max(y0,b[1])),ia=iw*ih;if(ia<=0)continue;
  const big=ba>fa*.7,ov=big?ia/fa:ia/ba,inF=e.fx>=x0&&e.fx<=x1&&e.fy>=y0&&e.fy<=y1,full=big?inF&&ia/fa>.55:ia/ba>.96,cen=Math.hypot(e.fx-fc.x,e.fy-fc.y)<fh*.26;
  const stars=ov>=.45?1+(full&&cen?1:0)+(e.m?1:0):0,sc=stars*10+ov;
  if(!best||sc>best.sc)best={sp:e.sp,stars,full,cen,m:e.m,sc};}
 return best;}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
let cardT=0;
function handleShot(res,url){
 if(!res||!res.stars){hint(res?'Almost! Get more of it inside the frame.':'Just water and marine snow…',2600);return;}
 const sp=res.sp,old=save.album[sp.id],isNew=!old,better=!old||res.stars>old.stars;
 if(better){save.album[sp.id]={stars:res.stars,img:url,depth:Math.round(depth)};persist();updCount();}
 const tips=[];if(!res.full)tips.push('Fit the whole animal inside the frame.');else if(!res.cen)tips.push('Put it in the middle of the frame.');
 if(!res.m)tips.push(`For the third star, wait for its special moment: <em>${sp.moment}</em>.`);
 $('cImg').src=url;$('cName').textContent=sp.name;$('cSt').textContent=starStr(res.stars);$('cSci').textContent=sp.sci+' · '+sp.range;$('cNew').classList.toggle('hidden',!isNew);
 $('cTxt').innerHTML=isNew?sp.fact+(tips.length?'<br><br>'+tips.join(' '):''):(res.stars===3?'Perfect shot!':((better?'New best! ':'Best so far: '+starStr(old.stars)+'. ')+tips.join(' ')));
 const c=$('card');c.classList.remove('off');clearTimeout(cardT);cardT=setTimeout(()=>c.classList.add('off'),isNew?13000:6500);
 if(isNew)sndFound();else sndStars(res.stars);
 if(isNew&&ALB.every(s=>save.album[s.id]))setTimeout(()=>banner('Album complete!','You found all 16 animals. You are a real deep-sea explorer!'),2500);}
function updCount(){const n=ALB.filter(s=>save.album[s.id]).length;$('cnt').textContent=n+'/'+ALB.length;$('cnt2').textContent='('+n+'/'+ALB.length+')';}

// ================= UI =================
let banT=0,hintT=0;
function banner(h,p){$('bH').textContent=h;$('bP').textContent=p;const b=$('banner');b.classList.add('on');clearTimeout(banT);banT=setTimeout(()=>b.classList.remove('on'),4800);}
function hint(t,ms){const h=$('hint');h.textContent=t;h.classList.add('on');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.remove('on'),ms||3000);}
const touchDev=matchMedia('(pointer:coarse)').matches;
function buildMenu(){const z=$('zones');z.innerHTML='';ZONES.forEach((Z,i)=>{const b=document.createElement('button');b.className='btn zb'+(i?' alt':'');const lock=i>save.reached;b.disabled=lock;
  b.innerHTML=`<span>${lock?'🔒 ':''}${Z.name}</span><small>${i?Z.d0.toLocaleString('en-US')+' m':'200 m'}</small>`;b.onclick=()=>startDive(i);z.appendChild(b);});
 $('bResume').classList.toggle('hidden',state!=='pause');
 $('help').innerHTML=touchDev?'Left thumb: swim · right side: aim the camera and torch · tap or 📷: take a photo.<br>Reach a new zone to start your next dive from there.':'Swim: WASD or arrows · aim the camera and torch: mouse · photo: click or Space · menu: Esc.<br>Reach a new zone to start your next dive from there.';
 updCount();}
function silhouette(sp,w,h){const F=frame0(sp),c=mk(w,h),g=c.getContext('2d');const bb=alphaBB(F.a),bw=bb[2]-bb[0]+1,bh=bb[3]-bb[1]+1,k=Math.min((w-8)/bw,(h-8)/bh);
 g.imageSmoothingEnabled=false;g.drawImage(F.a,bb[0],bb[1],bw,bh,Math.round((w-bw*k)/2),Math.round((h-bh*k)/2),Math.round(bw*k),Math.round(bh*k));g.globalCompositeOperation='source-in';g.fillStyle='#183656';g.fillRect(0,0,w,h);return c;}
function openAlbum(){const g=$('grid');g.innerHTML='';const n=ALB.filter(s=>save.album[s.id]).length,st=ALB.reduce((a,s)=>a+(save.album[s.id]?.stars||0),0);
 $('aSum').textContent=`${n} of ${ALB.length} animals · ${st} of ${ALB.length*3} stars`;
 for(const sp of ALB){const a=save.album[sp.id],d=document.createElement('button');d.className='sp'+(a?'':' unk');
  if(a){const im=new Image();im.src=a.img;d.appendChild(im);}else d.appendChild(silhouette(sp,150,100));
  const t=document.createElement('div');t.innerHTML=a?`<b>${sp.name}</b><br><span class="st">${starStr(a.stars)}</span>`:`<b>???</b><br><span class="zl">${ZONES[sp.zone].name}</span>`;d.appendChild(t);
  d.onclick=()=>openDetail(sp);g.appendChild(d);}
 $('album').classList.remove('hidden');}
function openDetail(sp){const a=save.album[sp.id],b=$('dBody');b.innerHTML='';
 const h=document.createElement('h2');h.textContent=a?sp.name:'Not found yet';b.appendChild(h);
 if(a){const m=document.createElement('div');m.className='sci';m.textContent=sp.sci;b.appendChild(m);const im=new Image();im.src=a.img;b.appendChild(im);}else b.appendChild(silhouette(sp,300,200));
 const t=document.createElement('div');t.className='ctxt';
 t.innerHTML=a?`<span class="st">${starStr(a.stars)}</span><div class="meta">Lives at ${sp.range} · ${ZONES[sp.zone].name} · photographed at ${a.depth.toLocaleString('en-US')} m</div><p>${sp.fact}</p><p class="meta">Special moment: <em>${sp.moment}</em>.</p>`
  :`<p>Look for it in the <b>${ZONES[sp.zone].name}</b> (${sp.range}).${sp.layer==='floor'||sp.layer==='bottom'?' It lives near the sea floor.':''}${sp.rare?' It is rare: keep exploring!':''}</p>`;
 b.appendChild(t);$('det').classList.remove('hidden');}

// ================= input =================
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(KM[k]){K[KM[k]]=1;e.preventDefault();}
 if((k===' '||k==='enter')&&state==='dive'){shoot();e.preventDefault();}
 if(k==='escape'){if(!$('det').classList.contains('hidden'))$('det').classList.add('hidden');else if(!$('album').classList.contains('hidden'))$('album').classList.add('hidden');else if(state==='dive')openMenu();else if(state==='pause')resume();}
 audioInit();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])K[KM[k]]=0;});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});
const toLow=(cx,cy)=>[cx*DPR/SC,cy*DPR/SC];
cv.addEventListener('pointerdown',e=>{audioInit();if(state!=='dive')return;
 if(e.pointerType==='mouse'){[mouse.x,mouse.y]=toLow(e.clientX,e.clientY);mouse.t=performance.now();if(e.button===0)shoot();return;}
 if(e.clientX<innerWidth*.45&&!joy.on){Object.assign(joy,{on:true,id:e.pointerId,ox:e.clientX,oy:e.clientY,x:0,y:0});const j=$('joy');j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.classList.remove('hidden');$('knob').style.transform='';}
 else{[taim.x,taim.y]=toLow(e.clientX,e.clientY);Object.assign(taim,{on:true,id:e.pointerId,t0:performance.now(),sx:e.clientX,sy:e.clientY,mv:0});}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){[mouse.x,mouse.y]=toLow(e.clientX,e.clientY);mouse.t=performance.now();return;}
 if(joy.on&&e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),mx=46;if(l>mx){dx*=mx/l;dy*=mx/l;}joy.x=dx/mx;joy.y=dy/mx;$('knob').style.transform=`translate(${dx}px,${dy}px)`;}
 else if(taim.on&&e.pointerId===taim.id){[taim.x,taim.y]=toLow(e.clientX,e.clientY);taim.mv=Math.max(taim.mv,Math.hypot(e.clientX-taim.sx,e.clientY-taim.sy));}});
function pEnd(e){if(joy.on&&e.pointerId===joy.id){joy.on=false;joy.x=joy.y=0;$('joy').classList.add('hidden');}
 if(taim.on&&e.pointerId===taim.id){taim.on=false;taim.t=performance.now();if(taim.mv<14&&performance.now()-taim.t0<350){fc.x=clamp(taim.x,fw/2+3,W-fw/2-3);fc.y=clamp(taim.y,fh/2+3,H-fh/2-3);shoot();}}}
cv.addEventListener('pointerup',pEnd);cv.addEventListener('pointercancel',pEnd);
$('shut').addEventListener('pointerdown',e=>{e.stopPropagation();audioInit();shoot();});
$('bResume').onclick=resume;$('bMenu').onclick=openMenu;
$('bAlb').onclick=()=>{openAlbum();};$('bAlb2').onclick=openAlbum;
$('aX').onclick=()=>$('album').classList.add('hidden');$('dX').onclick=()=>$('det').classList.add('hidden');
$('cX').onclick=()=>$('card').classList.add('off');
$('bMute').onclick=()=>{save.muted=!save.muted;persist();$('bMute').textContent=save.muted?'🔇':'🔊';if(master)master.gain.value=save.muted?0:.9;audioInit();};
$('bMute').textContent=save.muted?'🔇':'🔊';
addEventListener('resize',resize);

// ================= sound =================
let AC=null,master=null,wetIn=null,ambF=null,nextChime=4;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=save.muted?0:.9;master.connect(AC.destination);
 const d=AC.createDelay(2),fb=AC.createGain(),lp=AC.createBiquadFilter(),wg=AC.createGain();d.delayTime.value=.55;fb.gain.value=.5;lp.type='lowpass';lp.frequency.value=1400;wg.gain.value=.55;
 d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wg);wg.connect(master);wetIn=d;
 const n=AC.sampleRate*4,nb=AC.createBuffer(1,n,AC.sampleRate),ch=nb.getChannelData(0);let last=0;for(let i=0;i<n;i++){last=(last+.02*(Math.random()*2-1))/1.02;ch[i]=last*3.5;}
 const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;ambF=AC.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=420;const ag=AC.createGain();ag.gain.value=.32;ns.connect(ambF);ambF.connect(ag);ag.connect(master);ns.start();
 for(const[f,v]of[[55,.045],[82.4,.03],[110.3,.015]]){const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.frequency.value=f;g.gain.value=v;l.frequency.value=.05+Math.random()*.07;lg.gain.value=v*.7;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();}}
function tone(f,dur,vol,o={}){if(!AC)return;const t=AC.currentTime+(o.delay||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(f*o.slide,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(o.at||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g);g.connect(master);
 const w=o.wet??.5;if(w){const s=AC.createGain();s.gain.value=w;g.connect(s);s.connect(wetIn);}os.start(t);os.stop(t+dur+.05);}
function noise(dur,vol,hp){if(!AC)return;const n=Math.round(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n)**2;
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start();}
const sndPing=()=>{tone(1180,1.6,.045,{wet:.9,at:.02});tone(1770,1.1,.018,{wet:.9,delay:.03});};
const sndShutter=()=>{noise(.07,.22,1800);tone(2400,.03,.05,{type:'square',wet:0});tone(1300,.05,.04,{type:'square',wet:0,delay:.08});};
const sndFound=()=>[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,1.6,.055,{delay:.15+i*.14,wet:.8}));
const sndStars=n=>{for(let i=0;i<n;i++)tone([659.25,783.99,1046.5][i],.9,.05,{delay:.15+i*.16,wet:.7});};
const sndBubble=()=>{for(let i=0;i<3;i++)tone(rnd(260,520),.12,.012,{slide:2.4,wet:.2,delay:i*.09});};
const PENTA=[196,220,261.6,293.7,329.6,392,440,523.3];
function audioDepth(){if(!AC)return;ambF.frequency.value=lerp(420,170,clamp(depth/6000,0,1));
 nextChime-=1/60;if(nextChime<=0&&state!=='pause'){nextChime=rnd(7,13);const oc=depth>3000?.5:1;tone(PENTA[ri(0,7)]*oc,3.2,.022,{wet:.95,at:.4});}}

// ================= main loop =================
let lastT=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt);render();}
resize();buildDiver();buildMenu();
{const p=startPos(0);cam.x=p.x+W*.1;cam.y=p.y;}

(function bq(){const id=BQ.shift();if(!id)return;buildSpecies(SPECIES.find(s=>s.id===id));setTimeout(bq,30);})();
requestAnimationFrame(loop);
window.__deep={diver,cam,get ents(){return ents;},get DIVER(){return DIVER;},buildSpecies,get state(){return state;},save,SPECIES,startDive,shoot,score,spawn:id=>spawn(SPECIES.find(s=>s.id===id)),
 step(n,dt=1/30){for(let i=0;i<n;i++)update(dt);render();},go(x,y){diver.x=x;diver.y=y;cam.x=x;cam.y=y;}};
