<script>
'use strict';
/* ================= Open Throttle — first-person free-roam driving =================
   Sit behind the wheel (or press C for the chase camera), drive anywhere, fly off ramps and hills, find 30 stars per world. */
const PI=Math.PI,TAU=PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem('openthrottle.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('openthrottle.'+k,JSON.stringify(v));}catch(e){}}};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;

/* ---------------- Renderer, scene, camera ---------------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,TOUCH?1.5:2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.04,2200);
scene.fog=new THREE.Fog(0xbfd8f0,160,900);

const hemi=new THREE.HemisphereLight(0xcfe6ff,0x6a7a4a,1.3);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,2.6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:260});
sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;scene.add(sun);scene.add(sun.target);
const SUNDIR=new THREE.Vector3(.5,.7,.3).normalize();

// Sky dome: three-band gradient, sun disc + halo, optional stars (Moon world). Follows the camera.
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},bot:{value:new THREE.Color()},sunDir:{value:SUNDIR},sunCol:{value:new THREE.Color()},stars:{value:0},sunSize:{value:1}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}',
 fragmentShader:`uniform vec3 top,hor,bot,sunCol,sunDir;uniform float stars,sunSize;varying vec3 vD;
float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
void main(){vec3 d=normalize(vD);float y=d.y;
 vec3 c=y>0.?mix(hor,top,pow(smoothstep(0.,.55,y),.7)):mix(hor,bot,smoothstep(0.,-.2,y));
 float s=max(dot(d,sunDir),0.);c+=sunCol*(pow(s,8.)*.25+pow(s,90.)*.6)+sunCol*smoothstep(.9994-.0004*sunSize,.9997-.0002*sunSize,s)*3.;
 if(stars>0.){vec3 q=floor(d*260.);float r=h3(q);c+=vec3(step(.9965,r)*(.6+.8*h3(q+3.)))*stars*smoothstep(-.05,.15,y);}
 gl_FragColor=vec4(c,1.);
#include <colorspace_fragment>
}`}));
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

// Post: HDR scene (MSAA) -> bright pass -> 4-level blur (bloom) -> grade (sharpen, warmth, saturation, soft shoulder, vignette).
// Off on small touch screens, without WebGL2, or with ?fx=low.
const POST=(()=>{
 const low=/fx=low/.test(location.search)||(TOUCH&&Math.min(innerWidth,innerHeight)<560);
 if(low||!renderer.capabilities.isWebGL2)return null;
 const rt=(ms)=>new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,depthBuffer:!!ms,samples:ms?4:0});
 const main=rt(true),LV=4,bA=[],bB=[];for(let i=0;i<LV;i++){bA.push(rt());bB.push(rt());}
 const qs=new THREE.Scene(),qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));quad.frustumCulled=false;qs.add(quad);
 const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
 const SM=(u,fs)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:VS,fragmentShader:fs,depthTest:false,depthWrite:false});
 const bright=SM({t:{value:null},th:{value:1.1},knee:{value:.3}},`uniform sampler2D t;uniform float th,knee;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));float s=clamp(l-th+knee,0.,2.*knee);s=s*s/(4.*knee+1e-4);gl_FragColor=vec4(c*max(s,l-th)/max(l,1e-4),1.);}`);
 const blur=SM({t:{value:null},dir:{value:new THREE.Vector2()}},`uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.385).rgb+texture2D(t,vUv-dir*1.385).rgb)*.316;c+=(texture2D(t,vUv+dir*3.231).rgb+texture2D(t,vUv-dir*3.231).rgb)*.070;gl_FragColor=vec4(c,1.);}`);
 const comp=SM({t:{value:main.texture},b0:{value:bA[0].texture},b1:{value:bA[1].texture},b2:{value:bA[2].texture},b3:{value:bA[3].texture},px:{value:new THREE.Vector2()},
  bloom:{value:.5},expo:{value:1.04},sat:{value:1.1},vig:{value:.3},warm:{value:new THREE.Vector3(1.025,1.,.965)},sharp:{value:.22},speed:{value:0}},
  `uniform sampler2D t,b0,b1,b2,b3;uniform vec2 px;uniform float bloom,expo,sat,vig,sharp,speed;uniform vec3 warm;varying vec2 vUv;
vec3 shoulder(vec3 c){vec3 x=max(c-.78,0.);return min(c,.78)+.22*(1.-exp(-x/.22));}
void main(){vec2 d=vUv-.5;
 vec2 uv=vUv;vec3 c=texture2D(t,uv).rgb;
 if(speed>0.){vec3 a=c;for(int i=1;i<5;i++){a+=texture2D(t,vUv-d*speed*float(i)*.012).rgb;}c=mix(c,a/5.,smoothstep(.12,.5,length(d)));} // radial speed blur at the edges
 vec3 nb=(texture2D(t,uv+vec2(px.x,0.)).rgb+texture2D(t,uv-vec2(px.x,0.)).rgb+texture2D(t,uv+vec2(0.,px.y)).rgb+texture2D(t,uv-vec2(0.,px.y)).rgb)*.25;
 c=max(c+(c-nb)*sharp,0.);
 vec3 b=texture2D(b0,uv).rgb*.9+texture2D(b1,uv).rgb*.75+texture2D(b2,uv).rgb*.6+texture2D(b3,uv).rgb*.5;
 c=(c+b*bloom)*expo*warm;float l=dot(c,vec3(.2126,.7152,.0722));c=max(mix(vec3(l),c,sat),0.);
 c=shoulder(c);c*=1.-dot(d,d)*vig*1.8;
 gl_FragColor=vec4(c,1.);
#include <colorspace_fragment>
}`);
 const pass=(m,target)=>{quad.material=m;renderer.setRenderTarget(target);renderer.render(qs,qc);};
 const size=new THREE.Vector2();
 function resize(){renderer.getDrawingBufferSize(size);main.setSize(size.x,size.y);let w=size.x>>1,h=size.y>>1;
  for(let i=0;i<LV;i++){bA[i].setSize(Math.max(1,w),Math.max(1,h));bB[i].setSize(Math.max(1,w),Math.max(1,h));w>>=1;h>>=1;}comp.uniforms.px.value.set(1/size.x,1/size.y);}
 resize();
 function render(){
  renderer.setRenderTarget(main);renderer.render(scene,camera);
  bright.uniforms.t.value=main.texture;pass(bright,bA[0]);
  for(let i=0;i<LV;i++){if(i>0){blur.uniforms.t.value=bA[i-1].texture;blur.uniforms.dir.value.set(0,0);pass(blur,bA[i]);}
   const w=bA[i].width,h=bA[i].height;blur.uniforms.t.value=bA[i].texture;blur.uniforms.dir.value.set(1/w,0);pass(blur,bB[i]);
   blur.uniforms.t.value=bB[i].texture;blur.uniforms.dir.value.set(0,1/h);pass(blur,bA[i]);}
  pass(comp,null);}
 return{render,resize,comp,bright};})();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(POST)POST.resize();});

/* ---------------- Noise ---------------- */
function hash2(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v);}
function fbm(x,y,s,o=4){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2.03;}return t/n;}

/* ---------------- Worlds ---------------- */
// Each world: palette, lighting, gravity, a height function and its props. Heights in metres, world is a disc of radius ~470 m.
const WORLDS=[
 {id:'valley',name:'GREEN VALLEY',emoji:'🌳',desc:'Rolling hills, lakes and forests',card:'linear-gradient(135deg,#3fae5a,#2a7fc4)',
  sky:[0x3f8fe0,0xcfe6f7,0x9cb38a],sun:0xfff0d0,sunDir:[.45,.62,.35],sunI:2.7,hemi:[0xcfe6ff,0x5c7a3a,1.25],fog:[0xcfe3f2,180,820],
  grav:16,grip:1,water:-5,road:0xa8875a,roadEdge:0xe9e2c8,
  ground:{low:0xd9c88e,mid:0x5fae3c,mid2:0x86c24a,high:0x7f8f56,rock:0x8c8478,peak:0x9aa08a},
  height(x,z){return(fbm(x/190,z/190,11,4)-.47)*58+(fbm(x/42,z/42,5,3)-.5)*5;}},
 {id:'canyon',name:'RED CANYON',emoji:'🌵',desc:'Sunset mesas and sandy dunes',card:'linear-gradient(135deg,#ff8a3a,#b8325a)',
  sky:[0x4a5fb8,0xffb27a,0xd98a5a],sun:0xffb070,sunDir:[-.55,.32,.4],sunI:2.6,hemi:[0xffd0b0,0x8a4a2a,1.15],fog:[0xf0a878,170,820],
  grav:16,grip:.92,water:null,road:0x3d3a3c,roadEdge:0xffd23a,
  ground:{low:0xe8a868,mid:0xd98a52,mid2:0xe6a062,high:0xc0603a,rock:0xa8452e,peak:0xd27a4a},
  height(x,z){const b=(fbm(x/150,z/150,23,3)-.5)*12+(fbm(x/35,z/35,9,2)-.5)*2.2;const m=fbm(x/130+40,z/130,31,3);
   return b+smooth(.55,.6,m)*24+smooth(.64,.66,m)*12;}},
 {id:'snow',name:'SNOW PEAKS',emoji:'🏔️',desc:'Big mountains and slippery ice',card:'linear-gradient(135deg,#9fd8ff,#5a6fd8)',
  sky:[0x4f86d8,0xe6f2ff,0xc8d8ea],sun:0xfff6ea,sunDir:[.3,.5,-.6],sunI:2.4,hemi:[0xdcecff,0x8a9ab8,1.45],fog:[0xe4eef8,140,700],
  grav:16,grip:.85,ice:-4,road:0x8e9cb4,roadEdge:0xff6a4a,
  ground:{low:0xbfe6ff,mid:0xf4f8ff,mid2:0xe8f0fa,high:0xffffff,rock:0x7c8496,peak:0xffffff},
  height(x,z){const r=1-Math.abs(2*fbm(x/230,z/230,41,4)-1);return r*r*62-18+(fbm(x/55,z/55,3,3)-.5)*8;}},
 {id:'moon',name:'MOON BASE',emoji:'🌙',desc:'Low gravity — giant jumps!',card:'linear-gradient(135deg,#3a3f6a,#0d1020)',
  sky:[0x02030a,0x0b1030,0x05060d],sun:0xfff8ee,sunDir:[-.4,.42,-.5],sunI:3.0,hemi:[0x8a9ad8,0x2a2a33,.75],fog:[0x0b1030,260,1100],
  grav:5.2,grip:.8,water:null,road:0x5a5e6e,roadEdge:0x5fffd7,stars:1,
  ground:{low:0x8a8a92,mid:0xa6a6ae,mid2:0x96969e,high:0xbcbcc4,rock:0x6e6e78,peak:0xc8c8d0},
  height(x,z){let h=(fbm(x/200,z/200,51,4)-.5)*18+(fbm(x/30,z/30,8,2)-.5)*1.6;
   for(const c of MOONCR){const dx=x-c[0],dz=z-c[1],d2=(dx*dx+dz*dz)/(c[2]*c[2]);if(d2>2.6)continue;const d=Math.sqrt(d2);

 try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 const master=AC.createGain();master.gain.value=state.sound?.9:0;master.connect(AC.destination);AU.master=master;
 const eg=AC.createGain();eg.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;lp.Q.value=2;
 const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator();o1.type='sawtooth';o2.type='square';o3.type='triangle';
 const g2=AC.createGain();g2.gain.value=.5;const g3=AC.createGain();g3.gain.value=.6;
 o1.connect(lp);o2.connect(g2).connect(lp);o3.connect(g3).connect(lp);lp.connect(eg).connect(master);o1.start();o2.start();o3.start();
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.6;
 const wg=AC.createGain();wg.gain.value=0;ns.connect(bp).connect(wg).connect(master);ns.start();
 Object.assign(AU,{eg,lp,o1,o2,o3,wg,bp,nb});}
function engineSound(rpm,load,speed,active){
 if(!AC)return;const t=AC.currentTime,f=32+rpm*16;
 AU.o1.frequency.setTargetAtTime(f,t,.05);AU.o2.frequency.setTargetAtTime(f*.5,t,.05);AU.o3.frequency.setTargetAtTime(f*1.5,t,.05);
 AU.lp.frequency.setTargetAtTime(220+rpm*170+load*500,t,.06);
 AU.eg.gain.setTargetAtTime(active?.05+load*.05:0,t,.1);
 AU.wg.gain.setTargetAtTime(active?Math.min(.22,speed*speed*.00009):0,t,.15);AU.bp.frequency.setTargetAtTime(400+speed*18,t,.2);}
function tone(f,dur,type='sine',vol=.2,slide=0,delay=0){if(!AC||!state.sound)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AU.master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol=.3,freq=800){if(!AC||!state.sound)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=AU.nb;f.type='lowpass';f.frequency.value=freq;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AU.master);s.start(t,Math.random());s.stop(t+dur+.05);}
const SFX={
 jump(){tone(260,.3,'sine',.18,2.2);noise(.25,.12,2500);},
 land(k){tone(90,.25,'sine',.35*k,.5);noise(.22,.3*k,500);},
 star(){[880,1175,1568].forEach((f,i)=>tone(f,.28,'triangle',.16,1,i*.07));tone(2093,.5,'sine',.08,1,.21);},
 crash(k){noise(.35,.4*k,900);tone(70,.3,'square',.08*k,.6);},
 boost(){noise(.6,.16,3000);tone(180,.6,'sawtooth',.05,3);},
 splash(){noise(.5,.3,1600);},
 all(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.16,1,i*.1));},
};
function toggleSound(){state.sound=!state.sound;LS.set('sound',state.sound);$('bSnd').textContent=state.sound?'🔊':'🔇';if(AU.master)AU.master.gain.value=state.sound?.9:0;}

/* ---------------- Particles (fixed pool) ---------------- */
const PN=320,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pSize=new Float32Array(PN),pAlpha=new Float32Array(PN),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN),pGrow=new Float32Array(PN);
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSize,1));pGeo.setAttribute('alpha',new THREE.BufferAttribute(pAlpha,1));
const pts=new THREE.Points(pGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,
 uniforms:{scale:{value:innerHeight}},
 vertexShader:'attribute float size,alpha;attribute vec3 color;varying vec3 vC;varying float vA;uniform float scale;void main(){vC=color;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*scale/max(.5,-mv.z)*.5;gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying vec3 vC;varying float vA;void main(){vec2 d=gl_PointCoord-.5;float r=dot(d,d);if(r>.25)discard;gl_FragColor=vec4(vC,vA*(1.-r*4.));\n#include <colorspace_fragment>\n}'}));
pts.frustumCulled=false;scene.add(pts);let pNext=0;
function emit(x,y,z,vx,vy,vz,col,size,life,grow=1.5){const i=pNext;pNext=(pNext+1)%PN;pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
 pCol[i*3]=col.r;pCol[i*3+1]=col.g;pCol[i*3+2]=col.b;pSize[i]=size;pLife[i]=pMax[i]=life;pGrow[i]=grow;}
function updateParticles(dt){for(let i=0;i<PN;i++){if(pLife[i]<=0){pAlpha[i]=0;continue;}pLife[i]-=dt;const k=pLife[i]/pMax[i];
 pVel[i*3+1]-=(pGrow[i]<0?9:1.2)*dt;pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;pSize[i]*=1+Math.abs(pGrow[i])*dt;pAlpha[i]=Math.max(0,k)*.75;}
 for(const a of['position','color','size','alpha'])pGeo.attributes[a].needsUpdate=true;}
addEventListener('resize',()=>{pts.material.uniforms.scale.value=innerHeight;});

/* ---------------- Physics (arcade, fixed 120 Hz) ---------------- */
const _n=new THREE.Vector3(),_tf=new THREE.Vector3(),_tr=new THREE.Vector3(),_v=new THREE.Vector3(),_g2={h:0,nx:0,ny:1,nz:0};
const VMAX=46,VBOOST=70;
let IN={steer:0,gas:false,brake:false,jump:false,boost:false},jumpHeld=false;
function physStep(dt){
 const p=state.pos,v=state.vel,G=W.grav,moon=G<8;
 const g=groundAt(p.x,p.z);_n.set(g.nx,g.ny,g.nz);
 const gap=p.y-g.h,contact=gap<.3,trac=smooth(.5,.72,g.ny);
 const fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw);
 state.steer=damp(state.steer,IN.steer,IN.steer===0?8:5,dt);
 // boost meter
 state.boosting=IN.boost&&state.boost>0&&IN.gas!==false&&!IN.brake;
 if(state.boosting)state.boost=Math.max(0,state.boost-dt*.32);else state.boost=Math.min(1,state.boost+dt*.12);
 if(contact){
  _tf.set(fx,0,fz).addScaledVector(_n,-(fx*_n.x+fz*_n.z)).normalize();_tr.crossVectors(_tf,_n).normalize();
  let vf=v.dot(_tf),vr=v.dot(_tr);const vn=v.dot(_n);
  const ice=g.ice,onRoad=!g.ramp&&roadDist(p.x,p.z)<6,grip=W.grip*(ice?.22:1)*(onRoad?1.15:1);
  const vmax=state.boosting?VBOOST:VMAX;
  if(IN.gas){if(vf<-.5)vf+=34*dt*trac;else vf+=(state.boosting?30:16)*Math.max(0,1-vf/vmax)*trac*(ice?.6:1)*(state.inWater?.3:1)*dt;}
  if(IN.brake){if(vf>.5)vf=Math.max(0,vf-34*dt*Math.max(trac,.3));else vf=Math.max(-15,vf-10*dt*trac);}
  if(!IN.gas&&!IN.brake){const d=(1.3+.004*vf*vf)*dt;vf=Math.abs(vf)<d?0:vf-Math.sign(vf)*d;}
  if(vf>vmax)vf-=(vf-vmax)*1.3*dt;
  vr*=Math.exp(-9*grip*trac*dt);
  const sp=Math.abs(vf),turn=state.steer*clamp(sp/5,0,1)*(2.2/(1+sp*.028))*Math.sign(vf||1);
  state.yaw-=turn*dt*(ice?.8:1);
  v.copy(_tf).multiplyScalar(vf).addScaledVector(_tr,vr).addScaledVector(_n,vn);
  if(IN.jump&&!jumpHeld&&state.jumpCd<=0&&gap<.35){v.addScaledVector(_n,moon?6.5:9).y+=moon?1:1.5;state.jumpCd=.4;SFX.jump();state.susp=-.12;}
 }else{
  state.yaw-=state.steer*1.1*dt;
  v.x*=Math.exp(-.02*dt);v.z*=Math.exp(-.02*dt);
 }
 jumpHeld=IN.jump;state.jumpCd-=dt;
 if(state.inWater){v.multiplyScalar(Math.exp(-1.6*dt));}
 v.y-=G*dt;
 const ox=p.x,oz=p.z;
 p.addScaledVector(v,dt);
 // world edge
 const r=Math.hypot(p.x,p.z);if(r>HALF-25){p.x*= (HALF-25)/r;p.z*=(HALF-25)/r;const ux=p.x/r,uz=p.z/r,d=v.x*ux+v.z*uz;if(d>0){v.x-=ux*d*1.5;v.z-=uz*d*1.5;}}
 // obstacles (trees, rocks, domes...) — jumped over when the car is above their top
 const cx=Math.floor(p.x/16),cz=Math.floor(p.z/16);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const L=COLL.get((cx+a)+','+(cz+b));if(!L)continue;
  for(const c of L){if(p.y>c.top-.3)continue;const dx=p.x-c.x,dz=p.z-c.z,mn=c.r+1.05,d2=dx*dx+dz*dz;if(d2>=mn*mn)continue;
   const d=Math.sqrt(d2)||.01,ux=dx/d,uz=dz/d;p.x=c.x+ux*mn;p.z=c.z+uz*mn;const vn=v.x*ux+v.z*uz;
   if(vn<0){v.x-=ux*vn*1.35;v.z-=uz*vn*1.35;v.x*=.75;v.z*=.75;if(-vn>4)crash(Math.min(1,-vn/25));}}}
 // ground: walls (sudden step up, e.g. the side/back of a ramp) block; otherwise land/slide
 groundAt(p.x,p.z,_g2);
 if(_g2.h-p.y>1.1&&_g2.ramp){p.x=ox;p.z=oz;const k=v.length();v.x*=-.3;v.z*=-.3;if(k>4)crash(Math.min(1,k/25));groundAt(p.x,p.z,_g2);}
 if(p.y<_g2.h){
  _n.set(_g2.nx,_g2.ny,_g2.nz);const vn=v.dot(_n);
  if(!state.grounded&&vn<-3)land(-vn);
  p.y=_g2.h;if(vn<0)v.addScaledVector(_n,-vn);
  if(_n.y<.6){const l=Math.hypot(_n.x,_n.z),ux=_n.x/l,uz=_n.z/l,d=v.x*ux+v.z*uz;if(d<0){v.x-=ux*d;v.z-=uz*d;}if(v.y>0)v.y*=Math.exp(-6*dt);}
 }
 state.gap=p.y-_g2.h;state.grounded=state.gap<.3;
 // water
 const wasW=state.inWater;state.inWater=W.water!=null&&p.y<W.water-.25;
 if(state.inWater&&!wasW&&v.length()>5){SFX.splash();splash(10);}
 if(W.water!=null&&p.y<W.water-1.6)respawn(false);
 // airtime
 if(state.gap>.6){if(state.airT===0){state.airY0=p.y;state.airMax=p.y;}state.airT+=dt;state.airMax=Math.max(state.airMax,p.y);}
 else if(state.grounded&&state.airT>0){if(state.airT>.7)airScore(state.airT,state.airMax-Math.min(state.airY0,p.y));state.airT=0;}
}
function land(k){const s=clamp(k/18,0,1);state.susp=-Math.min(.25,k*.012);state.shake=Math.max(state.shake,s*.5);SFX.land(.4+s*.6);
 const c=new THREE.Color(W.ground.mid).multiplyScalar(1.1);for(let i=0;i<Math.round(8+s*16);i++){const a=Math.random()*TAU;emit(state.pos.x+Math.cos(a)*1.2,state.pos.y+.2,state.pos.z+Math.sin(a)*1.8,Math.cos(a)*4*s+state.vel.x*.2,1+Math.random()*2,Math.sin(a)*4*s+state.vel.z*.2,c,.9+Math.random(),1.1,1.4);}}
function crash(k){state.shake=Math.max(state.shake,k*.6);SFX.crash(.4+k*.6);}
function splash(n){const c=new THREE.Color(1.2,1.3,1.5);for(let i=0;i<n;i++)emit(state.pos.x+(Math.random()-.5)*2,state.pos.y+.4,state.pos.z+(Math.random()-.5)*2,(Math.random()-.5)*4,3+Math.random()*4,(Math.random()-.5)*4,c,.6,.9,-1);}
function airScore(t,h){const pts=Math.round(t*100+Math.max(0,h)*10);state.points+=pts;
 const big=t>2.2?'MEGA AIR!':t>1.4?'BIG AIR!':'AIR!';popMsg(big,`${t.toFixed(1)} s · +${pts}`,'#5fffd7');}

/* ---------------- Flow: respawn, stars, messages ---------------- */
let popT=0,toastT=0;
function popMsg(a,b,col){const e=$('pop');e.innerHTML=a+(b?`<small>${b}</small>`:'');e.style.color=col;e.classList.add('on');popT=1.5;}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;toastT=2.2;}
function placeCar(x,y,z,yaw){state.pos.set(x,y,z);state.vel.set(0,0,0);state.yaw=yaw;state.steer=0;state.airT=0;state.grounded=true;state.inWater=false;
 car.position.copy(state.pos);bodyQ.setFromEuler(new THREE.Euler(0,yaw,0));body.quaternion.copy(bodyQ);}
function respawn(manual){const f=$('fade');f.style.opacity=1;
 setTimeout(()=>{const s=manual&&state.safe.t?state.safe:SPAWN;placeCar(s.x,groundAt(s.x,s.z).h+.05,s.z,s.yaw);f.style.opacity=0;},manual?160:300);if(!manual)toast('BACK ON TRACK');}
function collectStars(){let n=0;for(const s of STARS){if(s.got)continue;const dx=state.pos.x-s.x,dy=state.pos.y+.8-s.y,dz=state.pos.z-s.z;
 if(dx*dx+dy*dy+dz*dz<16){s.got=true;s.mesh.visible=s.beam.visible=false;n++;state.points+=100;
  const c=new THREE.Color(3,2.4,.5);for(let i=0;i<24;i++){const a=Math.random()*TAU,b=Math.random()*PI;emit(s.x,s.y,s.z,Math.cos(a)*Math.sin(b)*7+state.vel.x*.6,Math.cos(b)*7+2,Math.sin(a)*Math.sin(b)*7+state.vel.z*.6,c,.5,.9,-.5);}
  LS.set('got.'+W.id,STARS.filter(q=>q.got).map(q=>q.i));const got=STARS.filter(q=>q.got).length;
  if(got===STARS.length){SFX.all();popMsg('ALL STARS!',`${W.name} complete · +1000`,'#ffd23a');state.points+=1000;}else{SFX.star();popMsg(`★ ${got}/${STARS.length}`,'+100','#ffd23a');}}}
 return n;}

const bodyQ=new THREE.Quaternion(),_m4=new THREE.Matrix4(),_up=new THREE.Vector3(),_T=new THREE.Vector3(),_S=new THREE.Vector3(),_Z=new THREE.Vector3(),_q=new THREE.Quaternion();

 if(fp){body.add(camera);camera.position.copy(EYE);camera.rotation.set(-.06,0,0);}
 else{scene.add(camera);const f=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw));chasePos.copy(state.pos).addScaledVector(f,-8).y+=3.2;camera.position.copy(chasePos);}

function updateBody(dt){
 const p=state.pos,fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw),rx=-fz,rz=fx;
 if(state.gap<.5){const hf=groundAt(p.x+fx*1.3,p.z+fz*1.3).h,hb=groundAt(p.x-fx*1.3,p.z-fz*1.3).h,hr=groundAt(p.x+rx*.85,p.z+rz*.85).h,hl=groundAt(p.x-rx*.85,p.z-rz*.85).h;
  _T.set(fx,(hf-hb)/2.6,fz).normalize();_S.set(rx,(hr-hl)/1.7,rz).normalize();}
 else{const hs=Math.hypot(state.vel.x,state.vel.z)+1;_T.set(fx,clamp(state.vel.y/hs,-1,1)*.5,fz).normalize();_S.set(rx,0,rz);}
 _up.crossVectors(_S,_T).normalize();_S.crossVectors(_T,_up).normalize();_Z.crossVectors(_S,_up);
 _m4.makeBasis(_S,_up,_Z);_q.setFromRotationMatrix(_m4);bodyQ.slerp(_q,1-Math.exp(-(state.gap<.5?14:3)*dt));body.quaternion.copy(bodyQ);

 car.position.copy(p);
 const sp=Math.hypot(state.vel.x,state.vel.z),spin=sp/.42*dt*(state.vel.dot(_T)<0?-1:1);
 for(const w of wheels){w.spin.rotation.x-=spin;if(w.front)w.g.rotation.y=-state.steer*.45;w.g.position.y=.42+clamp(state.gap<.3?0:-state.gap*.3,-.18,0);}
}
function updateCamera(dt){
 const sp=state.vel.length(),fp=state.cam==='fp';
 const fovT=(fp?72:66)+(REDUCED?0:clamp((sp-10)/50,0,1)*14+(state.boosting?6:0));camera.fov=damp(camera.fov,fovT,3,dt);camera.updateProjectionMatrix();

 const t=performance.now()*.001;
 if(fp){camera.position.set(EYE.x+Math.sin(t*41)*sk*.08,EYE.y+Math.sin(t*37+1)*sk*.1-state.susp*.15,EYE.z);
  camera.rotation.set(-.06+Math.sin(t*29)*sk*.05,-state.steer*.06,Math.sin(t*23)*sk*.04);
  // the pixel cockpit is a screen overlay: move it against the head bob / look so it stays glued to the car
  const tv=Math.tan(camera.fov*PI/360),S=PX.S,lim=PX.pad*S,ox=-Math.tan(state.steer*.06)/(tv*camera.aspect)*innerWidth/2,oy=((camera.position.y-EYE.y)/.7/(2*tv)+Math.tan(camera.rotation.x+.06)/tv/2)*innerHeight;
  pixCv.style.transform=`translate(${Math.round(clamp(ox,-lim,lim)/S)*S}px,${Math.round(clamp(oy,-lim,lim)/S)*S}px)`;}
 else{const f=_T,desired=_v.copy(state.pos).addScaledVector(new THREE.Vector3(f.x,0,f.z).normalize(),-8.5);desired.y=Math.max(state.pos.y+3.2,groundAt(desired.x,desired.z).h+1.5);
  chasePos.lerp(desired,1-Math.exp(-6*dt));camera.position.copy(chasePos);camera.position.x+=Math.sin(t*41)*sk*.3;camera.position.y+=Math.sin(t*37)*sk*.3;
  chaseLook.copy(state.pos).addScaledVector(f,4);chaseLook.y+=1.2;camera.lookAt(chaseLook);}}

 placeCar(state.pos.x,state.pos.y,state.pos.z,state.yaw);applyCam();toast(W.grav<8?'LOW GRAVITY — JUMP HIGH!':'FIND THE ★ STARS');}
function pause(){if(state.mode!=='drive')return;state.mode='pause';for(const k in keys)keys[k]=false;for(const k in touchK)touchK[k]=false;
 scr.innerHTML=`<div class="panel"><div class="eyebrow">${W.emoji} ${W.name}</div><h2>Paused</h2>
 <p class="lead">★ ${STARS.filter(s=>s.got).length}/${STAR_N} stars found in this world · ${state.points} points this drive</p>
 <div class="row"><button class="big" id="res">RESUME ▶</button><button class="ghost" id="rst">Back to start</button><button class="ghost" id="chg">Change world</button></div>
 <a class="home" href="../">← All games</a></div>`;
 $('res').onclick=resume;$('rst').onclick=()=>{placeCar(SPAWN.x,SPAWN.y+.05,SPAWN.z,SPAWN.yaw);resume();};$('chg').onclick=()=>{showMenu();};}
function resume(){scr.innerHTML='';state.mode='drive';last=performance.now();}
$('bPause').onclick=()=>state.mode==='drive'?pause():resume();
$('bReset').onclick=()=>{if(state.mode==='drive')respawn(true);};$('bCam').onclick=()=>{if(state.mode==='drive')toggleCam();};$('bSnd').onclick=toggleSound;$('bSnd').textContent=state.sound?'🔊':'🔇';
addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ---------------- Main loop ---------------- */
let last=performance.now(),acc=0,gaugeT=0,radarT=0,hudT=0,boostWas=false,menuT=0;
const STEP=1/120,dustC=new THREE.Color(),_e=new THREE.Vector3();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now*.001;
 if(state.mode==='drive'){
  IN=readInput();acc+=dt;let n=0;while(acc>=STEP&&n<8){physStep(STEP);acc-=STEP;n++;}if(n>=8)acc=0;
  collectStars();state.time+=dt;
  if(state.boosting&&!boostWas)SFX.boost();boostWas=state.boosting;
  // safe point for R
  state.safeT+=dt;if(state.safeT>2&&state.grounded&&!state.inWater){const g=groundAt(state.pos.x,state.pos.z);if(g.ny>.9&&!g.ramp){state.safe={x:state.pos.x,z:state.pos.z,yaw:state.yaw,t:1};state.safeT=0;}}
  // dust from the rear wheels
  const sp=Math.hypot(state.vel.x,state.vel.z);
  if(state.grounded&&sp>8&&!state.inWater){const onRoad=roadDist(state.pos.x,state.pos.z)<6;const rate=onRoad?.12:.6;
   dustC.set(W.ground.mid).lerp(new THREE.Color(1,1,1),.35);
   for(const s of[-1,1])if(Math.random()<rate*clamp(sp/30,0,1.5)){const fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw);
    emit(state.pos.x-fx*1.6+fz*.85*s,state.pos.y+.25,state.pos.z-fz*1.6-fx*.85*s,-state.vel.x*.15+(Math.random()-.5)*2,1+Math.random()*1.5,-state.vel.z*.15+(Math.random()-.5)*2,dustC,.8,W.grav<8?2.2:1.1,1.6);}}
  if(state.inWater&&sp>3&&Math.random()<.5)splash(1);
  state.stuckT=IN.gas&&sp<1.5?(state.stuckT||0)+dt:0;if(state.stuckT>3){state.stuckT=-6;toast(TOUCH?'STUCK? TAP ↺ TO RESET':'STUCK? PRESS R TO RESET');}
  updateBody(dt);updateCamera(dt);
  // HUD
  hudT-=dt;if(hudT<=0){hudT=.1;const got=STARS.filter(s=>s.got).length;$('stars').textContent=`★ ${got}/${STARS.length}`;$('points').textContent=state.points+' pts';
   const s=Math.floor(state.time);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('spd').firstElementChild.textContent=Math.round(sp*3.6);}
 }else if(state.mode==='menu'){
  menuT+=dt;updateBody(dt);const a=menuT*.12+state.yaw+PI*.8,c=state.pos;
  camera.position.set(c.x+Math.sin(a)*9,c.y+2.6+Math.sin(menuT*.3)*.5,c.z+Math.cos(a)*9);camera.lookAt(c.x,c.y+1,c.z);camera.fov=damp(camera.fov,55,3,dt);camera.updateProjectionMatrix();
  IN={steer:0,gas:false,brake:false,jump:false,boost:false};
 }
 // engine / gears
 const kmh=Math.hypot(state.vel.x,state.vel.z)*3.6,fwd=state.vel.dot(_T);
 const GR=[0,35,70,105,145,190,1e9];let gi=0;while(kmh>GR[gi+1])gi++;
 let rpmT=fwd<-1&&state.mode==='drive'?1.2+kmh/30:1+(kmh-GR[gi])/(Math.min(GR[gi+1],260)-GR[gi])*5.6;
 if(!state.grounded&&IN.gas)rpmT=7.2;if(state.mode==='drive'&&IN.gas&&kmh<8)rpmT=Math.max(rpmT,3.2);
 state.rpm=damp(state.rpm,clamp(rpmT,.9,7.8),8,dt);state.gear=fwd<-1&&IN.brake?'R':kmh<2&&!IN.gas?'N':String(gi+1);
 engineSound(state.rpm,IN.gas?1:0,kmh/3.6,state.mode==='drive');
 if(state.mode!=='pause'){
  if(PX.on)pixFrame(kmh,t,dt);
  updateParticles(dt);
  for(const s of STARS)if(!s.got){s.mesh.rotation.y=t*2+s.i;s.mesh.position.y=s.y+Math.sin(t*2+s.i)*.25;}
 }
 popT-=dt;if(popT<=0)$('pop').classList.remove('on');toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;
 // world dressing that follows the camera
 const cp=camera.getWorldPosition(_e);sky.position.copy(cp);
 if(WX.earth)WX.earth.position.set(cp.x-500,cp.y+520,cp.z-900),WX.earth.rotation.y=t*.02;
 if(WX.blink)WX.blink.visible=(t%1.4)<.5;
 if(WX.snow){const a=WX.snow.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i+1]-=dt*(2+(i%7)*.2);a[i]+=Math.sin(t+i)*dt*.4;
   let dx=a[i]-cp.x,dy=a[i+1]-cp.y,dz=a[i+2]-cp.z;if(dx>35)a[i]-=70;if(dx<-35)a[i]+=70;if(dz>35)a[i+2]-=70;if(dz<-35)a[i+2]+=70;if(dy<-15)a[i+1]+=30;if(dy>15)a[i+1]-=30;}
  WX.snow.geometry.attributes.position.needsUpdate=true;}
 sun.position.copy(state.pos).addScaledVector(SUNDIR,120);sun.target.position.copy(state.pos);
 pts.material.uniforms.scale.value=innerHeight*renderer.getPixelRatio();
 if(POST){const sp=state.vel.length();POST.comp.uniforms.speed.value=REDUCED||state.mode!=='drive'?0:clamp((sp-30)/35,0,1)*.7+(state.boosting?.5:0);POST.render();}
 else renderer.render(scene,camera);
}

/* ---------------- Boot ---------------- */
pixResize();loadWorld();showMenu();$('loading').remove();requestAnimationFrame(frame);
// test hook
window.__openthrottle={state,STARS,RAMPS,WORLDS,get world(){return W;},start:startDrive,
 setWorld(i){state.world=i;loadWorld();if(state.mode==='menu')showMenu();},
 hold(k,on=true){touchK[k]=on;},release(){for(const k in touchK)touchK[k]=false;},
 teleport(x,z,yaw=state.yaw,y){placeCar(x,y!=null?y:groundAt(x,z).h+.05,z,yaw);},ground:(x,z)=>groundAt(x,z).h,
 cam(c){state.cam=c;applyCam();},spawn:SPAWN,renderer,
 // headless check: drive along the road for `sec` seconds of simulated time (autopilot), returns a summary
 sim(sec,o={}){let maxAir=0,maxH=0,jumps=0,lastAir=0;const M=PATH.length;
  for(let i=0;i<sec*120;i++){let bi=0,bd=1e9;for(let k=0;k<M;k+=2){const q=PATH[k],d=(q.x-state.pos.x)**2+(q.z-state.pos.z)**2;if(d<bd){bd=d;bi=k;}}
   const tg=PATH[(bi+(o.ahead||12))%M],fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw),dx=tg.x-state.pos.x,dz=tg.z-state.pos.z;
   const cr=fx*dz-fz*dx;IN={steer:o.steer!=null?o.steer:clamp(cr/Math.hypot(dx,dz)*3,-1,1),gas:true,brake:false,jump:!!o.jump&&i%240===0,boost:!!o.boost};
   physStep(STEP);collectStars();maxAir=Math.max(maxAir,state.airT);maxH=Math.max(maxH,state.gap);if(lastAir>.7&&state.airT===0)jumps++;lastAir=state.airT;}
  updateBody(1);return{maxAir:+maxAir.toFixed(2),maxH:+maxH.toFixed(1),jumps,points:state.points,kmh:Math.round(Math.hypot(state.vel.x,state.vel.z)*3.6),stars:STARS.filter(s=>s.got).length,x:Math.round(state.pos.x),z:Math.round(state.pos.z)};}};
</script>
