  #touch { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; pointer-events: none; }

<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="hud" class="hidden">
  <div class="tl"><small>KM/H</small><div id="spd">0</div><small>TOP <span id="top">0</span></small></div>
  <div class="tc"><div id="progTxt">RAMP IN 0 M</div><div id="prog"><i id="progFill"></i><b id="progBike"></b><u>🏁</u></div></div>
  <div class="tr"><div><small>STARS → TURBO</small><div id="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div><div id="buffs"></div></div>
    <button class="ib" id="bSound" aria-label="Sound on or off">♪</button><button class="ib" id="bPause" aria-label="Pause">Ⅱ</button></div>
  <div id="cadL">PEDAL: ALTERNATE ← →</div>
  <div id="feet"><span id="fL">L</span><div id="cad"><i id="cadBar"></i></div><span id="fR">R</span></div>
  <div id="dist" class="hidden">0.0<small> M</small></div>
</div>
<div id="hop"><canvas id="hopC" width="240" height="240"></canvas><span id="hopT">HOP!</span></div>

  <div class="g" id="tSteer"><button id="tA" aria-label="Steer left">◀</button><button id="tD" aria-label="Steer right">▶</button></div>
  <button id="tHop" class="hidden" aria-label="Hop">HOP!</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').style.display = 'flex'; $('err').textContent = 'Unable to load the 3D engine. Check your internet connection and reload the page.'; return; }

// ---------- helpers ----------
const PI = Math.PI, TAU = PI * 2, V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
function store(k, v) { try { localStorage.setItem('pedalleap.' + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem('pedalleap.' + k)); return v == null ? d : v; } catch (e) { return d; } }
const SET = Object.assign({ sound: true, track: 0 }, load('settings', {}));
const BEST = load('best', {});
const TOUCHDEV = matchMedia('(pointer:coarse)').matches;
const CALM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const C = h => new THREE.Color(h);
if (TOUCHDEV) document.body.classList.add('touch');
// smooth 2D value noise for hills
const vnoise = (() => { const R = mulberry(99), g = new Float32Array(256); for (let i = 0; i < 256; i++) g[i] = R();
  const at = (x, y) => g[((x & 15) + (y & 15) * 16)]; const sm = t => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), u = sm(x - xi), v = sm(y - yi); return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); }; })();
const fbm = (x, y) => vnoise(x, y) * .55 + vnoise(x * 2.1 + 3.7, y * 2.1 + 1.3) * .3 + vnoise(x * 4.3 + 7.1, y * 4.3 + 5.9) * .15;

// ---------- renderer ----------
const canvas = $('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('err').style.display = 'flex'; return; }
const DPR = Math.min(devicePixelRatio || 1, TOUCHDEV ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 150, 1400);
const cam = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, .1, 5000);

// Post: HDR scene (MSAA) -> bright pass -> 4-level blur (real bloom) -> grade. Same pipeline as Rollway / Iron Line (see game-visuals skill).
const POST = (() => {
  const low = /fx=low/.test(location.search) || (TOUCHDEV && Math.min(innerWidth, innerHeight) < 560);
  if (low || !renderer.capabilities.isWebGL2) return null;
  const rt = ms => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: !!ms, samples: ms ? 4 : 0 });
  const main = rt(true), LV = 4, bA = [], bB = []; for (let i = 0; i < LV; i++) { bA.push(rt()); bB.push(rt()); }
  const qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const SM = (u, fs) => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
  const bright = SM({ t: { value: null }, th: { value: 1.1 }, knee: { value: .3 } }, `uniform sampler2D t;uniform float th,knee;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));float s=clamp(l-th+knee,0.,2.*knee);s=s*s/(4.*knee+1e-4);gl_FragColor=vec4(c*max(s,l-th)/max(l,1e-4),1.);}`);
  const blur = SM({ t: { value: null }, dir: { value: new THREE.Vector2() } }, `uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.385).rgb+texture2D(t,vUv-dir*1.385).rgb)*.316;c+=(texture2D(t,vUv+dir*3.231).rgb+texture2D(t,vUv-dir*3.231).rgb)*.070;gl_FragColor=vec4(c,1.);}`);
  const comp = SM({ t: { value: main.texture }, b0: { value: bA[0].texture }, b1: { value: bA[1].texture }, b2: { value: bA[2].texture }, b3: { value: bA[3].texture }, px: { value: new THREE.Vector2() },
    bloom: { value: .55 }, expo: { value: 1.0 }, sat: { value: 1.1 }, vig: { value: .3 }, warm: { value: new THREE.Vector3(1.02, 1, .97) }, sharp: { value: .2 } },
  `uniform sampler2D t,b0,b1,b2,b3;uniform vec2 px;uniform float bloom,expo,sat,vig,sharp;uniform vec3 warm;varying vec2 vUv;
vec3 shoulder(vec3 c){vec3 x=max(c-.78,0.);return min(c,.78)+.22*(1.-exp(-x/.22));}
void main(){vec3 c=texture2D(t,vUv).rgb;
 vec3 nb=(texture2D(t,vUv+vec2(px.x,0.)).rgb+texture2D(t,vUv-vec2(px.x,0.)).rgb+texture2D(t,vUv+vec2(0.,px.y)).rgb+texture2D(t,vUv-vec2(0.,px.y)).rgb)*.25;
 c=max(c+(c-nb)*sharp,0.);
 vec3 b=texture2D(b0,vUv).rgb*.9+texture2D(b1,vUv).rgb*.75+texture2D(b2,vUv).rgb*.6+texture2D(b3,vUv).rgb*.5;
 c=(c+b*bloom)*expo*warm;float l=dot(c,vec3(.2126,.7152,.0722));c=max(mix(vec3(l),c,sat),0.);
 c=shoulder(c);vec2 d=vUv-.5;c*=1.-dot(d,d)*vig*1.8;
 gl_FragColor=vec4(c,1.);
#include <colorspace_fragment>
}`);
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(qs, qc); };
  const size = new THREE.Vector2();
  function resize() { renderer.getDrawingBufferSize(size); main.setSize(size.x, size.y); let w = size.x >> 1, h = size.y >> 1;
    for (let i = 0; i < LV; i++) { bA[i].setSize(Math.max(1, w), Math.max(1, h)); bB[i].setSize(Math.max(1, w), Math.max(1, h)); w >>= 1; h >>= 1; } comp.uniforms.px.value.set(1 / size.x, 1 / size.y); }
  resize();
  function render() {
    renderer.setRenderTarget(main); renderer.render(scene, cam);
    bright.uniforms.t.value = main.texture; pass(bright, bA[0]);
    for (let i = 0; i < LV; i++) { if (i > 0) { blur.uniforms.t.value = bA[i - 1].texture; blur.uniforms.dir.value.set(0, 0); pass(blur, bA[i]); }
      const w = bA[i].width, h = bA[i].height; blur.uniforms.t.value = bA[i].texture; blur.uniforms.dir.value.set(1 / w, 0); pass(blur, bB[i]);
      blur.uniforms.t.value = bB[i].texture; blur.uniforms.dir.value.set(0, 1 / h); pass(blur, bA[i]); }
    pass(comp, null);
  }
  return { render, resize, comp, bright };
})();

// "Toy studio" environment for the glossy bike paint and helmet.
const ENV = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#bcd8ff'); g.addColorStop(.47, '#ffffff'); g.addColorStop(.53, '#9a948c'); g.addColorStop(1, '#3d3a38');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256); x.fillStyle = '#fff';
  [[90, 52, 58, 16], [290, 40, 86, 13], [440, 78, 40, 18], [200, 96, 28, 9]].forEach(([a, b, w, h]) => { x.beginPath(); x.ellipse(a, b, w, h, 0, 0, TAU); x.fill(); });
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer); const r = pm.fromEquirectangular(t).texture; pm.dispose(); t.dispose(); return r;
})();

  } else if (state === 'result') {
    const a = t * .05; _cp.set(result ? A.u + Math.sin(a) * 30 : 0, 16, -T.L - A.x + 36 + Math.cos(a) * 8); _cl.set(A.u, 2, -T.L - A.x);
    const k = 1 - Math.exp(-1.2 * dt); camPos.lerp(_cp, k); camLook.lerp(_cl, k); fov = 58;
  }
  cam.position.copy(camPos);
  if (camKick > 0 && !CALM) { cam.position.x += (Math.random() - .5) * camKick * .35; cam.position.y += (Math.random() - .5) * camKick * .35; camKick = Math.max(0, camKick - dt * 2.2); }
  if (state === 'ride' && P.v > 30 && !CALM) cam.position.y += Math.sin(t * 40) * (P.v - 30) * .0025;
  cam.lookAt(camLook);
  cam.fov = damp(cam.fov, fov, 4, dt); cam.updateProjectionMatrix();
  const sc = renderer.domElement.height / (2 * Math.tan(cam.fov * PI / 360)); SPARK.mat.uniforms.uScale.value = sc; SPRAY.mat.uniforms.uScale.value = sc;
  sky.position.copy(cam.position);
}

// ---------- 2D overlay: speed lines, hop ring, glide gauge ----------
const fx = $('fx'), fxc = fx.getContext('2d'), LINES = Array.from({ length: 70 }, () => ({ a: Math.random() * TAU, r: Math.random(), w: Math.random() }));
const hopC = $('hopC').getContext('2d');
function drawFx(dt) {
  const W = fx.width, H = fx.height; fxc.clearRect(0, 0, W, H);
  const sp = state === 'ride' ? P.v : state === 'air' ? Math.hypot(A.vx, A.vy) : 0;
  const k = clamp((sp - 24) / 20, 0, 1) * (CALM ? .4 : 1) + (P.turboT > 0 && state === 'ride' ? .35 : 0);
  if (k > 0) {
    const cx = W / 2, cy = H * .45, R0 = Math.hypot(W, H) * .5;
    fxc.lineCap = 'round';
    for (const l of LINES) { l.r += dt * (1.4 + sp * .05) * (.6 + l.w); if (l.r > 1) { l.r = .25 + Math.random() * .2; l.a = Math.random() * TAU; l.w = Math.random(); }
      const r1 = R0 * l.r, r2 = r1 + R0 * (.06 + l.w * .1) * (1 + k);
      fxc.strokeStyle = P.turboT > 0 && state === 'ride' ? `rgba(255,210,80,${.35 * k})` : `rgba(255,255,255,${.28 * k * (.4 + l.w)})`; fxc.lineWidth = (1 + l.w * 2.5) * DPR;
      fxc.beginPath(); fxc.moveTo(cx + Math.cos(l.a) * r1, cy + Math.sin(l.a) * r1); fxc.lineTo(cx + Math.cos(l.a) * r2, cy + Math.sin(l.a) * r2); fxc.stroke(); }
  }
  // glide gauge
  if (state === 'air') {
    const gam = Math.atan2(A.vy, A.vx), al = A.pitch - gam, cx = W / 2, cy = H - 120 * DPR, R = 90 * DPR;
    fxc.save(); fxc.translate(cx, cy); fxc.lineCap = 'round';
    const ang = x => -PI / 2 + clamp(x, -.8, .9) * 1.4;
    fxc.lineWidth = 16 * DPR;
    const seg = (a, b, c) => { fxc.strokeStyle = c; fxc.beginPath(); fxc.arc(0, 0, R, ang(a), ang(b)); fxc.stroke(); };
    seg(-.8, .1, 'rgba(255,255,255,.25)'); seg(.1, .42, 'rgba(95,255,170,.9)'); seg(.42, .62, 'rgba(255,210,58,.85)'); seg(.62, .9, 'rgba(255,77,109,.85)');
    const a = ang(al); fxc.strokeStyle = '#fff'; fxc.lineWidth = 5 * DPR; fxc.beginPath(); fxc.moveTo(0, 0); fxc.lineTo(Math.cos(a) * (R + 14 * DPR), Math.sin(a) * (R + 14 * DPR)); fxc.stroke();
    fxc.fillStyle = '#fff'; fxc.beginPath(); fxc.arc(0, 0, 8 * DPR, 0, TAU); fxc.fill();
    fxc.font = `900 ${14 * DPR}px "Trebuchet MS", sans-serif`; fxc.textAlign = 'center'; fxc.fillStyle = al > .62 ? '#ff4d6d' : al > .1 && al < .42 ? '#5fffaa' : '#fff';
    fxc.fillText(al > .62 ? 'TOO STEEP!' : al > .1 && al < .42 ? 'GLIDING ✓' : al <= .1 ? (TOUCHDEV ? 'HOLD ▲ TO GLIDE' : 'HOLD ↑ TO GLIDE') : 'EASY…', 0, 34 * DPR);
    fxc.restore();
  }
  // hop ring
  const hopEl = $('hop');
  if (state === 'ride' && T.L - P.s < 70 && P.hopD < 0) {
    const d = T.L - P.s; hopEl.style.opacity = 1; const c = hopC, S = 240; c.clearRect(0, 0, S, S);
    c.lineWidth = 10; c.strokeStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(S / 2, S / 2, 46, 0, TAU); c.stroke();
    c.lineWidth = 14; c.strokeStyle = '#5fffaa'; c.beginPath(); c.arc(S / 2, S / 2, 46, 0, TAU); c.globalAlpha = .5; c.stroke(); c.globalAlpha = 1;
    const r = 46 + clamp(d - 5, 0, 65) * 1.0; c.lineWidth = 8; c.strokeStyle = d <= 10 ? '#5fffaa' : '#ffd23a'; c.beginPath(); c.arc(S / 2, S / 2, r, 0, TAU); c.stroke();
    $('hopT').textContent = d <= 10 ? (TOUCHDEV ? 'HOP NOW!' : 'SPACE NOW!') : (TOUCHDEV ? 'GET READY TO HOP' : 'GET READY: SPACE');
    $('tHop').classList.remove('hidden');
  } else { hopEl.style.opacity = 0; if (state !== 'ride' || P.hopD >= 0) $('tHop').classList.add('hidden'); }
}

// ---------- HUD ----------
let popTimer = 0, toastTimer = 0;
function pop(t, sub, col) { const el = $('pop'); el.innerHTML = t + (sub ? '<small>' + sub + '</small>' : ''); el.style.color = col || '#ffd23a'; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); popTimer = 1.5; }
function toast(t, col) { const el = $('toast'); el.textContent = t; el.style.color = col || '#fff'; el.style.opacity = 1; toastTimer = 1.5; }
let footT = [0, 0];
function flashFoot(f) { footT[f - 1] = .12; }
function updateHud(dt) {
  if (popTimer > 0 && (popTimer -= dt) <= 0) $('pop').classList.remove('on');
  if (toastTimer > 0 && (toastTimer -= dt) <= 0) $('toast').style.opacity = 0;
  const air = state === 'air' || state === 'splash';
  const v = air ? Math.hypot(A.vx, A.vy) : P.v, kmh = Math.round(v * 3.6);
  $('spd').textContent = kmh; $('spd').className = kmh > 110 ? 'fast' : ''; $('top').textContent = Math.round(P.top * 3.6);
  const prog = clamp(P.s / T.L, 0, 1); $('progFill').style.width = prog * 100 + '%'; $('progBike').style.left = prog * 100 + '%';
  $('progTxt').textContent = air ? 'FLYING!' : 'RAMP IN ' + Math.max(0, Math.round(T.L - P.s)) + ' M';
  const st = $('stars').children; for (let i = 0; i < 5; i++) st[i].className = i < P.stars ? 'on' : '';
  let b = ''; if (P.turboT > 0) b += '<span style="color:#ffd23a">TURBO ' + P.turboT.toFixed(1) + '</span>'; if (P.superT > 0) b += '<span style="color:#5fffd7">SUPER LEGS ' + P.superT.toFixed(1) + '</span>';
  if ($('buffs').innerHTML !== b) $('buffs').innerHTML = b;
  for (let i = 0; i < 2; i++) { footT[i] -= dt; $(i ? 'fR' : 'fL').classList.toggle('on', footT[i] > 0); $(i ? 'fR' : 'fL').classList.toggle('want', state === 'ride' && P.lastFoot !== i + 1); }
  $('cadBar').style.width = clamp(cadence() / 10, 0, 1) * 100 + '%';
  $('cadL').textContent = P.wrongT > 0 ? 'ALTERNATE LEFT AND RIGHT!' : P.superT > 0 ? 'SUPER LEGS: PEDAL!' : cadence() > 7 ? 'FULL POWER!' : (TOUCHDEV ? 'PEDAL: TAP L · R · L · R' : 'PEDAL: ← → ← →');
  $('dist').classList.toggle('hidden', !air); if (state === 'air') $('dist').innerHTML = A.x.toFixed(1) + '<small> M</small>';
}

// ---------- screens ----------
const SCR = $('screen');
function trackCards() { return '<div class="tracks">' + TRACKS.map((t, i) => `<button class="trk${t === T ? ' sel' : ''}" data-trk="${i}"><i style="background:${t.swatch}"></i><div><b>${t.name}</b><small>${t.tag}</small><em>${BEST[t.id] ? 'BEST ' + BEST[t.id].toFixed(1) + ' m' : 'NEW'}</em></div></button>`).join('') + '</div>'; }
function bindTracks() { SCR.querySelectorAll('[data-trk]').forEach(b => b.onclick = () => { audio(); SFX.click(); selectTrack(+b.dataset.trk); SCR.querySelectorAll('[data-trk]').forEach(x => x.classList.toggle('sel', x === b)); }); }
function selectTrack(i) { if (TRACKS[i] === T) return; T = TRACKS[i]; SET.track = i; store('settings', SET); buildWorld(); resetRun(); }
function showTitle() {
  state = 'title'; paused = false; document.body.classList.remove('air'); $('hud').classList.add('hidden'); $('touch').classList.add('hidden'); resetRun(); camInit = true;
  SCR.innerHTML = `<div class="panel"><div class="eyebrow">BIKE · RAMP · SEA</div><h1>Pedal<br><em>Leap</em></h1>
  <p class="lead">Pedal like crazy down a long road, grab boost pads, stars and energy drinks, then fly off the giant ramp over the sea. How far can you leap?</p>
  ${trackCards()}
  <button class="btn" id="go">RIDE! <small>${TOUCHDEV ? '' : 'ENTER'}</small></button>
  <div class="keys"><b>←</b> <b>→</b> alternate fast to pedal &nbsp;·&nbsp; <b>A</b> <b>D</b> steer &nbsp;·&nbsp; <b>SPACE</b> hop at the ramp lip &nbsp;·&nbsp; <b>↑</b> <b>↓</b> lean in the air<br><b>P</b> pause &nbsp;·&nbsp; <b>M</b> sound &nbsp;·&nbsp; <b>R</b> restart</div>
  <div class="tip">${TOUCHDEV ? 'Tap L and R one after the other, as fast as you can!' : 'Two players? One pedals with the arrows, the other steers with A and D!'}</div></div>`;
  bindTracks(); $('go').onclick = startGame;
}
function startGame() {
  audio(); SCR.innerHTML = ''; resetRun(); state = 'count'; countT = 3.2; camInit = true; document.body.classList.remove('air');
  $('hud').classList.remove('hidden'); if (TOUCHDEV) $('touch').classList.remove('hidden'); setTouchMode(); pop('3', TOUCHDEV ? 'tap L R to warm up!' : 'pedal ← → to warm up!', '#fff'); SFX.count(1);
}
function showResult() {
  state = 'result'; const r = result, MC = ['', '#d98a4a', '#cfd6e0', '#ffd23a'], MN = ['', 'BRONZE', 'SILVER', 'GOLD'];
  $('hud').classList.add('hidden'); $('touch').classList.add('hidden');
  const nextM = T.medals.find(d => d > r.dist);
  SCR.innerHTML = `<div class="panel"><div class="eyebrow">${T.name.toUpperCase()}</div><h2>Splash!</h2>
  <div class="big"><em>${r.dist.toFixed(1)}</em><span> m</span></div>
  <div>${r.medal ? `<span class="medal" style="color:${MC[r.medal]}"><i style="background:${MC[r.medal]}"></i>${MN[r.medal]}</span>` : ''}${r.rec ? '<span class="rec">NEW BEST!</span>' : `<span class="medal">BEST ${(BEST[T.id] || 0).toFixed(1)} m</span>`}</div>
  ${nextM ? `<div class="next">${(nextM - r.dist).toFixed(1)} m more for ${MN[T.medals.indexOf(nextM) + 1].toLowerCase()}!</div>` : '<div class="next">Gold! Can you beat your best?</div>'}
  <div class="stats"><div><small>TAKE-OFF</small><b>${Math.round(r.launch * 3.6)} km/h</b></div><div><small>TOP SPEED</small><b>${Math.round(r.top * 3.6)} km/h</b></div><div><small>STARS</small><b>${r.stars}</b></div><div><small>AIR RINGS</small><b>${r.rings}</b></div><div><small>HOP</small><b>${r.hop > .7 ? 'PERFECT' : r.hop > 0 ? 'GOOD' : '—'}</b></div></div>
  <button class="btn" id="again">RIDE AGAIN <small>${TOUCHDEV ? '' : 'ENTER'}</small></button><button class="btn sec" id="menu">TRACKS</button></div>`;
  $('again').onclick = startGame; $('menu').onclick = showTitle;
  if (r.medal || r.rec) SFX.medal();
}
function togglePause() {
  if (state !== 'ride' && state !== 'air' && state !== 'count') return;
  paused = !paused;
  if (paused) { SCR.innerHTML = `<div class="panel"><h2>Paused</h2><p class="lead">Take a breath!</p><button class="btn" id="res">RESUME <small>P</small></button><button class="btn sec" id="rst">RESTART</button><button class="btn sec" id="men">TRACKS</button></div>`;
    $('res').onclick = togglePause; $('rst').onclick = () => { paused = false; startGame(); }; $('men').onclick = showTitle; }
  else SCR.innerHTML = '';
}
function toggleSound() { SET.sound = !SET.sound; store('settings', SET); audio(); if (MASTER) MASTER.gain.setTargetAtTime(SET.sound ? .5 : 0, AC.currentTime, .05); $('bSound').textContent = SET.sound ? '♪' : '×'; }
$('bSound').textContent = SET.sound ? '♪' : '×';
$('bSound').onclick = toggleSound; $('bPause').onclick = togglePause;

// ---------- input ----------
addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(c)) e.preventDefault();
  if (c === 'KeyA') K.a = 1; if (c === 'KeyD') K.d = 1;
  if (c === 'ArrowUp' || c === 'KeyW') K.up = 1; if (c === 'ArrowDown' || c === 'KeyS') K.down = 1;
  if (e.repeat) return;
  if (c === 'ArrowLeft') stroke(1); if (c === 'ArrowRight') stroke(2);
  if (c === 'Space') hop();
  if (c === 'KeyP' || c === 'Escape') { if (state === 'result' && c === 'Escape') showTitle(); else togglePause(); }
  if (c === 'KeyM') toggleSound();
  if (c === 'KeyR' && (state === 'ride' || state === 'air' || state === 'count')) { paused = false; startGame(); }
  if (c === 'Enter') { if (state === 'title' || state === 'result') startGame(); else if (paused) togglePause(); }
});
addEventListener('keyup', e => { const c = e.code; if (c === 'KeyA') K.a = 0; if (c === 'KeyD') K.d = 0; if (c === 'ArrowUp' || c === 'KeyW') K.up = 0; if (c === 'ArrowDown' || c === 'KeyS') K.down = 0; });
addEventListener('blur', () => { K.a = K.d = K.up = K.down = 0; if (state === 'ride' || state === 'air') { if (!paused) togglePause(); } });
function press(id, down, up) { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (er) {} el.classList.add('on'); audio(); down(); });
  const off = e => { el.classList.remove('on'); up && up(); }; el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off); }
press('tA', () => K.a = 1, () => K.a = 0); press('tD', () => K.d = 1, () => K.d = 0);
press('tL', () => { if (state === 'air') K.up = 1; else stroke(1); }, () => K.up = 0);
press('tR', () => { if (state === 'air') K.down = 1; else stroke(2); }, () => K.down = 0);
press('tHop', hop);
function setTouchMode() { const air = state === 'air'; $('tL').textContent = air ? '▲' : 'L'; $('tR').textContent = air ? '▼' : 'R';  }

// ---------- main loop ----------
let last = performance.now();
function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  let rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (paused) rdt = 0;
  if (slowT > 0) { slowT -= rdt; timeScale = slowT > 0 ? .3 : 1; }
  const dt = rdt * timeScale; gameT += rdt; U.time.value = gameT;
  if (state === 'count') { const before = Math.ceil(countT); countT -= rdt; const after = Math.ceil(countT);
    if (after !== before) { if (after > 0) { pop(String(after), '', '#fff'); SFX.count(1); } else { const cad = cadence(); state = 'ride'; SFX.count(0);
        if (cad >= 4) { P.pend += Math.min(3, cad * .35); pop('GO!', 'flying start!', '#5fffd7'); } else pop('GO!', '', '#5fffd7'); } } }
  else if (state === 'ride') { const n = Math.ceil(dt / .02), h = dt / n; for (let i = 0; i < n && state === 'ride'; i++) tickRide(h); }
  if (state === 'air') { const n = Math.ceil(dt / .01), h = dt / n; for (let i = 0; i < n && state === 'air'; i++) tickAir(h); }
  else if (state === 'splash') { splashT += rdt; if (splashT > .5 && !SPLASH_MARK.visible) { SPLASH_MARK.visible = true; pop(result.dist.toFixed(1) + ' m', result.rec ? 'NEW BEST!' : '', result.rec ? '#ff4d6d' : '#ffd23a'); } if (splashT > 2.6) showResult(); }
  if (!paused) { SPARK.update(dt); SPRAY.update(dt); }
  updateVisuals(dt, gameT); updateCam(rdt, gameT); updateHud(rdt); drawFx(rdt);
  if (POST) POST.render(); else renderer.render(scene, cam);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); if (POST) POST.resize(); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; }
addEventListener('resize', resize);
resize(); buildWorld(); showTitle(); requestAnimationFrame(frameLoop);
/*__TEST_HOOK__*/
})();
</script>
