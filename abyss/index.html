(()=>{'use strict';

function spawnFood(bx,by,cx,cy){const n=4+Math.floor(Math.random()*4),pat=Math.random(),shoal=pickFood();
for(let i=0;i<n;i++){let x,y,z,kind;

function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);F=Math.min(W*.94,H*.82);bounds={x:Math.max(.65,W*.45*6/(F*1.04)-1),y:Math.max(.4,Math.min(1.4,H*.5*6/(F*1.04)-2.95))};g.x=g.tx=clamp(g.x,-bounds.x,bounds.x);g.y=g.ty=clamp(g.y,-bounds.y,bounds.y);bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6fe0dc');bg.addColorStop(.33,'#22a6bd');bg.addColorStop(.75,'#0d6a93');bg.addColorStop(1,'#0a4a74');sand=ctx.createLinearGradient(0,H*.4,0,H);sand.addColorStop(0,'#2c97a8');sand.addColorStop(.45,'#5fb3ad');sand.addColorStop(1,'#d9cf9f');vignette=ctx.createRadialGradient(W*.5,H*.4,H*.1,W*.5,H*.5,Math.max(W,H)*.75);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#00284a80')}

// Cached anatomical mesh. Local positive Z is the nose; negative Z is the tail.
function mesh(n,m){const vertices=[],faces=[];const add=(x,y,z)=>{vertices.push({x,y,z});return vertices.length-1};const face=(a,b,c,fin=false)=>faces.push({a,b,c,fin});

for(let i=0;i<n;i++){let t=i/(n-1),k=0;while(k<profile.length-2&&profile[k+1][0]<t)k++;let a=profile[k],b=profile[k+1],u=(t-a[0])/(b[0]-a[0]);u=u*u*(3-2*u);for(let j=0;j<m;j++){let angle=j/m*TAU;add(Math.cos(angle)*(a[1]+(b[1]-a[1])*u),Math.sin(angle)*(a[2]+(b[2]-a[2])*u),-1.1+t*2.7)}}

fin([[0,-.23,.6],[0,-.83,.02],[0,-.64,-.1],[0,-.21,-.18]],[.024,0,0]);fin([[0,-.12,-.5],[0,-.31,-.78],[0,-.08,-.9]],[.013,0,0]);

const meshHigh=mesh(28,16),meshLow=mesh(20,12);
function pose(x,y,z){const rear=clamp((.5-z)/2.3,0,1);x+=Math.sin(g.tail+z*1.55)*rear*rear*.18;const py=y*Math.cos(g.pitch)-z*Math.sin(g.pitch),pz=y*Math.sin(g.pitch)+z*Math.cos(g.pitch);return{x:g.x+x*Math.cos(g.roll)-py*Math.sin(g.roll),y:g.y+x*Math.sin(g.roll)+py*Math.cos(g.roll),z:6+pz}}

let hint=true;
function update(dt){g.time+=dt;g.tail=mod(g.tail+dt*(5.2+g.speed*.18),TAU);if(g.mode==='start'){g.distance+=dt*7;g.x=Math.sin(g.time*.4)*.2;g.roll=Math.sin(g.time*.4)*.06}else{const ox=g.x,oy=g.y;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),n=Math.hypot(dx,dy)||1;g.tx=clamp(g.tx+dx/n*dt*5,-bounds.x,bounds.x);g.ty=clamp(g.ty+dy/n*dt*4,-bounds.y,bounds.y);let e=1-Math.exp(-12*dt);g.x+=(g.tx-g.x)*e;g.y+=(g.ty-g.y)*e;g.roll+=((g.tx-g.x)*.25-g.roll)*e;g.pitch+=(clamp(-(g.ty-g.y)*.14,-.14,.14)-g.pitch)*e;g.boost=Math.max(0,g.boost-dt*.1);g.slow=Math.max(0,g.slow-dt);g.inv=Math.max(0,g.inv-dt);g.flash=Math.max(0,g.flash-dt*2);g.comboTime-=dt;if(g.comboTime<=0)g.combo=0;g.speed+=((g.slow>0?9:18+Math.min(7,g.distance/450)+g.boost*16)-g.speed)*(1-Math.exp(-5*dt));const step=g.speed*dt;g.distance+=step;g.score+=step*.5;g.spawn-=step;
if(g.spawn<=0){g.spawn=28;const bx=bounds.x*.8,by=bounds.y*.8,x=(Math.random()*2-1)*bx,y=(Math.random()*2-1)*by;spawnFood(bx,by,x,y);let ex=x>0?-bx:bx;g.objects.push({type:Math.random()<.4?'orca':'enemy',x:ex,y:(Math.random()*2-1)*by,z:92,r:.74});if(g.distance>650)g.objects.push({type:'enemy',x:ex,y:y>0?-by:by,z:111,r:.7})}
for(const o of g.objects){if(o.type==='food'){o.x=clamp(o.x0+Math.sin(g.time*o.f+o.ph)*o.ax,-bounds.x,bounds.x);o.y=clamp(o.y0+Math.cos(g.time*o.f*1.3+o.ph)*o.ay,-bounds.y,bounds.y)}let old=o.z;o.z-=step;if(old>=6&&o.z<=6&&!o.done){o.done=true;let t=step?clamp((old-6)/step,0,1):0;if(Math.hypot(o.x-(ox+(g.x-ox)*t),o.y-(oy+(g.y-oy)*t))<o.r+.31){if(o.type==='food'){o.hidden=true;const FD=FOODS[o.kind];g.combo=Math.min(12,g.combo+1);g.comboTime=2.5;g.score+=FD.pts*g.combo;g.boost=Math.min(1.6,g.boost+.24);splash(o.x,o.y,FD.col,'+'+FD.pts*g.combo);sound('fish')}else if(g.inv<=0){g.hp=Math.max(0,g.hp-25);g.inv=1.7;g.slow=1.8;g.speed=Math.min(g.speed,13);g.boost=0;g.combo=0;g.flash=1;splash(g.x,g.y,'#fb879a','−25 HP');sound('hit');if(!g.hp){end();break}}}}}g.objects=g.objects.filter(o=>o.z>2&&!o.hidden)}
const speed=g.mode==='start'?7:g.speed;for(const c of currents){c.z-=speed*dt;if(c.z+c.length<2)c.z+=118}for(const b of bubbles){b.z-=speed*dt;b.y-=dt*.06;if(b.z<2.1||b.y<-6){b.z=100;b.y=Math.random()*8-4;b.x=Math.random()*22-11}}
