<script>
'use strict';
// ============ UTIL ============
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let W,H;
function resize(){const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)},clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'):'—';
const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');const FOGC=[204,184,164],cc={};
function rgb(c){const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}
function fog(c,z){const q=Math.round(clamp((z-45)/230,0,.72)*20);if(!q)return c;const k=c+q;return cc[k]||(cc[k]='rgb('+rgb(c).map((v,i)=>Math.round(v+(FOGC[i]-v)*q/20))+')')}
function shade(c,f){const k=c+'*'+f;return cc[k]||(cc[k]='#'+rgb(c).map(v=>Math.min(255,Math.round(v*f)).toString(16).padStart(2,'0')).join(''))}

// ============ TRACK (closed Catmull-Rom spline, resampled every SEG units) ============
const CP=[[0,-60],[0,60],[0,170],[12,240],[60,272],[140,276],[220,276],[285,262],[318,215],[320,160],[300,118],[322,76],[322,10],[322,-70],[308,-128],[262,-148],[200,-146],[150,-112],[100,-112],[66,-150],[58,-215],[34,-262],[-6,-272],[-30,-240],[0,-180]];
const SEG=2,HALF=5.2,TX=[],TZ=[],TA=[],TK=[],NX=[],NZ=[],AM=[];
(function(){const raw=[],n=CP.length;for(let i=0;i<n;i++){const p0=CP[(i+n-1)%n],p1=CP[i],p2=CP[(i+1)%n],p3=CP[(i+2)%n];for(let j=0;j<60;j++){const t=j/60,t2=t*t,t3=t2*t;raw.push([0,1].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}
 let a=raw[0],acc=0;TX.push(a[0]);TZ.push(a[1]);
 for(let i=1;i<=raw.length;i++){const b=raw[i%raw.length];let d=Math.hypot(b[0]-a[0],b[1]-a[1]);while(acc+d>=SEG){const t=(SEG-acc)/d;a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];TX.push(a[0]);TZ.push(a[1]);d=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}acc+=d;a=b}
 if(Math.hypot(TX.at(-1)-TX[0],TZ.at(-1)-TZ[0])<1){TX.pop();TZ.pop()}
 const N=TX.length,K=[];for(let i=0;i<N;i++){const j=(i+1)%N;TA[i]=Math.atan2(TX[j]-TX[i],TZ[j]-TZ[i])}
 for(let i=0;i<N;i++){K[i]=wrapA(TA[(i+1)%N]-TA[i])/SEG;const p=TA[(i+N-1)%N];AM[i]=p+wrapA(TA[i]-p)/2;NX[i]=Math.cos(AM[i]);NZ[i]=-Math.sin(AM[i])}
 for(let i=0;i<N;i++){let s=0;for(let j=-4;j<=4;j++)s+=K[(i+j+N)%N];TK[i]=s/9}})();
const N=TX.length,L=N*SEG,md=s=>(s%L+L)%L;
function at(s){s=md(s);const i=Math.floor(s/SEG),f=s/SEG-i,j=(i+1)%N;return{x:TX[i]+(TX[j]-TX[i])*f,z:TZ[i]+(TZ[j]-TZ[i])*f,a:AM[i]+wrapA(AM[j]-AM[i])*f}}
const kAt=s=>TK[Math.floor(md(s)/SEG)%N];
function toWorld(s,x){const p=at(s);return[p.x+Math.cos(p.a)*x,p.z-Math.sin(p.a)*x,p.a]}

// Static props: buildings, lamps (rejected if too close to any part of the track), boost pads, roadworks
const props=[],pads=[],blocks=[];
(function(){const shades=['#728b8e','#849797','#5c7782','#a4aaa0','#577180'];
 const clear=(x,z,a,hw,hl,m)=>{const sn=Math.sin(a),cs=Math.cos(a);for(let j=0;j<N;j++){const dx=TX[j]-x,dz=TZ[j]-z,la=Math.max(0,Math.abs(dx*cs-dz*sn)-hw),lb=Math.max(0,Math.abs(dx*sn+dz*cs)-hl);if(Math.hypot(la,lb)<m)return false}return true};
 for(let s=0,n=0;s<L;s+=13,n++)for(const sd of[-1,1]){const seed=n*3+sd*77,l=8+rnd(seed)*4,d=6+rnd(seed+1)*7,h=4+rnd(seed+2)*17,[x,z,a]=toWorld(s,sd*(HALF+3.6+d/2));if(clear(x,z,a,d/2,l/2,HALF+3.3))props.push({k:0,s,x,z,a,sd,l,d,h,c:shades[Math.floor(rnd(seed+3)*5)],v:n%3})}
 for(let s=6;s<L;s+=26)for(const sd of[-1,1]){const[x,z,a]=toWorld(s,sd*(HALF+1.1));if(clear(x,z,a,0,0,HALF+.9))props.push({k:1,s,x,z,a,sd})}
 let lp=-999,lb=-999;for(let s=150;s<L-90;s+=10){let mk=0;for(let d=-20;d<=50;d+=4)mk=Math.max(mk,Math.abs(kAt(s+d)));if(mk>.008)continue;
  if(s-lp>170){pads.push({s,x:(Math.floor(rnd(s)*3)-1)*3.4});lp=s}else if(s-lb>150&&s-lp>50){blocks.push({s,x:(Math.floor(rnd(s+7)*3)-1)*3.4});lb=s}}})();

// ============ 3D RENDERER (camera space transform, near clipping, painter sort) ============
const NEAR=.3,FAR=250,DRAWN=125,G=[],D=[],O=[],cam={x:0,y:3.4,z:0,sn:0,cs:1,yaw:0,ss:0};let V;
function clip(t){const o=[];for(let i=0;i<t.length;i++){const a=t[i],b=t[(i+1)%t.length],ia=a[2]>=NEAR,ib=b[2]>=NEAR;if(ia)o.push(a);if(ia!==ib){const r=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r,NEAR])}}return o}
function face(list,pts,col,bias){const t=[];let near=false;for(const p of pts){const dx=p[0]-cam.x,dz=p[2]-cam.z,z=dx*cam.sn+dz*cam.cs;if(z<NEAR)near=true;t.push([dx*cam.cs-dz*cam.sn,p[1],z])}
 const q=near?clip(t):t;if(q.length<3)return;let s=0;for(const p of q)s+=p[2];s/=q.length;if(s<FAR)list.push({p:q,c:col,z:s-(bias||0)})}
// oriented box with back-face culling: w across (right axis), l along (forward axis)
function obox(list,x,y,z,yaw,w,h,l,c,top,side){const vx=cam.x-x,vz=cam.z-z,cz=-(vx*cam.sn+vz*cam.cs),cx=-(vx*cam.cs-vz*cam.sn),r=(w+l)/2;
 if(cz<-r-2||cz>FAR+r||Math.abs(cx)-r>cz*V.kx+3)return;
 const sn=Math.sin(yaw),cs=Math.cos(yaw),hw=w/2,hl=l/2,y2=y+h,P=(a,b,yy)=>[x+cs*a+sn*b,yy,z-sn*a+cs*b],fw=vx*sn+vz*cs,rt=vx*cs-vz*sn;side=side||shade(c,.8);
 const a1=P(-hw,-hl,y),a2=P(hw,-hl,y),a3=P(hw,hl,y),a4=P(-hw,hl,y),b1=P(-hw,-hl,y2),b2=P(hw,-hl,y2),b3=P(hw,hl,y2),b4=P(-hw,hl,y2);
 if(fw<-hl)face(list,[a1,a2,b2,b1],c);if(fw>hl)face(list,[a4,a3,b3,b4],c);if(rt<-hw)face(list,[a1,a4,b4,b1],side);if(rt>hw)face(list,[a2,a3,b3,b2],side);if(cam.y>y2)face(list,[b1,b2,b3,b4],top||shade(c,1.1))}
function drawList(list,v){for(const q of list){const p=q.p;ctx.beginPath();for(let i=0;i<p.length;i++){const k=v.f/p[i][2],X=v.cx+p[i][0]*k,Y=v.hy+(cam.y-p[i][1])*k;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.fillStyle=fog(q.c,q.z);ctx.fill()}}
const TP=(i,x,y)=>[TX[i]+NX[i]*x,y,TZ[i]+NZ[i]*x];
function TW(s,x,y){const[a,b]=toWorld(s,x);return[a,y,b]}
function framed(s,x,fn){const[wx,wz,a]=toWorld(s,x),sn=Math.sin(a),cs=Math.cos(a);fn((ar,bf,y,w,h,l,c,t,sd)=>obox(O,wx+cs*ar+sn*bf,y,wz-sn*ar+cs*bf,a,w,h,l,c,t,sd))}
const near=s=>{const d=md(s-cam.ss);return d<FAR||d>L-20};

function buildWorld(){const i0=Math.floor(md(cam.ss)/SEG)-2;
 for(let n=DRAWN;n>=0;n--){const i=((i0+n)%N+N)%N,j=(i+1)%N,far=n>70,q=(a,b,y,c)=>face(G,[TP(i,a,y),TP(j,a,y),TP(j,b,y),TP(i,b,y)],c);
  q(-HALF-3.4,-HALF,.05,'#82918e');q(HALF,HALF+3.4,.05,'#82918e');q(-HALF,HALF,0,(i>>1)%2?'#293c47':'#2c404b');
  if(far)continue;const kc=Math.abs(TK[i])>.012?(i%2?'#e8604c':'#f1eee2'):'#8aa5a1';
  q(-HALF-.45,-HALF,.06,kc);q(HALF,HALF+.45,.06,kc);q(-HALF+.2,-HALF+.32,.01,'#c9d3c6');q(HALF-.32,HALF-.2,.01,'#c9d3c6');
  if(i%6<3&&i>2)for(const l of[-1.733,1.733])q(l-.06,l+.06,.01,'#8faaa6');
  if(i<2)for(let a=0;a<12;a++)q(-HALF+a*HALF/6,-HALF+(a+1)*HALF/6,.012,(a+i)%2?'#233641':'#edf2d9')}
 for(const p of props){if(!near(p.s))continue;
  if(p.k===0){const{x,z,a,sd,l,d,h,c}=p,sn=Math.sin(a),cs=Math.cos(a),F=(ar,y,w,hh,ll,col,t)=>obox(O,x+cs*ar,y,z-sn*ar,a,w,hh,ll,col,t,shade(col,.85)),fr=-sd*d/2;
   obox(O,x,0,z,a,d,h,l,c,'#b2b7aa','#496573');
   if(md(p.s-cam.ss)<130){for(let r=3,k=0;r<h-1&&k<5;r+=2.8,k++)F(fr-sd*.02,r,.04,.2,l*.85,'#b6c6b2');F(fr-sd*.04,.25,.06,1.8,l*.74,'#284851');F(fr-sd*.35,2.1,.7,.17,l*.83,p.v?'#779993':'#c69276')}}
  else{const{x,z,a,sd}=p;obox(O,x,0,z,a,.12,4.6,.12,'#34505a');obox(O,x-Math.cos(a)*sd*.45,4.5,z+Math.sin(a)*sd*.45,a,.9,.09,.18,'#ddf5d0')}}
 if(near(0))framed(0,0,B=>{for(const sd of[-1,1])B(sd*(HALF+.9),0,0,.4,5.6,.4,'#d8e9be');B(0,0,4.6,2*HALF+2.2,1,.4,'#172b36');for(let a=-5;a<5;a++)B(a+.5,-.22,4.75,1,.6,.03,a%2?'#edff9c':'#203744')});
 for(const p of pads){if(!near(p.s))continue;const T=(b,a,y)=>TW(p.s+b,p.x+a,y);face(D,[T(-2.6,-1.15,.03),T(-2.6,1.15,.03),T(2.6,1.15,.03),T(2.6,-1.15,.03)],'#31576a');
  for(let j=0;j<3;j++){const b=-1.9+j*1.4;face(D,[T(b,-.8,.04),T(b+.6,0,.04),T(b,.8,.04),T(b+.35,.8,.04),T(b+.95,0,.04),T(b+.35,-.8,.04)],'#8ee7ff',.5)}
  framed(p.s,p.x,B=>{for(const sd of[-1,1])B(sd*1.3,0,0,.15,2.8,.28,'#385c6b');B(0,0,2.75,2.75,.22,.3,'#385c6b');B(0,-.17,2.78,2.5,.1,.04,'#8ee7ff')})}
 for(const b of blocks){if(!near(b.s))continue;framed(b.s,b.x,B=>{B(0,0,0,1.9,.25,.95,'#7e8c89');B(0,0,.25,1.8,.7,.55,'#ec9566','#f2bc87','#a26c56');for(const a of[-.6,0,.6])B(a,-.29,.42,.25,.28,.025,'#f4efd9');for(const a of[-.72,.72])B(a,0,.95,.12,.13,.12,Math.sin(clock*8)>0?'#ffe794':'#b8853e')})}
 for(const c of cars)if(near(c.s))drawCar(c)}

function drawCar(c){const[wx,wz,a0]=toWorld(c.s,c.x),yaw=a0+c.yo,m=MODELS[c.m],sn=Math.sin(yaw),cs=Math.cos(yaw),P=(ar,bf)=>[wx+cs*ar+sn*bf,wz-sn*ar+cs*bf];
 const B=(ar,bf,y,w,h,l,col,t,sd)=>{const[x,z]=P(ar,bf);obox(O,x,y,z,yaw,w,h,l,col,t,sd)},S=(ar,bf)=>{const[x,z]=P(ar,bf);return[x,.02,z]},k=m.l/1.65;
 face(D,[S(-.55,-.95*k),S(.55,-.95*k),S(.55,.95*k),S(-.55,.95*k)],'#1f3440',-1);
 for(const ar of[-1,1])for(const bf of[-.57*k,.55*k])B(ar*m.w*.48,bf,0,.2,.34,.38,'#172632');
 B(0,0,.2,m.w,m.h,m.l,c.col,shade(c.col,1.1),shade(c.col,.75));B(0,-.08,.2+m.h,m.w*.8,m.h*.65,m.l*.48,'#263e4d','#557482','#223c4c');
 for(const ar of[-1,1])B(ar*m.w*.33,-m.l/2-.01,.27,m.w*.22,.1,.03,c.br?'#ff3b2f':'#ff776c');
 if(c.m!==1)B(0,-m.l/2+.15,.32+m.h,m.w*.95,.05,.22,shade(c.col,.7));if(c.boost>0)for(const ar of[-.2,.2])B(ar,-m.l/2-.2,.24,.1,.07,.4,'#8ee7ff');
 if(c.h!=null&&c!==V.c)B(0,0,1.6+m.h+Math.sin(clock*4)*.1,.3,.3,.3,c.col)}

// ============ GAME DATA ============
const MODELS=[{name:'VECTOR',kind:'BALANCED',color:'#edff9c',w:.84,h:.38,l:1.65,top:1,acc:1,grip:1},
 {name:'MONOLITH',kind:'TORQUE · GRIP',color:'#e49b79',w:1,h:.6,l:1.7,top:.95,acc:1.16,grip:1.12},
 {name:'SPECTRE',kind:'TOP SPEED',color:'#b8a0f0',w:.72,h:.3,l:1.95,top:1.06,acc:.92,grip:.9}];
const AIN=['NOVA','EMBER','IRIS','ORBIT','DUNE','VEGA'],AIC=['#5fb7c9','#f4f1e6','#ffd27a','#d98aa7','#7fa7ff','#9fd39a'];
const VMAX=68,ACC=22,BRK=40,STEER=7.5,DRIFT=.17,DIFF=[{q:.6,v:.9,n:'Easy'},{q:.72,v:.95,n:'Medium'},{q:.84,v:.995,n:'Hard'}];
let mode=1,laps=3,diff=1,picks=[0,2],state='menu',demo=true,cars=[],humans=[],order=[],raceT=0,countT=0,goT=0,resT=0,clock=0;

function newRace(isDemo){demo=isDemo;cars=[];order=[];raceT=0;resT=0;goT=0;const nh=demo?0:mode,total=6;let ai=0;
 for(let k=0;k<total;k++){const h=k>=total-nh?k-(total-nh):null,m=h!=null?picks[h]:Math.floor(rnd(k*5+(demo?1:clock))*3);
