const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)},clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ============ TRACK (closed Catmull-Rom spline, resampled every SEG units) ============
const CP=[[0,-60],[0,60],[0,170],[12,240],[60,272],[140,276],[220,276],[285,262],[318,215],[320,160],[300,118],[322,76],[322,10],[322,-70],[308,-128],[262,-148],[200,-146],[150,-112],[100,-112],[66,-150],[58,-215],[34,-262],[-6,-272],[-30,-240],[0,-180]];

(function(){const raw=[],n=CP.length;for(let i=0;i<n;i++){const p0=CP[(i+n-1)%n],p1=CP[i],p2=CP[(i+1)%n],p3=CP[(i+2)%n];for(let j=0;j<60;j++){const t=j/60,t2=t*t,t3=t2*t;raw.push([0,1].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}

 if(Math.hypot(TX.at(-1)-TX[0],TZ.at(-1)-TZ[0])<1){TX.pop();TZ.pop()}
 const N=TX.length,K=[];for(let i=0;i<N;i++){const j=(i+1)%N;TA[i]=Math.atan2(TX[j]-TX[i],TZ[j]-TZ[i])}

 for(let i=0;i<N;i++){let s=0;for(let j=-4;j<=4;j++)s+=K[(i+j+N)%N];TK[i]=s/9}})();

// Static props: buildings, lamps (rejected if too close to any part of the track), boost pads, roadworks
const props=[],pads=[],blocks=[];
(function(){const shades=['#728b8e','#849797','#5c7782','#a4aaa0','#577180'];
 const clear=(x,z,a,hw,hl,m)=>{const sn=Math.sin(a),cs=Math.cos(a);for(let j=0;j<N;j++){const dx=TX[j]-x,dz=TZ[j]-z,la=Math.max(0,Math.abs(dx*cs-dz*sn)-hw),lb=Math.max(0,Math.abs(dx*sn+dz*cs)-hl);if(Math.hypot(la,lb)<m)return false}return true};
 for(let s=0,n=0;s<L;s+=13,n++)for(const sd of[-1,1]){const seed=n*3+sd*77,l=8+rnd(seed)*4,d=6+rnd(seed+1)*7,h=4+rnd(seed+2)*17,[x,z,a]=toWorld(s,sd*(HALF+3.6+d/2));if(clear(x,z,a,d/2,l/2,HALF+3.3))props.push({k:0,s,x,z,a,sd,l,d,h,c:shades[Math.floor(rnd(seed+3)*5)],v:n%3})}
 for(let s=6;s<L;s+=26)for(const sd of[-1,1]){const[x,z,a]=toWorld(s,sd*(HALF+1.1));if(clear(x,z,a,0,0,HALF+.9))props.push({k:1,s,x,z,a,sd})}
 for(let s=19;s<L;s+=26)for(const sd of[-1,1]){const[x,z,a]=toWorld(s,sd*(HALF+2.1));if(clear(x,z,a,.55,.55,HALF+1.3))props.push({k:2,s,x,z,a,sd})}

  if(s-lp>170){pads.push({s,x:(Math.floor(rnd(s)*3)-1)*3.4});lp=s}else if(s-lb>150&&s-lp>50){blocks.push({s,x:(Math.floor(rnd(s+7)*3)-1)*3.4});lb=s}}})();

// ============ 3D RENDERER (camera space transform, near clipping, painter sort) ============
const NEAR=.3,FAR=250,DRAWN=125,G=[],D=[],O=[],cam={x:0,y:3.4,z:0,sn:0,cs:1,yaw:0,ss:0};let V;
function clip(t){const o=[];for(let i=0;i<t.length;i++){const a=t[i],b=t[(i+1)%t.length],ia=a[2]>=NEAR,ib=b[2]>=NEAR;if(ia)o.push(a);if(ia!==ib){const r=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r,NEAR])}}return o}

 const a1=P(-hw,-hl,y),a2=P(hw,-hl,y),a3=P(hw,hl,y),a4=P(-hw,hl,y),b1=P(-hw,-hl,y2),b2=P(hw,-hl,y2),b3=P(hw,hl,y2),b4=P(-hw,hl,y2);
 if(fw<-hl)face(list,[a1,a2,b2,b1],c);if(fw>hl)face(list,[a4,a3,b3,b4],c);if(rt<-hw)face(list,[a1,a4,b4,b1],side);if(rt>hw)face(list,[a2,a3,b3,b2],side);if(cam.y>y2)face(list,[b1,b2,b3,b4],top||shade(c,1.1))}

function rbox(list,x,y,z,yaw,w,h,l,c,top){const vx=cam.x-x,vz=cam.z-z,cz=-(vx*cam.sn+vz*cam.cs),cx=-(vx*cam.cs-vz*cam.sn),r=(w+l)/2;

 for(let lv=0;lv<3;lv++)for(let j=0;j<20;j++){const k=(j+1)%20,p=R[lv][j],q=R[lv][k],u=R[lv+1][j],e1x=q[0]-p[0],e1y=q[1]-p[1],e1z=q[2]-p[2],e2x=u[0]-p[0],e2y=u[1]-p[1],e2z=u[2]-p[2];

  if(q)for(let i=0;i<5;i++)c.sp.push({x:q.X,y:q.Y,vx:(Math.random()-.5)*260+(c.sparkSide||1)*120,vy:-Math.random()*220-40,t:0,l:.25+Math.random()*.3})}

const TP=(i,x,y)=>[TX[i]+NX[i]*x,y,TZ[i]+NZ[i]*x];

const near=s=>{const d=md(s-cam.ss);return d<FAR||d>L-20};

function buildWorld(){const i0=Math.floor(md(cam.ss)/SEG)-2;
 for(let n=DRAWN;n>=0;n--){const i=((i0+n)%N+N)%N,j=(i+1)%N,far=n>70,q=(a,b,y,c)=>face(G,[TP(i,a,y),TP(j,a,y),TP(j,b,y),TP(i,b,y)],c);

// ============ PHYSICS / RACE LOGIC ============
function say(c,t,col){if(c.h!=null){c.msg=t;c.msgC=col;c.msgT=1.5}}
function hit(c,t){c.sparkT=.35;c.sparkSide=c.x>0?1:-1;if(c.h!=null){say(c,t,'#ff9984');c.shake=1;fx('hit')}}
function step(c,inp,dt){const m=MODELS[c.m];let top=VMAX*m.top;if(c.boost>0){top*=1.22;c.boost-=dt}
 let a=-(1.5+c.v*.045);if(inp.g)a+=ACC*m.acc*(1-c.v/top*.5);if(c.v>top)a-=(c.v-top)*1.2;if(inp.b)a-=BRK;if(Math.abs(c.x)>HALF&&c.v>24)a-=26;
 c.v=Math.max(0,c.v+a*dt);const drift=-kAt(c.s)*c.v*c.v*DRIFT/m.grip;c.x+=(inp.st*STEER*Math.min(1,c.v/16)+drift)*dt;
 const lim=HALF+1.5;if(Math.abs(c.x)>lim){c.x=Math.sign(c.x)*lim;if(c.v>22&&c.hitCD<=0){c.v*=.78;c.hitCD=.7;hit(c,'WALL!')}}
 c.yo+=(clamp(inp.st*.22-drift*.02,-.5,.5)-c.yo)*Math.min(1,dt*6);c.br=!!inp.b;c.p+=c.v*dt;c.s=md(c.p);c.hitCD-=dt;c.padCD-=dt;c.ctCD-=dt;c.msgT-=dt;c.shake=Math.max(0,c.shake-dt*2.5);
 for(const p of pads){const d=md(c.s-p.s+3)-3;if(d>-2.6&&d<2.6&&Math.abs(c.x-p.x)<1.4&&c.padCD<=0){c.boost=1.6;c.padCD=1;c.v+=8;say(c,'⚡ TURBO GATE','#8ee7ff');if(c.h!=null)fx('boost')}}
 for(const b of blocks){const d=md(c.s-b.s+3)-3;if(d>-1&&d<1&&Math.abs(c.x-b.x)<1.35&&c.hitCD<=0){c.v*=.45;c.hitCD=1;hit(c,'ROADWORKS!')}}
 const lp=Math.floor(c.p/L);if(lp>c.lap){c.lap=lp;if(lp>=1)c.best=Math.min(c.best,raceT-c.lapStart);c.lapStart=raceT;
  if(!demo&&lp>=laps&&!c.done){c.done=true;c.time=raceT;order.push(c);if(c.h!=null){say(c,'FINISHED '+ord(order.length),'#edff9c');fx('finish')}}
  else if(!demo&&lp>=1&&!c.done){say(c,lp===laps-1?'FINAL LAP!':'LAP '+(lp+1)+' / '+laps,'#edff9c');if(c.h!=null)fx('lap')}}}
function collide(){for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],d=md(b.s-a.s+L/2)-L/2,dx=b.x-a.x;
 if(Math.abs(d)<2.1&&Math.abs(dx)<1.15){const pu=(1.15-Math.abs(dx))/2*(dx>=0?1:-1);a.x-=pu;b.x+=pu;const bk=d>0?a:b,fr=d>0?b:a;
  if(bk.v>fr.v){const q=bk.v-fr.v;bk.v-=q*.5;fr.v+=q*.2}for(const c of[a,b])if(c.ctCD<=0&&dv(a,b)>3){c.ctCD=1.2;c.sparkT=.2;c.sparkSide=c===a?1:-1;say(c,'CONTACT!','#ff9984');if(c.h!=null)fx('bump')}}}}
const dv=(a,b)=>Math.abs(a.v-b.v);
function update(dt){clock+=dt;if(state==='pause')return;
 if(state==='count'){const n=Math.ceil(countT);countT-=dt;if(Math.ceil(countT)<n&&n>1)fx('beep');if(countT<=0){state='race';goT=1;fx('go')}}
 else{raceT+=dt;goT-=dt;for(const c of cars)step(c,(c.h!=null&&!c.done)?readInput(c.h):aiInput(c),dt);collide()}
 const sc=c=>c.done?1e9-order.indexOf(c):c.p;[...cars].sort((a,b)=>sc(b)-sc(a)).forEach((c,i)=>c.rank=i+1);
 if(state==='race'&&!demo&&humans.every(h=>h.done)&&(resT+=dt)>2.5)showResults()}

// ============ VIEW / HUD ============
const MM=(()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;for(let i=0;i<N;i++){a=Math.min(a,TX[i]);b=Math.max(b,TX[i]);c=Math.min(c,TZ[i]);d=Math.max(d,TZ[i])}return{a,b,c,d}})(),SUN=.7;
function views(){if(demo||mode===1)return[{x:0,y:0,w:W,h:H,c:demo?cars[0]:humans[0]}];
 return W>=H?[{x:0,y:0,w:W/2,h:H,c:humans[0]},{x:W/2,y:0,w:W/2,h:H,c:humans[1]}]:[{x:0,y:0,w:W,h:H/2,c:humans[0]},{x:0,y:H/2,w:W,h:H/2,c:humans[1]}]}
function render(){for(const v of views()){V=v;const c=v.c;v.f=Math.min(v.h*.9,v.w*.95);v.cx=v.x+v.w/2;v.hy=v.y+v.h*.4;v.kx=v.w/2/v.f;
 ctx.save();ctx.beginPath();ctx.rect(v.x,v.y,v.w,v.h);ctx.clip();if(c.shake>0)ctx.translate((Math.random()-.5)*c.shake*12,(Math.random()-.5)*c.shake*8);
 const back=7.2,p=at(c.s-back),lat=c.x*.7;cam.x=p.x+Math.cos(p.a)*lat;cam.z=p.z-Math.sin(p.a)*lat;cam.ss=c.s-back;const[tx,tz]=toWorld(c.s+5,c.x*.85);cam.yaw=Math.atan2(tx-cam.x,tz-cam.z);cam.sn=Math.sin(cam.yaw);cam.cs=Math.cos(cam.yaw);
 v.sun=null;sky(v);G.length=D.length=O.length=GL.length=0;buildWorld();drawList(G,v);D.sort((a,b)=>b.z-a.z);drawList(D,v);O.sort((a,b)=>b.z-a.z);drawList(O,v);drawGlows(v);sparksFor(c,v);drawFlare(v);
 const vg=ctx.createLinearGradient(0,v.y+v.h*.65,0,v.y+v.h);vg.addColorStop(0,'#10202d00');vg.addColorStop(1,'#10202d99');ctx.fillStyle=vg;ctx.fillRect(v.x,v.y+v.h*.65,v.w,v.h*.35);
 if(c.boost>0||c.v>60){ctx.strokeStyle=c.boost>0?'#8ee7ff70':'#eaffdb40';ctx.lineWidth=1.5;for(let i=0;i<12;i++){const sd=i%2?1:-1,xx=v.cx+sd*(v.w*.28+rnd(i)*v.w*.22),yy=v.y+v.h*.5+((clock*c.v/60+rnd(i+2))%1)*v.h*.5;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+sd*20,yy+45);ctx.stroke()}}
 if(!demo)hud(v,c);ctx.restore()}
 if(views().length>1){ctx.fillStyle='#101823';W>=H?ctx.fillRect(W/2-2,0,4,H):ctx.fillRect(0,H/2-2,W,4)}}
function sky(v){const g=ctx.createLinearGradient(0,v.y,0,v.hy);g.addColorStop(0,'#617f92');g.addColorStop(.6,'#e0b5a0');g.addColorStop(1,'#edccaa');ctx.fillStyle=g;ctx.fillRect(v.x,v.y,v.w,v.hy-v.y+1);
 const r=wrapA(SUN-cam.yaw);if(Math.abs(r)<1.2){const sx=v.cx+Math.tan(r)*v.f,sy=v.hy-v.h*.13,R=v.h*.3,hl=ctx.createRadialGradient(sx,sy,R*.1,sx,sy,R);hl.addColorStop(0,'#ffdfaa70');hl.addColorStop(1,'#ffdfaa00');ctx.fillStyle=hl;ctx.fillRect(sx-R,sy-R,R*2,R*2);v.sun={x:sx,y:sy};ctx.fillStyle='#f8dbad';ctx.beginPath();ctx.arc(sx,sy,v.h*.07,0,7);ctx.fill()}
 for(let i=0;i<90;i++){const rr=wrapA(i/90*Math.PI*2-cam.yaw);if(Math.abs(rr)>1.15)continue;const X=v.cx+Math.tan(rr)*v.f,bw=v.f*.075,bh=v.h*(.025+rnd(i+900)*.1);ctx.fillStyle=i%2?'#82908e':'#76868b';ctx.fillRect(X,v.hy-bh,bw,bh+1);if(i%5===0)ctx.fillRect(X+bw*.4,v.hy-bh-12,2,12)}
 ctx.fillStyle='#344a53';ctx.fillRect(v.x,v.hy,v.w,v.h)}
function txt(t,x,y,size,col,align,w){ctx.font=(w||700)+' '+size+'px Arial';ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.fillText(t,x,y)}
function hud(v,c){const s=clamp(Math.min(v.w/760,v.h/520),.6,1.2),pd=18*s,x0=v.x+pd,y0=v.y+pd,x1=v.x+v.w-pd,y1=v.y+v.h-pd;ctx.textBaseline='top';ctx.shadowColor='#0c1720aa';ctx.shadowBlur=8;
 if(mode>1){ctx.fillStyle=c.col;ctx.fillRect(x0,y0,34*s,18*s);txt('P'+(c.h+1),x0+17*s,y0+3*s,12*s,'#172227','center',900)}
 const ty=y0+(mode>1?26*s:0);txt(ord(c.rank),x0,ty,50*s,'#f7f5ee','left',900);ctx.font='900 '+50*s+'px Arial';const rw=ctx.measureText(ord(c.rank)).width;txt('/ '+cars.length,x0+rw+6*s,ty+26*s,14*s,'#bec8cd');
 txt(c.done?'FINISHED':'LAP '+clamp(c.lap+1,1,laps)+' / '+laps,x0,ty+58*s,13*s,'#edff9c','left',700);
 txt(fmt(state==='count'?0:raceT),x1,y0,24*s,'#f7f5ee','right',700);txt('LAP '+fmt(c.lap>=0&&state!=='count'?raceT-c.lapStart:0)+'   BEST '+fmt(c.best),x1,y0+30*s,11*s,'#bec8cd','right',400);
 const kmh=Math.round(c.v*3.6),by=y1-46*s;txt(kmh,x0,by,40*s,'#f7f5ee','left',900);ctx.font='900 '+40*s+'px Arial';txt('KM/H',x0+ctx.measureText(kmh).width+6*s,by+24*s,10*s,'#bec8cd');
 ctx.shadowBlur=0;ctx.fillStyle='#ffffff25';ctx.fillRect(x0,y1-4*s,170*s,4*s);ctx.fillStyle=c.boost>0?'#8ee7ff':'#edff9c';ctx.fillRect(x0,y1-4*s,170*s*clamp(c.v/90,0,1),4*s);
 const ms=Math.min(150*s,v.w*.28),mx=x1-ms,my=y1-ms,sc=ms/Math.max(MM.b-MM.a,MM.d-MM.c),X=px=>mx+(px-MM.a)*sc+(ms-(MM.b-MM.a)*sc)/2,Y=pz=>my+ms-(pz-MM.c)*sc;
 ctx.beginPath();for(let i=0;i<=N;i+=4){const k=i%N;i?ctx.lineTo(X(TX[k]),Y(TZ[k])):ctx.moveTo(X(TX[k]),Y(TZ[k]))}ctx.closePath();ctx.lineJoin='round';ctx.strokeStyle='#10182380';ctx.lineWidth=7*s;ctx.stroke();ctx.strokeStyle='#d6e2dc';ctx.lineWidth=2.5*s;ctx.stroke();
 ctx.fillStyle='#edff9c';ctx.fillRect(X(TX[0])-5*s,Y(TZ[0])-1.5*s,10*s,3*s);
 for(const o of[...cars].sort((a,b)=>(a===c)-(b===c))){const[wx,wz]=toWorld(o.s,o.x),r=(o.h!=null?5:3.5)*s;ctx.beginPath();ctx.arc(X(wx),Y(wz),r,0,7);ctx.fillStyle=o.col;ctx.fill();if(o===c){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
 ctx.shadowBlur=8;if(c.msgT>0){ctx.globalAlpha=clamp(c.msgT*2,0,1);txt(c.msg,v.cx,v.y+v.h*.2,18*s,c.msgC,'center',900);ctx.globalAlpha=1}
 if(state==='count'||goT>0){const n=Math.ceil(countT),t=state==='count'?(n>3?'':String(n)):'GO!';if(t)txt(t,v.cx,v.y+v.h*.24,96*s,state==='count'?'#f7f5ee':'#edff9c','center',900)}
 if(c.done&&humans.some(h=>!h.done))txt('WAITING FOR THE OTHER DRIVER…',v.cx,v.y+v.h*.3,13*s,'#bec8cd','center');ctx.shadowBlur=0}

// ============ AUDIO (Web Audio, no files) ============
let AC=null,master,engines=[],audioOn=true,nextBeat=0,beat=0,noiseBuf;
function initAudio(){if(AC){AC.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=audioOn?.22:0;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
 for(let i=0;i<2;i++){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=520;g.gain.value=0;o.connect(f);f.connect(g);g.connect(master);o.start();engines.push({o,g})}
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function toggleAudio(){initAudio();audioOn=!audioOn;if(master)master.gain.setTargetAtTime(audioOn?.22:0,AC.currentTime,.04);refreshMenu()}
function tone(f,dur,type,vol,when,end){if(!AC||!audioOn)return;const t=when??AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function perc(t,dur,vol,cut){if(!AC||!audioOn)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.01)}
function fx(k){if(!AC||!audioOn)return;const t=AC.currentTime;if(k==='hit'){tone(110,.23,'sawtooth',.45,t,28);perc(t,.18,.3,200)}else if(k==='bump')tone(90,.12,'square',.2,t,40);else if(k==='boost')tone(190,.42,'triangle',.25,t,650);
 else if(k==='beep')tone(440,.18,'square',.15);else if(k==='go')tone(880,.4,'square',.18);else if(k==='lap')[523,659].forEach((f,i)=>tone(f,.25,'triangle',.2,t+i*.1));else if(k==='finish')[261.63,329.63,392,523.25].forEach((f,i)=>tone(f,.55,'triangle',.22,t+i*.15))}
function tickAudio(){if(!AC)return;const t=AC.currentTime;engines.forEach((e,i)=>{const c=demo?(i?null:cars[0]):humans[i];e.o.frequency.setTargetAtTime(c?34+c.v*3.6*.7:30,t,.08);e.g.gain.setTargetAtTime(c&&state!=='pause'?(demo?.012:.04):0,t,.15)});
 if(!audioOn||demo||state==='pause'){nextBeat=t+.1;return}if(nextBeat<t-.2)nextBeat=t;
 const chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],hook=[0,7,12,7,3,7,10,7,0,7,15,12,10,7,3,7],hz=n=>440*Math.pow(2,(n-69)/12);
 while(nextBeat<t+.12){const b=nextBeat,st=beat%16,bar=Math.floor(beat/16),ch=chords[Math.floor(bar/2)%4],brk=bar%16===12||bar%16===13;
  if(!brk&&st%4===0){tone(155,.22,'sine',.6,b,39);perc(b,.018,.12,1600)}if(!brk&&(st===4||st===12))perc(b,.14,.24,1300);if(st%2===0)perc(b,st%4===2?.1:.035,st%4===2?.09:.05,6500);
  if(!brk&&[0,3,6,8,10,14].includes(st)){const f=hz(ch[0]-24+(st===14?12:0));tone(f,.18,'sawtooth',.06,b);tone(f,.19,'sine',.17,b)}
  if(st===2||st===10)ch.forEach(n=>tone(hz(n),brk?.65:.25,'triangle',.06,b));if(st%2===0){tone(hz(ch[0]+12+hook[(st+bar%2*4)%16]),.13,'triangle',.09,b)}beat++;nextBeat+=60/138/4}}

// ============ MENU / FLOW ============
// icona del menu: vista laterale della mesh 3D (facce rivolte a destra, dalla piu' lontana alla piu' vicina)
const carSVG=(m,i)=>{const d=CARS3D[i],v=d.v,cl=carMesh(i,m.color),F=[];
 d.f.forEach((f,n)=>{if(f[1]<=.05)return;let a=0,pts='';for(let q=4;q<f.length;q++){const k=f[q]*3;a+=v[k];pts+=(65+v[k+2]*100).toFixed(1)+','+(46-v[k+1]*100).toFixed(1)+' '}F.push([a/(f.length-4),`<polygon points="${pts}" fill="${cl[n]}"/>`])});
 return `<svg viewBox="0 0 130 55"><ellipse cx="65" cy="46" rx="52" ry="5" fill="#0005"/>${F.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join('')}</svg><strong>${m.name}</strong><small>${m.kind}</small>`};
function opts(id,items,get,set,cls){const el=$(id);el.innerHTML='';items.forEach((h,i)=>{const b=document.createElement('button');b.className=(cls||'opt')+(get()===i?' on':'');b.innerHTML=h;b.onclick=()=>{set(i);initAudio();refreshMenu()};el.appendChild(b)})}
function refreshMenu(){opts('modeRow',['1 PLAYER','2 PLAYERS'],()=>mode-1,i=>mode=i+1);opts('cars0',MODELS.map(carSVG),()=>picks[0],i=>picks[0]=i,'car');opts('cars1',MODELS.map(carSVG),()=>picks[1],i=>picks[1]=i,'car');
 opts('lapRow',['3','5','8'],()=>[3,5,8].indexOf(laps),i=>laps=[3,5,8][i]);opts('diffRow',DIFF.map(d=>d.n),()=>diff,i=>diff=i);
 $('p2box').classList.toggle('hidden',mode<2);$('p1lbl').textContent=mode>1?'P1 · CAR':'CAR';
 const k=(...a)=>a.map(x=>`<span class="key">${x}</span>`).join(' ');
 $('help').innerHTML=(mode>1?`P1 ${k('W','A','S','D')} &nbsp;·&nbsp; P2 ${k('↑','←','↓','→')}`:`${k('W','A','S','D')} or ${k('↑','←','↓','→')} &nbsp;throttle · steer · brake`)+`<br>${k('Esc')} pause · ${k('M')} audio ${audioOn?'ON':'OFF'} · gamepads supported<br>Brake before corners or you'll run wide. Blue gates = turbo.`}
function startRace(){$('menu').classList.add('hidden');$('results').classList.add('hidden');newRace(false);state='count';countT=3.6;$('touch').classList.toggle('hidden',!(matchMedia('(pointer:coarse)').matches&&mode===1));cv.focus()}
function toMenu(){state='menu';newRace(true);['pause','results','touch'].forEach(i=>$(i).classList.add('hidden'));$('menu').classList.remove('hidden');refreshMenu()}
function setPause(on){if(on){state='pause';$('pause').classList.remove('hidden')}else{state=countT>0?'count':'race';$('pause').classList.add('hidden')}}
function showResults(){state='results';const rest=cars.filter(c=>!c.done).sort((a,b)=>b.p-a.p),win=order[0];
 const rows=[...order,...rest].map((c,i)=>`<tr><td>${ord(i+1)}</td><td style="color:${c.col};font-weight:700">${c.name}</td><td>${fmt(c.best)}</td><td>${c.done?(c===win?fmt(c.time):'+'+(c.time-win.time).toFixed(1)+'s'):'racing'}</td></tr>`).join('');
 const hs=humans.map(h=>h.rank),title=mode>1?(order[0].h!=null?order[0].name+' wins!':humans[0].rank<humans[1].rank?'P1 beats P2':'P2 beats P1'):ord(hs[0])+' place';
 $('results').innerHTML=`<div class="box"><div class="eyebrow">FINISH · ${laps} LAPS</div><h1>${title}</h1><table><tr><td></td><td>DRIVER</td><td>BEST LAP</td><td>TIME</td></tr>${rows}</table><button class="start" id="again">REMATCH <span>↻</span></button><button class="start ghost" id="back">MENU <span>↩</span></button></div>`;
 $('results').classList.remove('hidden');$('touch').classList.add('hidden');$('again').onclick=startRace;$('back').onclick=toMenu}
$('start').onclick=startRace;$('resume').onclick=()=>setPause(false);$('quit').onclick=toMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='race'||state==='count'))setPause(true)});
toMenu();
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;update(dt);render();tickAudio();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
