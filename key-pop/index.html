<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ff9ec9;font-family:Fredoka,'Arial Rounded MT Bold',system-ui,sans-serif;color:#3b2466;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#menu{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;padding:20px 16px 40px;background:radial-gradient(900px 500px at 10% 0%,#fff6a8 0%,transparent 60%),radial-gradient(800px 600px at 100% 30%,#9fe6ff 0%,transparent 60%),radial-gradient(900px 700px at 40% 110%,#c7a6ff 0%,transparent 60%),#ff9ec9}
.wrap{width:min(980px,100%)}
.title{font-size:clamp(54px,10vw,104px);font-weight:700;line-height:.95;margin:6px 0 4px;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:0 .06em;text-shadow:0 .06em 0 #e2508f,0 .12em .2em #0003}
.title span{display:inline-block;animation:jig 2.2s ease-in-out infinite}
.title .em{font-size:.8em;margin-left:.15em;text-shadow:none;filter:drop-shadow(0 6px 8px #0003)}
@keyframes jig{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.08em) rotate(-4deg)}60%{transform:translateY(.02em) rotate(3deg)}}
.sub{font-size:18px;margin:6px 0 20px;font-weight:500;color:#5a2d6e;max-width:640px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.dom{position:relative;border-radius:24px;padding:14px 10px 12px;text-align:center;color:#fff;border:4px solid #ffffff00;box-shadow:inset 0 -8px 0 #0002,0 8px 18px #0002;transition:transform .15s,border-color .15s,filter .15s;filter:saturate(.75) brightness(.97)}
.dom:hover{transform:translateY(-3px)}
.dom.on{border-color:#fff;transform:scale(1.04);filter:none}
.dom .ic{font-size:46px;line-height:1.1;display:block;filter:drop-shadow(0 4px 4px #0003)}
.dom .ic small{font-size:26px}
.dom b{display:block;font-size:18px;font-weight:600;margin-top:4px;text-shadow:0 2px 0 #0003}
.dom .ck{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:#ffffff55;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff}
.dom.on .ck{background:#fff;color:#e2508f}
.row{position:sticky;bottom:-40px;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px -12px 0;padding:12px;border-radius:28px;background:#ffd6ea;box-shadow:0 -6px 20px #0001}
.chip{background:#ffffffb0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;box-shadow:0 4px 10px #0001}
.chip.on{background:#fff;box-shadow:0 0 0 3px #e2508f inset}
.go{margin-left:auto;background:linear-gradient(180deg,#ffe14d,#ffb01f);color:#5a2d00;font-weight:700;font-size:28px;padding:14px 34px;border-radius:999px;box-shadow:0 8px 0 #d9861a,0 14px 24px #0003;transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 #d9861a}
.go:disabled{filter:grayscale(1);opacity:.6}
.note{margin-top:22px;font-size:14px;color:#5a2d6e;line-height:1.55;background:#ffffff70;border-radius:18px;padding:12px 16px}
.note a{color:#7a2d8e}
#home{position:absolute;top:12px;left:12px;width:58px;height:58px;border-radius:50%;background:#ffffff80;font-size:28px;display:grid;place-items:center;z-index:5;box-shadow:0 4px 12px #0002}
#home svg{position:absolute;inset:0;transform:rotate(-90deg)}
#home circle{fill:none;stroke:#e2508f;stroke-width:5;stroke-dasharray:170;stroke-dashoffset:170;stroke-linecap:round}
#hint{position:absolute;left:78px;top:26px;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 3px #0005;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:18px 0 0}
.opt{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;letter-spacing:2px;font-weight:600;text-transform:uppercase;color:#5a2d6e}
.seg{display:inline-flex;flex-wrap:wrap;background:#ffffff80;border-radius:999px;padding:4px;gap:2px;box-shadow:0 4px 10px #0001}
.seg button{border-radius:999px;padding:8px 13px;font-weight:600;font-size:15px;color:#5a2d6e}
.seg button.on{background:#fff;color:#e2508f;box-shadow:0 2px 6px #0002}
.ohint{margin:10px 0 0;font-size:14.5px;color:#5a2d6e;line-height:1.45;min-height:1.4em}
#timer{position:absolute;top:22px;right:16px;z-index:5;font-size:14px;font-weight:600;color:#fff;background:#3b246655;border-radius:999px;padding:6px 12px;pointer-events:none}

 // name ribbon
 const nt=t-1;if(nt>0){const k=elastic(nt/.8);ctx.save();ctx.translate(0,h/2+fr*.2);ctx.rotate(.03);ctx.scale(k,k);const fs=Math.max(26,h*.09);ctx.font=`700 ${fs}px Fredoka,system-ui,sans-serif`;const tw=ctx.measureText(nm(P.it)).width+fs*1.3;
  ctx.shadowColor='rgba(40,10,60,.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;ctx.fillStyle='#ffe14d';rr(ctx,-tw/2,-fs*.75,tw,fs*1.5,fs*.75);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle='#5a2d6e';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nm(P.it),0,fs*.05);ctx.restore()}
 ctx.restore()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- background ---------- */
const blobs=[...Array(9)].map(()=>({x:Math.random(),y:Math.random(),r:rnd(.12,.3),sp:rnd(.02,.06),ph:rnd(0,6)}));
function drawBg(){const ds=domColors();const i=Math.floor(T/8)%ds.length,j=(i+1)%ds.length,k=clamp((T%8-6)/2,0,1);
 const a=mix(ds[i].bg[0],ds[j].bg[0],k),b=mix(ds[i].bg[1],ds[j].bg[1],k);
 const g=ctx.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(T<disco){const h=(T*240)%360;ctx.fillStyle=`hsla(${h},95%,62%,.7)`;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.25;for(let k=0;k<8;k++){ctx.fillStyle=`hsl(${(h+k*45)%360},90%,65%)`;ctx.beginPath();const a2=T*1.5+k*Math.PI/4;ctx.moveTo(W/2,-20);ctx.lineTo(W/2+Math.cos(a2)*W*1.5,H*1.5);ctx.lineTo(W/2+Math.cos(a2+.12)*W*1.5,H*1.5);ctx.fill()}ctx.restore()}
 ctx.fillStyle='rgba(255,255,255,.14)';blobs.forEach(o=>{const x=(o.x+Math.sin(T*o.sp+o.ph)*.1)*W,y=(o.y+Math.cos(T*o.sp*1.3+o.ph)*.1)*H;ctx.beginPath();ctx.arc(x,y,o.r*Math.min(W,H),0,7);ctx.fill()})}
function mix(a,b,k){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)*(1-k)+(pb>>16)*k)|0,g=(((pa>>8)&255)*(1-k)+((pb>>8)&255)*k)|0,bl=((pa&255)*(1-k)+(pb&255)*k)|0;return `rgb(${r},${g},${bl})`}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!playing)return;T+=dt;
 nightTick();
 for(let i=timers.length-1;i>=0;i--)if(T>=timers[i].at){const f=timers[i].fn;timers.splice(i,1);f()}
 fx=fx.filter(f=>!(f.update&&f.update(dt)));
 // particles
 parts.forEach(p=>{if(p.orb)return;
  if(p.tgt){p.vx+=((p.tgt[0]-p.x)*30-p.vx*7)*dt;p.vy+=((p.tgt[1]-p.y)*30-p.vy*7)*dt;p.rot*=.9}
  else if(p.grav){p.vy+=p.grav*dt;const fl=H-p.s*.45;if(p.y>fl&&p.vy>0){p.y=fl;p.vy*=-p.bounce;p.vx*=.8;if(Math.abs(p.vy)>200&&p.s>50&&Math.random()<.3)pop(Math.random()*8|0)}}
  else if(!p.giant){p.vx*=Math.pow(.6,dt);p.vy=p.vy*Math.pow(.6,dt)+(p.bubble?0:Math.sin(T*1.5+p.wob)*8*dt);if(p.bubble){p.vy=Math.min(p.vy,-70);p.vx+=Math.sin(T*2+p.wob)*30*dt}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.tgt&&!p.giant&&!p.keep)p.rot+=p.vr*dt*.4;
  if(!p.grav&&!p.tgt&&!p.keep&&!p.giant){if(p.x<p.s/2){p.x=p.s/2;p.vx=Math.abs(p.vx)}if(p.x>W-p.s/2){p.x=W-p.s/2;p.vx=-Math.abs(p.vx)}}
  if(p.bubble&&p.y<-p.s)p.life=0});
 parts=parts.filter(p=>T-p.born<p.life&&p.y<H+400&&p.x>-600&&p.x<W+600);
 bits.forEach(b=>{b.vy+=700*dt;b.vx*=Math.pow(.4,dt);b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt});bits=bits.filter(b=>T-b.born<b.life);
 rings=rings.filter(r=>T-r.born<.5);letters=letters.filter(l=>T-l.born<1);
 // draw
 drawBg();fx.forEach(f=>f.draw&&f.draw());
 rings.forEach(r=>{const k=(T-r.born)/.5;ctx.strokeStyle=r.c;ctx.globalAlpha=1-k;ctx.lineWidth=8*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r*(.4+easeOut(k)),0,7);ctx.stroke();ctx.globalAlpha=1});
 letters.forEach(l=>{const k=(T-l.born);const fs=Math.min(W,H)*.22*(.8+elastic(k*2)*.3);ctx.save();ctx.globalAlpha=clamp(1-k,0,1)*.9;ctx.font=`700 ${fs}px Fredoka,system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=fs*.08;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(l.t,l.x,l.y-k*40);ctx.fillStyle=l.c;ctx.fillText(l.t,l.x,l.y-k*40);ctx.restore()});
 if(pc)drawPaperCut();
 const dz=T<disco;
 parts.forEach(p=>{const age=T-p.born,left=p.life-age;let sc=elastic(age/.6);const fd=p.fade||.5;if(left<fd)sc*=clamp(left/fd,0,1);if(sc<=0)return;
  let rot=p.rot,sx=1,sy=1;
  if(p.giant){rot=Math.sin(age*5)*.15;sx=1+Math.sin(age*9)*.06;sy=1-Math.sin(age*9)*.06}
  else if(dz){rot+=Math.sin(T*10+p.wob)*.35;const b=1+Math.abs(Math.sin(T*10+p.wob))*.18;sx*=b;sy*=2-b}
  else if(p.grav){const sq=clamp(Math.abs(p.vy)/1500,0,.2);sx=1-sq*.5;sy=1+sq}
  const s=p.s*sc;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot);ctx.scale(sx,sy);ctx.drawImage(spr(p.e),-s*.62,-s*.62,s*1.24,s*1.24);
  if(p.bubble){const R=s*.62;const g=ctx.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.6,'rgba(200,240,255,.12)');g.addColorStop(1,'rgba(255,255,255,.5)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.stroke()}
  ctx.restore()});
 bits.forEach(b=>{const k=1-(T-b.born)/b.life;ctx.save();ctx.globalAlpha=clamp(k*1.5,0,1);ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;if(b.star){ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=i%2?b.s*.4:b.s;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.fill()}else ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);ctx.restore()});
 if(wind>0||sleeping)drawNight();
 if(T-lastKeyT>5&&!pc&&!fx.length&&parts.length<6&&!wind&&!sleeping){const k=(Math.sin(T*3)+1)/2;ctx.save();ctx.font=`700 ${Math.min(W*.08,64)}px Fredoka,system-ui,sans-serif`;ctx.textAlign='center';ctx.lineWidth=10;ctx.lineJoin='round';ctx.strokeStyle='rgba(90,45,110,.35)';ctx.fillStyle='#fff';ctx.globalAlpha=.6+k*.4;const y=H*.5+k*8;ctx.strokeText(L('press'),W/2,y);ctx.fillText(L('press'),W/2,y);ctx.restore()}
}
requestAnimationFrame(frame);

/* ---------- goodnight ---------- */
const STARS=[...Array(80)].map(()=>({x:Math.random(),y:Math.random()*.8,r:rnd(1,2.8),p:rnd(0,6)}));
const timerEl=document.getElementById('timer');let timerTxt='';
function nightTick(){if(!nightEnd||sleeping)return;const left=(nightEnd-Date.now())/1000;wind=clamp(1-left/60,0,1);
 const t=left>60?`🌙 ${Math.ceil(left/60)}′`:`🌙 ${Math.max(0,Math.ceil(left))}″`;if(t!==timerTxt){timerTxt=t;timerEl.textContent=t}
 if(left<=0)goSleep()}
function goSleep(){sleeping=true;wind=1;sleepT0=T;pc=null;fx=[];timers=[];disco=0;timerEl.classList.add('hidden');
 parts.forEach(p=>{p.orb=null;p.tgt=null;p.grav=0;p.bubble=false;p.giant=false;p.keep=false;p.vx*=.1;p.vy=rnd(15,40);p.fade=3;p.life=T-p.born+rnd(3,7)});
 lullaby();after(2.2,()=>say(L('gn')))}
function drawNight(){const s=sleeping?easeOut((T-sleepT0)/4):0;
 ctx.fillStyle=`rgba(18,16,64,${.45*wind+.5*s})`;ctx.fillRect(0,0,W,H);
 const sa=Math.max(wind*.35,s);ctx.fillStyle='#fff6c8';STARS.forEach(o=>{ctx.globalAlpha=sa*(.45+.55*Math.sin(T*1.6+o.p)**2);ctx.beginPath();ctx.arc(o.x*W,o.y*H,o.r,0,7);ctx.fill()});ctx.globalAlpha=1;
 if(!sleeping)return;const k=easeOut((T-sleepT0-1)/3);if(k<=0)return;
 const ms=Math.min(W,H)*.3,my=H*.34+Math.sin(T*.8)*8;ctx.save();ctx.globalAlpha=k;ctx.shadowColor='rgba(255,240,170,.6)';ctx.shadowBlur=60;ctx.drawImage(spr('🌙'),W/2-ms*.62,my-ms*.62,ms*1.24,ms*1.24);ctx.restore();
 const z=(T*.5)%3;ctx.save();ctx.globalAlpha=k*clamp(1-z/3,0,1);ctx.font=`700 ${ms*.18}px Fredoka,system-ui,sans-serif`;ctx.fillStyle='#e8e4ff';ctx.fillText('z',W/2+ms*.45+z*20,my-ms*.25-z*40);ctx.font=`700 ${ms*.13}px Fredoka,system-ui,sans-serif`;ctx.fillText('z',W/2+ms*.35+z*14,my-ms*.1-z*28);ctx.restore();
 ctx.save();ctx.globalAlpha=k;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='rgba(180,170,255,.7)';ctx.shadowBlur=24;
 ctx.font=`700 ${Math.min(W*.11,86)}px Fredoka,system-ui,sans-serif`;ctx.fillText(L('gn'),W/2,H*.64);
 ctx.font=`600 ${Math.min(W*.06,38)}px Fredoka,system-ui,sans-serif`;ctx.globalAlpha=k*.85;ctx.fillText(L('gn2'),W/2,H*.64+Math.min(W*.11,86)*.85);
 ctx.shadowBlur=0;ctx.globalAlpha=k*.45;ctx.font=`500 15px Fredoka,system-ui,sans-serif`;ctx.fillText(L('parent'),W/2,H-28);ctx.restore()}

/* ---------- input ---------- */
addEventListener('keydown',e=>{if(!playing)return;e.preventDefault();if(sleeping)return;ac();
 if(e.repeat){if(T-lastRepeat<(mode==='calm'?.3:.12))return;lastRepeat=T}
 const kp=keyPos(e.code);const lab=e.key&&e.key.length===1&&e.key!==' '?e.key.toUpperCase():null;hit(kp.x,kp.y,kp.i,lab)},{capture:true});
addEventListener('keyup',e=>{if(playing)e.preventDefault()},{capture:true});
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!playing||sleeping)return;ac();const b=parts.slice().reverse().find(p=>p.bubble&&Math.hypot(p.x-e.clientX,p.y-e.clientY)<p.s*.6);if(b){popBubble(b);return}
 hit(e.clientX,e.clientY,Math.floor(e.clientX/W*12),null);drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(!drag||sleeping)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>90){drag={x:e.clientX,y:e.clientY};spawn({x:e.clientX,y:e.clientY,s:rnd(45,70),life:3});pop(Math.floor(e.clientX/W*12))}});
addEventListener('pointerup',()=>drag=null);addEventListener('contextmenu',e=>{if(playing)e.preventDefault()});

const home=document.getElementById('home'),hint=document.getElementById('hint'),hc=home.querySelector('circle');let holdT=null,holdRaf=0;
function holdStart(e){e.preventDefault();e.stopPropagation();const t0=performance.now();hint.style.opacity=1;
 const step=()=>{const k=(performance.now()-t0)/1000;hc.style.strokeDashoffset=170*(1-Math.min(1,k));if(k>=1){holdEnd();stop();return}holdRaf=requestAnimationFrame(step)};step()}
function holdEnd(){cancelAnimationFrame(holdRaf);hc.style.strokeDashoffset=170;setTimeout(()=>hint.style.opacity=0,900)}
home.addEventListener('pointerdown',holdStart);home.addEventListener('pointerup',holdEnd);home.addEventListener('pointerleave',holdEnd);

function start(){if(!sel.size)return;pool=DOMAINS.filter(d=>sel.has(d.id)).flatMap(d=>d.items);ac();
 parts=[];bits=[];fx=[];timers=[];pc=null;letters=[];rings=[];presses=sinceFx=0;sinceSpecial=10;T=0;lastKeyT=-9;disco=0;
 sleeping=false;wind=0;nightEnd=nightMin?Date.now()+nightMin*60000:0;timerTxt='';timerEl.textContent='';timerEl.classList.toggle('hidden',!nightMin);
 document.getElementById('menu').classList.add('hidden');home.classList.remove('hidden');playing=true;
 const de=document.documentElement;try{const r=de.requestFullscreen&&de.requestFullscreen({navigationUI:'hide'});if(r&&r.then)r.then(()=>{if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock().catch(()=>{})}).catch(()=>{})}catch(e){}
 pool.slice(0,40).forEach(it=>spr(it.e));arp(true,6,.06);
 for(let k=0;k<5;k++)after(.15+k*.12,()=>spawn({x:W*(.2+k*.15),y:H*.5+rnd(-40,40),s:Math.min(W,H)*.13}))}
function stop(){playing=false;try{navigator.keyboard&&navigator.keyboard.unlock&&navigator.keyboard.unlock()}catch(e){}try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
 sleeping=false;wind=0;nightEnd=0;timerEl.classList.add('hidden');try{speechSynthesis.cancel()}catch(e){}document.getElementById('menu').classList.remove('hidden');home.classList.add('hidden');ctx.clearRect(0,0,W,H)}
goBtn.onclick=start;
// debug hooks for testing
window.__kp={sleep:(sec)=>{nightEnd=Date.now()+sec*1000},paperCut:(d)=>{const D=DOMAINS.find(x=>x.id===d);paperCut(D?pick(D.items):undefined)},fx:(n)=>{const f=EFFECTS.find(f=>f.name===n);f&&f(parts[parts.length-1]||spawn({}))}};
</script>
