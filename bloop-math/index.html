<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;uniform float uPx;uniform float uTime;uniform int uN;uniform int uTheme;uniform float uDark;uniform vec2 uShake;
uniform vec4 uB[48];uniform vec4 uC[48];uniform vec4 uS[48];uniform vec4 uRip[4];
const float T=0.2262;
vec3 hue(float h){return .5+.5*cos(6.2832*(h+vec3(0.,.333,.667)));}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.1;a*=.5;}return s;}
float caustic(vec2 uv,float time){vec2 p=uv*6.2832-250.;vec2 i=p;float c=1.;for(int n=0;n<3;n++){float t=time*(1.-(3.5/float(n+1)));i=p+vec2(cos(t-i.x)+sin(t+i.y),sin(t-i.y)+cos(t+i.x));c+=1./length(vec2(p.x/(sin(i.x+t)/.005),p.y/(cos(i.y+t)/.005)));}c/=3.;c=1.17-pow(c,1.4);return clamp(pow(abs(c),8.),0.,1.);}
float rings(vec2 p,float cell,float speed,float t,float dens){p.y+=t*speed;vec2 q=p/cell;vec2 id=floor(q);vec2 f=q-id;float h=hash(id);if(h>dens)return 0.;vec2 c=vec2(.3+.4*hash(id+3.1),.3+.4*hash(id+7.7));c.x+=.1*sin(t*.9+h*40.);float r=.07+.13*hash(id+1.3);float d=length(f-c);float px=1.5/cell;return smoothstep(px*1.6,0.,abs(d-r))*.9+smoothstep(r,0.,d)*.12+smoothstep(r*.5,0.,length(f-c+vec2(r*.4,r*.4)))*.5;}
float stars(vec2 p,float t){vec2 q=p/22.;vec2 id=floor(q);vec2 f=fract(q)-.5;float h=hash(id);if(h<.9)return 0.;vec2 o=vec2(hash(id+.3),hash(id+.7))-.5;float d=length(f-o*.6);float tw=.4+.6*(.5+.5*sin(t*(1.+h*3.)+h*50.));return (smoothstep(.09,0.,d)+smoothstep(.3,0.,d)*.15)*tw;}
vec3 background(vec2 p,vec2 uv){
 vec3 c;float t=uTime;
 if(uTheme==0){
  c=mix(vec3(.66,.90,1.),vec3(1.,.80,.92),smoothstep(0.,1.,uv.y));
  float ts=uRes.y/6.5;vec2 tp=p/ts;vec2 tf=abs(fract(tp)-.5);
  float grout=smoothstep(.46,.49,max(tf.x,tf.y));
  c=mix(c,c*vec3(.86,.92,1.),grout*.55);
  c+=.06*smoothstep(.45,.0,length(fract(tp)-vec2(.28)));
  c+=caustic(p/uRes.y*1.6+vec2(0.,t*.02),t*.35)*.13;
  float r=rings(p,uRes.y*.17,38.,t,.42);
  c=mix(c,vec3(1.)*.98+hue(uv.y+t*.05)*.08,clamp(r,0.,1.)*.55);
 }else if(uTheme==1){
  c=mix(vec3(.36,.88,.88),vec3(.02,.30,.50),smoothstep(0.,1.,uv.y));
  vec2 o=vec2(uRes.x*.25,-uRes.y*.25);vec2 d=p-o;float ang=atan(d.x,d.y);
  float ray=.5+.5*sin(ang*17.+t*.35)*sin(ang*7.3-t*.27);
  c+=pow(ray,3.)*.2*(1.-uv.y*.9)*vec3(.9,1.,.95);
  float sy=.86+.025*sin(p.x*.008)+.01*sin(p.x*.03);
  float sand=smoothstep(sy,sy+.04,uv.y);
  c=mix(c,vec3(.92,.82,.60)*(.85+.15*noise(p*.08)),sand);
  c+=caustic(p/uRes.y*1.2,t*.4)*(.10+.25*sand)*vec3(.9,1.,1.);
  c=mix(c,vec3(.85,1.,1.),clamp(rings(p,uRes.y*.14,60.,t,.35),0.,1.)*.4);
 }else if(uTheme==2){
  c=mix(vec3(.04,.02,.13),vec3(.20,.04,.30),smoothstep(0.,1.,uv.y));
  c+=vec3(1.,.95,.9)*stars(p,t)*(1.-uv.y)*.9;
  float band=fbm(vec2(p.x/uRes.x*3.+t*.04,t*.05));float y0=.28+.12*band;
  c+=hue(.42+band*.5+t*.02)*.30*exp(-pow((uv.y-y0)*6.,2.))*(.6+.4*sin(p.x*.01+t));
  float h=.74;if(uv.y>h){float z=1./(uv.y-h+.015);vec2 gp=vec2((uv.x-.5)*z*1.6*uRes.x/uRes.y,z*.6+t*.5);vec2 gf=abs(fract(gp)-.5);float ln=max(smoothstep(.44,.5,gf.x),smoothstep(.40,.5,gf.y));float fade=smoothstep(0.,.12,uv.y-h);c+=mix(vec3(1.,.2,.85),vec3(.2,.9,1.),uv.y)*ln*fade*.55;c+=vec3(1.,.2,.8)*exp(-(uv.y-h)*40.)*.35;}
 }else{
  c=mix(vec3(.08,.02,.10),vec3(.30,.05,.14),smoothstep(0.,1.,uv.y));
  vec2 q=p/uRes.y;
  float n1=fbm(q*2.6+vec2(t*.02,0.));float n2=fbm(q*1.8-vec2(0.,t*.015)+5.);
  c+=vec3(1.,.38,.12)*pow(n1,3.)*.9+vec3(.65,.2,1.)*pow(n2,3.)*.7;
  c+=vec3(1.,.9,.8)*stars(p,t)*.8;
  c+=vec3(1.,.4,.1)*.18*exp(-pow((uv.y-1.05)*4.,2.));
 }
 return c;
}
void main(){
 vec2 p=vec2(gl_FragCoord.x,uRes.y*uPx-gl_FragCoord.y)/uPx;
 p+=uShake;
 for(int i=0;i<4;i++){vec4 r=uRip[i];if(r.w<=0.)continue;vec2 d=p-r.xy;float L=length(d)+.001;float x=(L-r.z*650.)/80.;p+=d/L*r.w*sin(x*3.)*exp(-x*x)*exp(-r.z*1.6);}
 vec2 uv=p/uRes;
 vec3 bg=background(p,uv);
 float f=0.;vec2 g=vec2(0.);float rw=0.;
 float w1=0.,w2=0.,r1=1.,gl1=0.;vec3 c1=vec3(0.),c2=vec3(0.);vec2 g1=vec2(0.);
 for(int i=0;i<48;i++){
  if(i>=uN)break;
  vec4 b=uB[i];vec4 cc=uC[i];
  vec2 d=p-b.xy;float R=b.z*1.6;float lim=R*1.95;
  if(abs(d.x)>lim||abs(d.y)>lim)continue;
  float w4=floor(b.w/4.);float an=b.w-w4*4.;
  vec2 u=vec2(cos(an),sin(an));vec2 v=vec2(-u.y,u.x);float s=1.+cc.w;
  vec2 l=vec2(dot(d,u)/s,dot(d,v)*s);
  vec4 sp=uS[i];
  float th=atan(l.y,l.x+1e-5);
  float m=1.+sp.y*cos(2.*th+sp.x+uTime*.55)+sp.z*cos(3.*th-sp.x*1.7-uTime*.41)+sp.w*cos(5.*th+sp.x*2.3+uTime*.7);
  l/=m;
  float x=dot(l,l)/(R*R);if(x>=1.)continue;
  float q=1.-x;float w=q*q*q;
  vec2 gi=-6.*q*q/(R*R)*(l.x/s*u+l.y*s*v)/m;
  f+=w;g+=gi;rw+=b.z*w;
  if(w>w1){w2=w1;c2=c1;w1=w;c1=cc.rgb;g1=gi;r1=b.z;gl1=w4/15.;}
  else if(w>w2){w2=w;c2=cc.rgb;}
 }
 vec3 outc=bg;
 if(f>.002){
  float sep=(w1-w2)/(w1+w2+1e-5);
  vec3 base=mix(c2,c1,smoothstep(0.,.22,sep));
  float seam=(1.-smoothstep(0.,.13,sep))*smoothstep(T*.25,T*.6,w2);
  float rad=rw/f;float glow=gl1*smoothstep(0.,.3,sep);
  float halo=smoothstep(0.,T,f);halo*=halo;
  if(uDark>.5){outc+=base*halo*.38+base*glow*halo*.5;}
  else{outc=mix(outc,outc*(.5+.5*base),halo*.45);outc+=base*glow*halo*.35;}
  if(f>T*.7){
   float h=max(f-T,0.)/(1.-T);
   vec2 slU=-g/(1.-T)*rad*.42/sqrt(max(h,.003));
   const float Tc=T*.3;
   float hc=max(w1-Tc,0.)/(1.-Tc);
   vec2 slC=-g1/(1.-Tc)*r1*.42/sqrt(max(hc,.003));
   vec3 n=normalize(vec3(slU*.5+slC*.7,1.));
   vec3 Ld=normalize(vec3(-.45,-.7,.8));
   float dif=clamp(dot(n,Ld),0.,1.);
   float fres=pow(1.-n.z,2.);
   float swirl=noise(p*.011+vec2(uTime*.07,-uTime*.05));
   vec3 film=hue(fres*1.3+swirl*.7+uTime*.04+dot(n.xy,vec2(.3,.2)));

function drawGhost(){const g=S.ghost;if(S.mode!=='play'||!g)return;const [x,y]=disp(g.x,g.y),dark=WORLDS[S.world].dark,r=g.r*(1+.025*Math.sin(S.time*2.2));
 ctx.save();ctx.translate(x,y);ctx.fillStyle=dark?'rgba(255,255,255,.08)':'rgba(70,40,130,.08)';ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
 if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash*.6})`;ctx.fill()}
 ctx.setLineDash([12,10]);ctx.lineDashOffset=-S.time*18;ctx.lineWidth=4;ctx.strokeStyle=dark?'rgba(255,255,255,.8)':'rgba(70,40,130,.6)';ctx.stroke();ctx.setLineDash([]);
 if(!S.won){const fs=Math.max(18,r*(String(S.T).length>2?.62:.85));ctx.font=`700 ${fs}px Fredoka,'Arial Rounded MT Bold',system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=dark?'rgba(255,255,255,.4)':'rgba(70,40,130,.35)';ctx.fillText(S.T,0,fs*.04)}
 ctx.restore()}
function drawTools(){const A=S.act;if(!A)return;ctx.save();ctx.lineCap='round';
 if(A.type==='blow'){const b=A.b,[x,y]=disp(b.x,b.y),sx=x+b.rr*.55,sy=y+b.rr*.85,ex=sx+46,ey=sy+70;
  ctx.lineWidth=13;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([7,8]);ctx.strokeStyle='#ff4f8a';ctx.lineWidth=13;ctx.stroke();ctx.setLineDash([]);
  ctx.font=`700 ${clamp(Math.min(W,H)*.05,20,34)}px Fredoka,system-ui,sans-serif`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(40,10,60,.75)';ctx.strokeText('+'+A.n,ex+26,ey+14);ctx.fillStyle='#fff';ctx.fillText('+'+A.n,ex+26,ey+14)}
 else if(A.dir){const X=A.src,[x,y]=disp(X.x,X.y),ux=-A.dir[1],uy=A.dir[0],px=x+ux*X.rr*.9,py=y+uy*X.rr*.9,hx=px+ux*58,hy=py+uy*58;
  ctx.lineWidth=4;ctx.strokeStyle='#dfe6f0';ctx.beginPath();ctx.moveTo(px-ux*14,py-uy*14);ctx.lineTo(hx,hy);ctx.stroke();ctx.fillStyle='#ff4f8a';ctx.beginPath();ctx.arc(hx,hy,8,0,TAU);ctx.fill();ctx.fillStyle='#ffffffa0';ctx.beginPath();ctx.arc(hx-2.5,hy-2.5,2.5,0,TAU);ctx.fill()}
 ctx.restore()}
// ---------- render ----------
function disp(x,y){let px=x,py=y;for(let k=0;k<3;k++){let sx=px+shake.x,sy=py+shake.y;for(const r of ripples){const dx=sx-r.x,dy=sy-r.y,L=Math.hypot(dx,dy)+.001,xx=(L-r.t*650)/80,a=r.amp*(RM?.3:1)*Math.sin(xx*3)*Math.exp(-xx*xx)*Math.exp(-r.t*1.6);sx+=dx/L*a;sy+=dy/L*a}px+=x-sx;py+=y-sy}return[px,py]}
function render(){const all=bubbles.concat(drops);let n=0;
 for(const b of all){if(n>=MAXB)break;const i=n*4,isD=b.age!==undefined;let a=((b.a||0)%PI+PI)%PI;BA[i]=b.x+(b.sx||0);BA[i+1]=b.y;BA[i+2]=Math.max(.5,b.rr);BA[i+3]=a+4*Math.round(clamp(b.glow||0,0,1)*15);CA[i]=b.col[0];CA[i+1]=b.col[1];CA[i+2]=b.col[2];CA[i+3]=isD?0:b.k;const sp=b.s||Z4;SA[i]=sp[0];SA[i+1]=sp[1];SA[i+2]=sp[2];SA[i+3]=sp[3];n++}
 RA.fill(0);ripples.forEach((r,k)=>{RA[k*4]=r.x;RA[k*4+1]=r.y;RA[k*4+2]=r.t;RA[k*4+3]=r.amp});
 const w=WORLDS[S.world];
 gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uPx,glScale);gl.uniform1f(U.uTime,S.time);gl.uniform1i(U.uN,n);gl.uniform1i(U.uTheme,w.theme);gl.uniform1f(U.uDark,w.dark);gl.uniform2f(U.uShake,shake.x,shake.y);
 gl.uniform4fv(U['uB[0]'],BA);gl.uniform4fv(U['uC[0]'],CA);gl.uniform4fv(U['uS[0]'],SA);gl.uniform4fv(U['uRip[0]'],RA);gl.drawArrays(gl.TRIANGLES,0,3);
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 for(const r of rings){const t=r.t/.6,[x,y]=disp(r.x,r.y);ctx.globalAlpha=(1-t)*.8;ctx.lineWidth=10*(1-t)+1;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(x,y,r.r*(1+t*2.2),0,TAU);ctx.stroke()}ctx.globalAlpha=1;
 drawGhost();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
 for(const b of bubbles){if(!b.label)continue;const [x,y]=disp(b.x+(b.sx||0),b.y),L=b.label.length,fs=Math.max(15,b.rr*(L===1?1.0:L===2?.84:.64)),s=1+b.k,al=clamp(b.rr/b.r*1.5-.4,0,1);if(al<=0)continue;
  ctx.save();ctx.translate(x,y+fs*.04);ctx.rotate(b.a);ctx.scale(s,1/s);ctx.rotate(-b.a);ctx.globalAlpha=al;ctx.font=`700 ${fs}px Fredoka,'Arial Rounded MT Bold',system-ui,sans-serif`;
  const dk=b.col.map(v=>v*95|0);ctx.lineWidth=fs*.17;ctx.strokeStyle=`rgba(${dk},.75)`;ctx.strokeText(b.label,0,0);ctx.fillStyle='#fff';ctx.fillText(b.label,0,0);ctx.restore()}
 drawTools();ctx.textAlign='center';ctx.textBaseline='middle';
 for(const t of texts){const k=t.age,[x,y]=disp(t.x,t.y-k*34),sc=k<.15?.5+k/.15*.6:k<.3?1.1-(k-.15)/.15*.1:1;ctx.save();ctx.globalAlpha=clamp((1.9-k)/.5,0,1);ctx.translate(x,y);ctx.scale(sc,sc);ctx.font=`700 ${t.size}px Fredoka,'Arial Rounded MT Bold',system-ui,sans-serif`;ctx.lineWidth=t.size*.2;ctx.strokeStyle='rgba(40,10,60,.75)';ctx.strokeText(t.t,0,0);ctx.fillStyle='#fff';ctx.fillText(t.t,0,0);ctx.restore()}}
let last=0,avg=16,qT=0;
function frame(now){const raw=now-last;last=now;const dt=Math.min(.033,raw/1000||.016);avg+=(clamp(raw,1,100)-avg)*.05;qT+=dt;
 if(qT>2&&document.visibilityState==='visible'){if(avg>24&&Q>.5){Q=Math.max(.5,Q-.15);qT=0;resize()}else if(avg<15&&Q<1&&qT>6){Q=Math.min(1,Q+.1);qT=0;resize()}}
 update(dt);render();requestAnimationFrame(frame)}
// ---------- menu ----------
function applyTheme(){document.body.classList.toggle('light',!WORLDS[S.world].dark)}
function buildMenu(){const t=TX[lang];document.documentElement.lang=lang;
 $('title').innerHTML=['Bloop','Math'].map((w,j)=>'<span class="w">'+[...w].map((c,i)=>`<span style="color:rgb(${PAL[(i+j*5)%PAL.length].map(v=>v*255|0)});animation-delay:${-(i+j*5)*.17}s">${c}</span>`).join('')+'</span>').join('');
 $('sub').textContent=t.sub;$('lWorld').textContent=t.world;$('lOps').textContent=t.ops;$('play').textContent=t.play;$('explore').textContent=t.explore;$('lang').textContent=lang==='it'?'EN':'IT';
 const st=save.stars||{};
 $('worlds').innerHTML=WORLDS.map((w,i)=>`<button class="world w${i}${i===S.world?' on':''}" data-i="${i}"><span class="age">${w.age}</span><b>${w.name[lang]}</b><small>+ − ${t.up} ${w.add} · × ÷ ${t.tables} ${w.mul}</small><span class="stars">${'★'.repeat(st['w'+i]||0)}</span></button>`).join('');
 $('ops').innerHTML=['+','−','×','÷'].map(o=>`<button class="op${S.ops.has(o)?' on':''}" data-op="${o}" aria-pressed="${S.ops.has(o)}">${o}</button>`).join('');
 ['snd1','snd2'].forEach(id=>{$(id).textContent=S.muted?'🔇':'♪';$(id).style.opacity=S.muted?.6:1});applyTheme()}
$('worlds').addEventListener('click',e=>{const b=e.target.closest('.world');if(!b)return;audio();const i=+b.dataset.i;if(i!==S.world){S.world=i;S.ops=new Set(WORLDS[i].ops);SND.bloop(1+i*.15);for(const bb of bubbles){bb.kv+=4;bb.vy-=200}ripple(cx,cy,10)}buildMenu()});
$('ops').addEventListener('click',e=>{const b=e.target.closest('.op');if(!b)return;audio();const o=b.dataset.op;if(S.ops.has(o)){if(S.ops.size>1){S.ops.delete(o);SND.plop(.8)}else{SND.boing()}}else{S.ops.add(o);SND.bloop(1.2)}buildMenu()});
$('play').addEventListener('click',startGame);$('explore').addEventListener('click',startFree);
$('lang').addEventListener('click',()=>{lang=lang==='it'?'en':'it';save.lang=lang;persist();buildMenu()});
const toggleSnd=()=>{S.muted=!S.muted;save.muted=S.muted;persist();audio();buildMenu()};$('snd1').addEventListener('click',toggleSnd);$('snd2').addEventListener('click',toggleSnd);
$('home').addEventListener('click',toMenu);$('tomenu').addEventListener('click',toMenu);$('again').addEventListener('click',startGame);
$('next').addEventListener('click',()=>{S.world=Math.min(WORLDS.length-1,S.world+1);S.ops=new Set(WORLDS[S.world].ops);startGame()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.mode!=='menu')toMenu();if(e.key==='Enter'&&S.mode==='menu')startGame()});
window.__bloop={S,step:(n)=>{for(let i=0;i<n;i++)update(1/60)},get bubbles(){return bubbles},get drops(){return drops},startGame,startFree,toMenu,selectTool,resetRound};
buildMenu();resize();menuBubbles();requestAnimationFrame(frame);
})();
