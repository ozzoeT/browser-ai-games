<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;uniform float uPx;uniform float uTime;uniform int uN;uniform int uTheme;uniform float uDark;uniform vec2 uShake;
uniform vec4 uB[48];uniform vec4 uC[48];uniform vec4 uS[48];uniform vec4 uRip[4];
const float T=0.2262;
vec3 hue(float h){return .5+.5*cos(6.2832*(h+vec3(0.,.333,.667)));}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.1;a*=.5;}return s;}
float caustic(vec2 uv,float time){vec2 p=uv*6.2832-250.;vec2 i=p;float c=1.;for(int n=0;n<3;n++){float t=time*(1.-(3.5/float(n+1)));i=p+vec2(cos(t-i.x)+sin(t+i.y),sin(t-i.y)+cos(t+i.x));c+=1./length(vec2(p.x/(sin(i.x+t)/.005),p.y/(cos(i.y+t)/.005)));}c/=3.;c=1.17-pow(c,1.4);return clamp(pow(abs(c),8.),0.,1.);}
float rings(vec2 p,float cell,float speed,float t,float dens){p.y+=t*speed;vec2 q=p/cell;vec2 id=floor(q);vec2 f=q-id;float h=hash(id);if(h>dens)return 0.;vec2 c=vec2(.3+.4*hash(id+3.1),.3+.4*hash(id+7.7));c.x+=.1*sin(t*.9+h*40.);float r=.07+.13*hash(id+1.3);float d=length(f-c);float px=1.5/cell;return smoothstep(px*1.6,0.,abs(d-r))*.9+smoothstep(r,0.,d)*.12+smoothstep(r*.5,0.,length(f-c+vec2(r*.4,r*.4)))*.5;}
float stars(vec2 p,float t){vec2 q=p/22.;vec2 id=floor(q);vec2 f=fract(q)-.5;float h=hash(id);if(h<.9)return 0.;vec2 o=vec2(hash(id+.3),hash(id+.7))-.5;float d=length(f-o*.6);float tw=.4+.6*(.5+.5*sin(t*(1.+h*3.)+h*50.));return (smoothstep(.09,0.,d)+smoothstep(.3,0.,d)*.15)*tw;}
vec3 background(vec2 p,vec2 uv){
 vec3 c;float t=uTime;
 if(uTheme==0){
  c=mix(vec3(.66,.90,1.),vec3(1.,.80,.92),smoothstep(0.,1.,uv.y));
  float ts=uRes.y/6.5;vec2 tp=p/ts;vec2 tf=abs(fract(tp)-.5);
  float grout=smoothstep(.46,.49,max(tf.x,tf.y));
  c=mix(c,c*vec3(.86,.92,1.),grout*.55);
  c+=.06*smoothstep(.45,.0,length(fract(tp)-vec2(.28)));
  c+=caustic(p/uRes.y*1.6+vec2(0.,t*.02),t*.35)*.13;
  float r=rings(p,uRes.y*.17,38.,t,.42);
  c=mix(c,vec3(1.)*.98+hue(uv.y+t*.05)*.08,clamp(r,0.,1.)*.55);
 }else if(uTheme==1){
  c=mix(vec3(.36,.88,.88),vec3(.02,.30,.50),smoothstep(0.,1.,uv.y));
  vec2 o=vec2(uRes.x*.25,-uRes.y*.25);vec2 d=p-o;float ang=atan(d.x,d.y);
  float ray=.5+.5*sin(ang*17.+t*.35)*sin(ang*7.3-t*.27);
  c+=pow(ray,3.)*.2*(1.-uv.y*.9)*vec3(.9,1.,.95);
  float sy=.86+.025*sin(p.x*.008)+.01*sin(p.x*.03);
  float sand=smoothstep(sy,sy+.04,uv.y);
  c=mix(c,vec3(.92,.82,.60)*(.85+.15*noise(p*.08)),sand);
  c+=caustic(p/uRes.y*1.2,t*.4)*(.10+.25*sand)*vec3(.9,1.,1.);
  c=mix(c,vec3(.85,1.,1.),clamp(rings(p,uRes.y*.14,60.,t,.35),0.,1.)*.4);
 }else if(uTheme==2){
  c=mix(vec3(.04,.02,.13),vec3(.20,.04,.30),smoothstep(0.,1.,uv.y));
  c+=vec3(1.,.95,.9)*stars(p,t)*(1.-uv.y)*.9;
  float band=fbm(vec2(p.x/uRes.x*3.+t*.04,t*.05));float y0=.28+.12*band;
  c+=hue(.42+band*.5+t*.02)*.30*exp(-pow((uv.y-y0)*6.,2.))*(.6+.4*sin(p.x*.01+t));
  float h=.74;if(uv.y>h){float z=1./(uv.y-h+.015);vec2 gp=vec2((uv.x-.5)*z*1.6*uRes.x/uRes.y,z*.6+t*.5);vec2 gf=abs(fract(gp)-.5);float ln=max(smoothstep(.44,.5,gf.x),smoothstep(.40,.5,gf.y));float fade=smoothstep(0.,.12,uv.y-h);c+=mix(vec3(1.,.2,.85),vec3(.2,.9,1.),uv.y)*ln*fade*.55;c+=vec3(1.,.2,.8)*exp(-(uv.y-h)*40.)*.35;}
 }else{
  c=mix(vec3(.08,.02,.10),vec3(.30,.05,.14),smoothstep(0.,1.,uv.y));
  vec2 q=p/uRes.y;
  float n1=fbm(q*2.6+vec2(t*.02,0.));float n2=fbm(q*1.8-vec2(0.,t*.015)+5.);
  c+=vec3(1.,.38,.12)*pow(n1,3.)*.9+vec3(.65,.2,1.)*pow(n2,3.)*.7;
  c+=vec3(1.,.9,.8)*stars(p,t)*.8;
  c+=vec3(1.,.4,.1)*.18*exp(-pow((uv.y-1.05)*4.,2.));
 }
 return c;
}
void main(){
 vec2 p=vec2(gl_FragCoord.x,uRes.y*uPx-gl_FragCoord.y)/uPx;
 p+=uShake;
 for(int i=0;i<4;i++){vec4 r=uRip[i];if(r.w<=0.)continue;vec2 d=p-r.xy;float L=length(d)+.001;float x=(L-r.z*650.)/80.;p+=d/L*r.w*sin(x*3.)*exp(-x*x)*exp(-r.z*1.6);}
 vec2 uv=p/uRes;
 vec3 bg=background(p,uv);
 float f=0.;vec2 g=vec2(0.);float rw=0.;
 float w1=0.,w2=0.,r1=1.,gl1=0.;vec3 c1=vec3(0.),c2=vec3(0.);vec2 g1=vec2(0.);
 for(int i=0;i<48;i++){
  if(i>=uN)break;
  vec4 b=uB[i];vec4 cc=uC[i];
  vec2 d=p-b.xy;float R=b.z*1.6;float lim=R*1.95;
  if(abs(d.x)>lim||abs(d.y)>lim)continue;
  float w4=floor(b.w/4.);float an=b.w-w4*4.;
  vec2 u=vec2(cos(an),sin(an));vec2 v=vec2(-u.y,u.x);float s=1.+cc.w;
  vec2 l=vec2(dot(d,u)/s,dot(d,v)*s);
  vec4 sp=uS[i];
  float th=atan(l.y,l.x+1e-5);
  float m=1.+sp.y*cos(2.*th+sp.x+uTime*.55)+sp.z*cos(3.*th-sp.x*1.7-uTime*.41)+sp.w*cos(5.*th+sp.x*2.3+uTime*.7);
  l/=m;
  float x=dot(l,l)/(R*R);if(x>=1.)continue;
  float q=1.-x;float w=q*q*q;
  vec2 gi=-6.*q*q/(R*R)*(l.x/s*u+l.y*s*v)/m;
  f+=w;g+=gi;rw+=b.z*w;
  if(w>w1){w2=w1;c2=c1;w1=w;c1=cc.rgb;g1=gi;r1=b.z;gl1=w4/15.;}
  else if(w>w2){w2=w;c2=cc.rgb;}
 }
 vec3 outc=bg;
